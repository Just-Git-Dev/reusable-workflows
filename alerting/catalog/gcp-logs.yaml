# Log-match rules on Cloud Run revisions. GCP-only. Cloud Monitoring REQUIRES a
# notification rate limit on these, and a log-match incident never sends a
# "resolved" notification — it just closes after autoClose.
pack: gcp-logs
platforms: [gmp]
rules:
  - id: logs.crash_loop
    kind: log_match
    # GoFr writes `{"level": "FATAL", ...}` and never a `severity` key, so Cloud Logging stores
    # every GoFr entry at DEFAULT severity and `severity>=CRITICAL` never sees one. Measured on
    # <consumer-C-project-id> across the 2026-09-21 outage: severity>=CRITICAL 0, jsonPayload.level="FATAL" 6.
    # `severity>=CRITICAL` stays for apps that do set it; `textPayload:"panic:"` is an
    # UNRECOVERED Go panic (stderr, plain text). A recovered handler panic is not a crash:
    # GoFr logs it at level ERROR, returns 500, and the 5xx rules see it.
    filter: severity>=CRITICAL OR jsonPayload.level="FATAL" OR textPayload:"panic:"
    rate_limit: 300s
    severity: page
    signal: FATAL / CRITICAL log entries or unrecovered Go panics on a Cloud Run revision
    summary: Service is logging CRITICAL errors or panics
    triage: >-
      The service logged a CRITICAL entry or a Go panic, which usually means instances are
      crashing and restarting. Open the matching log entries, read the stack trace, and check
      whether the latest revision introduced it; roll back with rollback-service if so.

  - id: logs.error_match
    kind: log_match
    requires: [filter]
    rate_limit: 300s
    severity: page
    enabled: false
    signal: Log entries matching a filter you supply
    summary: Service logged an entry matching the alert filter
    triage: >-
      The service logged an entry matching the filter configured in alerts.yaml for this
      rule. Open the matching entries in Logs Explorer with the same filter and follow the
      error to its dependency; the filter itself says what the app owners consider page-worthy.

  - id: logs.gofr_app_5xx
    kind: log_match
    # GoFr's access log line is `{"message": {"uri": ..., "response": <status>, ...}}` on Cloud Run
    # stdout. Field path verified on GoFr v1.63.0 only; recheck after a GoFr upgrade. `logName:` is
    # the has-operator on the stdout log, so no project id is needed. The renderer adds
    # resource.type and the per-service scope. A new log-match policy can miss entries written in
    # its first minute or two.
    filter: logName:"run.googleapis.com%2Fstdout" AND jsonPayload.message.response>=500
    rate_limit: 1800s
    severity: page
    signal: GoFr access-log entries with a response status of 500 or more on a Cloud Run service
    summary: Service app returned a 5xx
    triage: >-
      The app itself logged a response with status 500 or more. Open the matching entries in
      Logs Explorer, read the uri and the surrounding error entries, and check whether the
      latest revision introduced it; roll back with rollback-service if so. Cloud Run request
      metrics can miss a low-volume 5xx that this log line still shows.
