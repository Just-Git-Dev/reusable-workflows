alertStrategy:
  autoClose: 1800s
  notificationRateLimit:
    period: 300s
combiner: OR
conditions:
- conditionMatchedLog:
    filter: resource.type="cloud_run_revision" AND (resource.labels.service_name="core"
      OR resource.labels.service_name="gateway") AND (jsonPayload.message:"exceeded
      the quota" OR jsonPayload.message:"could not connect")
  displayName: Service logged an entry matching the alert filter (core, gateway)
displayName: Service logged an entry matching the alert filter (core, gateway) [logs.error_match]
documentation:
  content: '**Service logged an entry matching the alert filter** — services: core,
    gateway.


    The service logged an entry matching the filter configured in alerts.yaml for
    this rule. Open the matching entries in Logs Explorer with the same filter and
    follow the error to its dependency; the filter itself says what the app owners
    consider page-worthy.


    - Rule: `logs.error_match` (pack `gcp-logs`, catalog 1.0.0)

    - Condition: any log entry matching the filter; at most one notification per 5m

    - Query: `jsonPayload.message:"exceeded the quota" OR jsonPayload.message:"could
    not connect"`


    Managed by alertgen from `infra/alerts/alerts.yaml` (rule_id `logs-error_match`).
    Change the spec, not this policy: the next apply that changes the spec overwrites
    hand edits.'
  mimeType: text/markdown
enabled: true
notificationChannels:
- NOTIFICATION_CHANNEL_PLACEHOLDER
severity: CRITICAL
userLabels:
  alertgen_owner: acme_app
  catalog_version: 1-0-0
  managed_by: alertgen
  rule_id: logs-error_match
  spec_hash: 636a8a366549c298
