    The gateway is getting 502/503 from an upstream. Check which upstream in the logs
    (jsonPayload.upstream), then that upstream''s own dashboard and recent deploys.


    - Rule: `gateway-upstream-errors` (custom rule)

    - Condition: > 0.1/s (compared as 0.1), over 10m, for 10m

    - Query: `sum by (job) (rate(gateway_upstream_error{job=~"core|gateway",code=~"502|503"}[10m]))
    > 0.1`


    Managed by alertgen from `infra/alerts/alerts.yaml` (rule_id `gateway-upstream-errors`).
    Change the spec, not this policy: the next apply that changes the spec overwrites
    hand edits.'
