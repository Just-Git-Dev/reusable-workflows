    - Rule: `bff-upstream-errors` (custom rule)

    - Condition: > 0.1/s (compared as 0.1), over 10m, for 10m

    - Query: `sum by (job) (rate(bff_upstream_error{job=~"api|issuer",code=~"502|503"}[10m]))
    > 0.1`


    Managed by alertgen from `infra/alerts/alerts.yaml` (rule_id `bff-upstream-errors`).
