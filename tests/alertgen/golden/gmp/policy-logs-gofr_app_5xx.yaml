alertStrategy:
  autoClose: 1800s
  notificationRateLimit:
    period: 1800s
combiner: OR
conditions:
- conditionMatchedLog:
    filter: resource.type="cloud_run_revision" AND (resource.labels.service_name="core"
      OR resource.labels.service_name="gateway") AND (logName:"run.googleapis.com%2Fstdout"
      AND jsonPayload.message.response>=500)
  displayName: Service app returned a 5xx (core, gateway)
displayName: Service app returned a 5xx (core, gateway) [logs.gofr_app_5xx]
documentation:
  content: '**Service app returned a 5xx** — services: core, gateway.


    The app itself logged a response with status 500 or more. Open the matching entries
    in Logs Explorer, read the uri and the surrounding error entries, and check whether
    the latest revision introduced it; roll back with rollback-service if so. Cloud
    Run request metrics can miss a low-volume 5xx that this log line still shows.


    - Rule: `logs.gofr_app_5xx` (pack `gcp-logs`, catalog 1.1.0)

    - Condition: any log entry matching the filter; at most one notification per 30m

    - Query: `logName:"run.googleapis.com%2Fstdout" AND jsonPayload.message.response>=500`


    Managed by alertgen from `infra/alerts/alerts.yaml` (rule_id `logs-gofr_app_5xx`).
    Change the spec, not this policy: the next apply that changes the spec overwrites
    hand edits.'
  mimeType: text/markdown
enabled: true
notificationChannels:
- NOTIFICATION_CHANNEL_PLACEHOLDER
severity: CRITICAL
userLabels:
  alertgen_owner: acme_app
  catalog_version: 1-1-0
  managed_by: alertgen
  rule_id: logs-gofr_app_5xx
  spec_hash: 05be8f039a77fdac
