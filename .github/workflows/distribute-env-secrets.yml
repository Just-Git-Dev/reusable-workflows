# distribute-env-secrets.yml — copy a secret the project repo holds into the ENVIRONMENT of one or
# more service repos, from a committed names-only mapping. Runs in the project repo only.
#
# Never: create a repo or an environment (a missing one fails the run), print a value, put a value
# in argv, or write anything when an environment is missing / a source is empty (all targets are
# checked before the first write). dry_run defaults to true. Page: docs/distribute-env-secrets.md.
#
# Credential: an installation token of the org's automation App (`<org>-automation`, ruling Q2,
# 2026-10-21; Environments: write), passed as app_id + app_key. See the page. Caller example
# (pin the tag):
#   jobs:
#     distribute:
#       uses: Just-Git-Dev/reusable-workflows/.github/workflows/distribute-env-secrets.yml@vX.Y.Z
#       with:
#         app_id: ${{ vars.RELEASE_APP_ID }}
#         dry_run: ${{ inputs.dry_run }}
#       secrets:
#         app_key: ${{ secrets.RELEASE_APP_KEY }}
#         sources_json: ${{ toJSON(secrets) }}
name: distribute-env-secrets

on:
  workflow_call:
    inputs:
      mapping_file:
        description: 'Path of the names-only mapping file in the calling repo.'
        required: false
        type: string
        default: '.github/distribute-env-secrets.yaml'
      environment:
        description: "The calling repo's environment the job runs in (holds the App key); main only."
        required: false
        type: string
        default: 'repo-admin'
      app_id:
        description: 'Id of the GitHub App that writes the environment secrets.'
        required: true
        type: string
      dry_run:
        description: 'Print what would be written; write nothing.'
        required: false
        type: boolean
        default: true
      only:
        description: 'Optional: distribute only this source.'
        required: false
        type: string
        default: ''
    secrets:
      app_key:
        description: 'The GitHub App private key.'
        required: true
      sources_json:
        description: 'The source secrets as a JSON object (caller passes toJSON(secrets)).'
        required: true

permissions:
  contents: read

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v5.1.0

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Require main
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::distribute-env-secrets runs from refs/heads/main only (got $REF)"
            exit 1
          fi

      - name: Checkout mapping
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate mapping
        id: validate
        shell: bash
        env:
          MAPPING_FILE: ${{ inputs.mapping_file }}
          ONLY: ${{ inputs.only }}
          SOURCES_JSON: ${{ secrets.sources_json }}
        run: |
          python3 - <<'PY'
          import json, os, sys, yaml
          try:
              doc = yaml.safe_load(open(os.environ["MAPPING_FILE"])) or {}
          except OSError as e:
              sys.exit("::error::cannot read mapping %s: %s" % (os.environ["MAPPING_FILE"], e))
          rows = doc.get("distribute") if isinstance(doc, dict) else None
          if not isinstance(rows, list):
              sys.exit("::error::mapping must hold a `distribute:` list")
          keys = ("source", "repo", "environment", "name")
          seen, bad = set(), []
          for i, r in enumerate(rows):
              if not isinstance(r, dict) or set(r) != set(keys) or not all(isinstance(r[k], str) and r[k] for k in keys):
                  bad.append("entry %d must have exactly non-empty string keys %s" % (i, ", ".join(keys)))
                  continue
              t = (r["repo"], r["environment"], r["name"])
              if t in seen:
                  bad.append("duplicate repo/environment/name: %s/%s/%s" % t)
              seen.add(t)
          if bad:
              sys.exit("\n".join("::error::" + b for b in bad))
          only = os.environ.get("ONLY", "")
          targets = [r for r in rows if not only or r["source"] == only]
          if not targets:
              sys.exit("::error::zero targets examined (mapping has %d entries, only=%r)" % (len(rows), only))
          sources = json.loads(os.environ["SOURCES_JSON"])
          # Same rule as sync-bundle-key strict_values: a whole-value placeholder is not a credential.
          import re
          ph = re.compile(r"(-|change[-_]?me|placeholder|todo|tbd|dummy|example|x{3,}|<.*>|\$\{.*\})", re.S)
          holders = sorted({r["source"] for r in targets
                            if isinstance(sources.get(r["source"]), str)
                            and ph.fullmatch(sources[r["source"]].strip().lower())})
          if holders:
              sys.exit("::error::placeholder source value(s), nothing written: " + ", ".join(holders))
          missing = sorted({r["source"] for r in targets if not sources.get(r["source"])})
          if missing:
              sys.exit("::error::empty or absent source value(s), nothing written: " + ", ".join(missing))
          with open("distribute-targets.tsv", "w") as f:
              for r in targets:
                  f.write("\t".join(r[k] for k in keys) + "\n")
          repos = sorted({r["repo"] for r in targets})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("repos<<EOF\n" + "\n".join(repos) + "\nEOF\n")
          print("validated %d target(s) in %d repo(s)" % (len(targets), len(repos)))
          PY

      - name: Mint App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.validate.outputs.repos }}
          permission-environments: write
          permission-actions: read
          permission-metadata: read

      - name: Distribute secrets
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCES_JSON: ${{ secrets.sources_json }}
          ORG: ${{ github.repository_owner }}
        run: |
          [ -s distribute-targets.tsv ] || { echo "::error::zero targets examined"; exit 1; }
          n=0
          # Pass 1: every environment must exist before anything is written (never creates one).
          while IFS=$'\t' read -r source repo env name; do
            n=$((n + 1))
            if ! err=$(gh api "repos/${ORG}/${repo}/environments/${env}" 2>&1 >/dev/null); then
              case "$err" in
                *404*|*"Not Found"*) missing="${missing:-}missing environment ${repo}/${env}; run repos-environments first"$'\n' ;;
                *) echo "::error::cannot read environment ${repo}/${env}: ${err}"; exit 1 ;;
              esac
            fi
          done < distribute-targets.tsv
          if [ -n "${missing:-}" ]; then
            printf '%s' "$missing" | sort -u | while IFS= read -r m; do echo "::error::${m}"; done
            exit 1
          fi
          # Pass 2: write (or plan). Values go on stdin only.
          {
            echo "### distribute-env-secrets"
            echo "Examined ${n} target(s); dry_run=${DRY_RUN}. Names only, no values."
          } >> "$GITHUB_STEP_SUMMARY"
          WRITTEN=""
          report_written() {
            [ -z "$WRITTEN" ] || echo "::error::run failed part-way; already written (names only):${WRITTEN}"
          }
          trap report_written ERR
          while IFS=$'\t' read -r source repo env name; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "would set ${name} in ${ORG}/${repo} environment ${env} (from ${source})"
              echo "- would set \`${name}\` in \`${repo}\` / \`${env}\`" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            SRC="$source" python3 -c 'import json,os,sys; sys.stdout.write(json.loads(os.environ["SOURCES_JSON"])[os.environ["SRC"]])' \
              | gh secret set "$name" --env "$env" --repo "${ORG}/${repo}"
            echo "set ${name} in ${ORG}/${repo} environment ${env}"
            WRITTEN="${WRITTEN} ${repo}/${env}/${name}"
            echo "- set \`${name}\` in \`${repo}\` / \`${env}\`" >> "$GITHUB_STEP_SUMMARY"
          done < distribute-targets.tsv
          echo "examined ${n} target(s)"
