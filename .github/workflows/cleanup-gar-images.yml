name: Cleanup GAR images (reusable)

# Sweeps a Google Artifact Registry Docker repo on a RELEASE-RELATIVE policy.
# Retention is defined by your release history, not by the calendar (v2.0.0 —
# see DECISIONS.md for why the age-threshold model was retired).
#
# Every artifact is one of two things, per image name:
#   RELEASE — carries a tag matching release_tag_pattern (default vX.Y.Z)
#   BUILD   — everything else: commit-sha tags, :latest-only images, other tag
#             schemes, and untagged manifests (including buildx index children)
#
# The keep-set is:
#   - the most-recent `keep_semver_count` RELEASES (ordered by createTime)
#   - every BUILD newer than the boundary release, where the boundary is the
#     `build_retention_releases`-th most recent release. That is the pending
#     builds plus a rollback window, and it is what protects the :<sha>
#     promotion source under build-once/promote-to-prod
#   - every untagged manifest that a KEPT release references as a child: GAR
#     refuses to delete a child while its parent lives, so queueing one is
#     guaranteed waste
#   - any tag in keep_tags, or matching a prefix in keep_tag_prefixes
#   - live digests referenced by ALL Cloud Run Services AND Jobs in-region
#     (cron/migration containers commonly live on Jobs, not Services)
#
# Everything else is deleted once it is more than `grace_period_days` OLDER
# than the oldest release-policy-retained image. The cutoff is anchored to your
# artifacts, not to `now`, so two sweeps minutes apart produce the same plan.
#
# THE FAIL-SAFE, and it is the point: fewer than `build_retention_releases`
# releases for an image means there is no boundary, so NOTHING is deleted for
# it. A repo that has never released, or whose release_tag_pattern is wrong, is
# left completely alone — and says so, rather than going quietly idle.
#
# The caller owns the schedule and the dry_run decision. This workflow performs
# exactly what dry_run says. Run with dry_run: true first and read the plan.
#
# Required IAM on service_account:
#   roles/artifactregistry.admin      (on the target repo). repoAdmin is NOT
#                                     enough: it manages ARTIFACTS, not
#                                     repository settings, so it lacks
#                                     artifactregistry.repositories.update and
#                                     immutable_tags_policy cannot take effect.
#   roles/run.viewer                  (to enumerate live Services + Jobs)
#
# Missing the update permission never fails the run. On an unlocked repo the
# sweep warns and proceeds; on a LOCKED one it degrades to untagged manifests
# only — tagged images are undeletable while immutable — and says so loudly.

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'GCP project id owning the Artifact Registry repo.'
        type: string
        required: true
      gcp_region:
        description: 'Region of both the Artifact Registry repo and the Cloud Run Services/Jobs.'
        type: string
        required: false
        default: 'asia-southeast1'
      wif_provider:
        description: 'Workload Identity Federation provider resource name.'
        type: string
        required: true
      service_account:
        description: 'Service account email to impersonate via WIF.'
        type: string
        required: true
      gar_repo:
        description: 'Artifact Registry repository name (e.g. backend).'
        type: string
        required: true
      keep_semver_count:
        description: >-
          Per image, keep this many of the most recent RELEASES. Minimum 2 — the
          boundary that protects your builds is itself a release, so a policy that
          keeps fewer than two cannot express one.
        type: string
        required: false
        default: '5'
      release_tag_pattern:
        description: >-
          Regex (Python re.match) identifying a production release tag. An artifact
          carrying one is a RELEASE; everything else is a BUILD. Getting this wrong
          is safe: no matches means no boundary, so nothing is ever deleted and the
          run warns that retention is inert.
        type: string
        required: false
        default: '^v\d+\.\d+\.\d+$'
      build_retention_releases:
        description: >-
          Keep BUILDS newer than the Nth-most-recent release, ordered by time rather
          than semver precedence (a backport released today must not move the
          boundary back to its version's position). 2 = pending builds plus one
          release of rollback window. Cannot exceed keep_semver_count, and with
          fewer than N releases there is no boundary and nothing is deleted.
        type: string
        required: false
        default: '2'
      grace_period_days:
        description: >-
          Reprieve for artifacts outside the keep-set: one is deleted only once it is
          more than this many days OLDER than the oldest release-policy-retained
          image. 0 deletes them on the next sweep. Measured against your artifacts,
          not the wall clock, so the plan does not drift between runs.
        type: string
        required: false
        default: '0'
      keep_tags:
        description: >-
          Comma-separated exact tags that are never deleted. `buildcache` was removed
          from this default in v2.4.0: it is only meaningful for a BuildKit *registry*
          cache (`cache-to: type=registry,ref=…:buildcache`), which is a moving tag and
          therefore unmaintainable under the default `immutable_tags_policy: enforce` —
          immutable tags let you create a tag but never move it, so such a cache freezes
          at its first push. If you run a registry cache (and are consequently NOT on
          `enforce`), set `keep_tags: latest,buildcache` explicitly.
        type: string
        required: false
        default: 'latest'
      cleanup_latest_tag:
        description: >-
          Delete a STRANDED `:latest` tag (DEFAULT true). A moving `:latest` left
          in a repository that has since been locked is otherwise permanent: the
          tag pins its digest alive, `keep_tags` shields it from the sweep, and an
          immutable repository refuses to move or remove it, so nothing ever
          converges. This removes the TAG REFERENCE only — the digest stays and is
          judged on its own merits by the NEXT sweep. Dropping `latest` from
          `keep_tags` instead is NOT equivalent: under build-once/promote a
          released digest carries both a sha tag and vX.Y.Z, so deleting the
          digest would take a release with it.
          Defaulting to true is safe because it only acts where `:latest` CANNOT
          be a live tag — under `enforce` (a moving tag is unpushable), or under
          `preserve` on an already-locked repository. Under `unlock`, or
          `preserve` on an unlocked repository, `:latest` may be a live updating
          tag and is left alone. Set false to opt out entirely.
          Unlike the sweep, this FAILS rather than degrades when the repository is
          locked and the service account cannot unlock it.
        type: boolean
        required: false
        default: true
      keep_tag_prefixes:
        description: 'Comma-separated tag prefixes that are never deleted.'
        type: string
        required: false
        default: 'hotfix-,rc-,debug-'
      immutable_tags_policy:
        description: >-
          What state the repository is left in after an applied sweep.
          `enforce` (DEFAULT) — the repository ends LOCKED whether or not it
          started that way; the sweep is the thing that makes immutable tags
          true everywhere. `preserve` — relock only if it was already locked
          (the pre-v2.1.0 behaviour); use this for a repository whose build
          still pushes a moving tag such as :latest, which an immutable
          repository rejects. `unlock` — leave it unlocked, warning loudly.
        type: string
        required: false
        default: enforce
      relock_immutable_tags:
        description: >-
          DEPRECATED — use `immutable_tags_policy`. Kept so existing callers do
          not break: setting it false still means "leave the repository
          unlocked" and is folded into `immutable_tags_policy: unlock`. Its
          default (true) no longer means anything on its own.
        type: boolean
        required: false
        default: true
      dry_run:
        description: 'true = print the plan only, delete nothing.'
        type: boolean
        required: false
        default: true
    outputs:
      candidates:
        description: 'Number of image versions selected for deletion by the plan.'
        value: ${{ jobs.cleanup.outputs.candidates }}
      deleted:
        description: 'Number of image versions actually deleted (0 on a dry run).'
        value: ${{ jobs.cleanup.outputs.deleted }}
      skipped:
        description: 'Deletions skipped because the manifest was already gone or held by a kept parent.'
        value: ${{ jobs.cleanup.outputs.skipped }}

permissions:
  contents: read
  id-token: write

concurrency:
  # Deletions run with `xargs -P 8`; never let two sweeps of the same repo
  # race on a delete-set computed before the other sweep started.
  group: cleanup-gar-${{ inputs.gcp_project }}-${{ inputs.gar_repo }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v2.4.0

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GCP_PROJECT: ${{ inputs.gcp_project }}
      GCP_REGION:  ${{ inputs.gcp_region }}
      GAR_REPO:    ${{ inputs.gar_repo }}
      REPO_PATH:   ${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project }}/${{ inputs.gar_repo }}
      KEEP_SEMVER_COUNT:     ${{ inputs.keep_semver_count }}
      RELEASE_TAG_PATTERN:   ${{ inputs.release_tag_pattern }}
      BUILD_RETENTION_RELEASES: ${{ inputs.build_retention_releases }}
      GRACE_PERIOD_DAYS:     ${{ inputs.grace_period_days }}
      KEEP_TAGS:             ${{ inputs.keep_tags }}
      KEEP_TAG_PREFIXES:     ${{ inputs.keep_tag_prefixes }}
      DRY_RUN:               ${{ inputs.dry_run }}
      POLICY_IN:             ${{ inputs.immutable_tags_policy }}
      RELOCK_IN:             ${{ inputs.relock_immutable_tags }}
    outputs:
      candidates: ${{ steps.plan.outputs.candidates }}
      deleted: ${{ steps.exec.outputs.deleted }}
      skipped: ${{ steps.exec.outputs.skipped }}

    steps:
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account:            ${{ inputs.service_account }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Collect live image digests (all Services + Jobs)
        run: |
          set -euo pipefail
          : > /tmp/live-digests.txt

          resolve() {
            local ref="$1"
            if [[ "$ref" == *@sha256:* ]]; then
              echo "${ref#*@}"
            else
              gcloud artifacts docker images describe "$ref" \
                --format='value(image_summary.digest)' 2>/dev/null || echo ""
            fi
          }

          record() {
            local kind="$1" name="$2" img="$3"
            [ -z "$img" ] && return 0
            case "$img" in
              "$REPO_PATH"/*) ;;
              *) echo "skip (other repo): $kind/$name -> $img"; return 0 ;;
            esac
            local dig
            dig=$(resolve "$img")
            if [ -z "$dig" ]; then
              echo "::error::Could not resolve live image for $kind/$name ($img). Aborting for safety."
              exit 1
            fi
            echo "$dig" >> /tmp/live-digests.txt
            echo "live: $kind/$name -> $img ($dig)"
          }

          for svc in $(gcloud run services list --region="$GCP_REGION" --project="$GCP_PROJECT" \
                         --format='value(metadata.name)'); do
            IMG=$(gcloud run services describe "$svc" --region="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
            record service "$svc" "$IMG"
          done

          for job in $(gcloud run jobs list --region="$GCP_REGION" --project="$GCP_PROJECT" \
                         --format='value(metadata.name)'); do
            IMG=$(gcloud run jobs describe "$job" --region="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format='value(spec.template.spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
            record job "$job" "$IMG"
          done

          sort -u -o /tmp/live-digests.txt /tmp/live-digests.txt
          COUNT=$(wc -l < /tmp/live-digests.txt | tr -d ' ')
          echo "Collected $COUNT live digest(s)."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No live digests resolved for $REPO_PATH. Aborting for safety."
            exit 1
          fi

      # A buildx push is an INDEX, not an image: the tag names a manifest list whose
      # children (linux/amd64, plus the `unknown/unknown` attestation) are untagged
      # manifests in their own right. GAR refuses to delete a child while its parent
      # index exists — `referenced by parent manifests` — so the untagged rule below
      # would otherwise queue, every single day, a set of digests that can never be
      # deleted, and report the run green. Resolve the parent links here so the plan
      # only ever contains work that can actually happen. Best-effort: if the registry
      # is unreachable the map is empty and we fall back to the previous behaviour
      # (queue them, let the executor absorb the error).
      - name: Resolve index → child manifests
        run: |
          set -uo pipefail
          python3 <<'PY' > /tmp/manifest-children.json
          import json, os, subprocess, sys
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import Request, urlopen

          REPO_PATH = os.environ["REPO_PATH"]
          HOST = REPO_PATH.split("/", 1)[0]

          ACCEPT = ",".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True, check=True).stdout

          try:
              token = sh("gcloud", "auth", "print-access-token").strip()
              raw = sh("gcloud", "artifacts", "docker", "images", "list",
                       REPO_PATH, "--include-tags", "--format=json")
              images = json.loads(raw)
          except Exception as exc:
              print("{}")
              print("::warning::Could not enumerate manifests (%s); parent/child links "
                    "unknown, plan may contain undeletable children." % exc, file=sys.stderr)
              raise SystemExit(0)

          def children(img):
              # `package` is host/project/repo/image; the v2 API wants everything after the host.
              name = img.get("package", "").split("/", 1)[-1]
              digest = img.get("version", "")
              url = "https://%s/v2/%s/manifests/%s" % (HOST, name, digest)
              req = Request(url, headers={"Authorization": "Bearer " + token, "Accept": ACCEPT})
              try:
                  with urlopen(req, timeout=30) as resp:
                      body = json.loads(resp.read().decode())
              except Exception as exc:
                  return ("error", digest, str(exc))
              return ("ok", digest, [m.get("digest") for m in body.get("manifests", []) if m.get("digest")])

          child_to_parent, errors = {}, 0
          with ThreadPoolExecutor(max_workers=8) as pool:
              for status, parent, payload in pool.map(children, images):
                  if status == "error":
                      errors += 1
                      continue
                  for child in payload:
                      child_to_parent[child] = parent

          print(json.dumps(child_to_parent, indent=2))
          print("Mapped %d child manifest(s) to a parent index (%d unreadable)."
                % (len(child_to_parent), errors), file=sys.stderr)
          if errors:
              print("::warning::%d manifest(s) could not be read; their children may be "
                    "queued and then skipped at execution." % errors, file=sys.stderr)
          PY

      - name: Compute delete-set (all images in repo)
        id: plan
        run: |
          python3 <<'PY' | tee /tmp/delete-plan.json
          import json, os, subprocess, re, sys
          from datetime import datetime, timedelta, timezone

          REPO_PATH = os.environ["REPO_PATH"]
          KEEP_SEMVER_COUNT = int(os.environ["KEEP_SEMVER_COUNT"])
          BUILD_RETENTION_RELEASES = int(os.environ["BUILD_RETENTION_RELEASES"])
          GRACE_PERIOD_DAYS = int(os.environ["GRACE_PERIOD_DAYS"])
          RELEASE_TAG_PATTERN = os.environ["RELEASE_TAG_PATTERN"]

          # Caller configuration is validated up front and fatally: every one of these
          # describes a policy that cannot be carried out, and running anyway would
          # delete things under a rule nobody wrote.
          if KEEP_SEMVER_COUNT < 2:
              print("::error::keep_semver_count must be at least 2 — the boundary that "
                    "protects your builds is itself a release (got %d)" % KEEP_SEMVER_COUNT,
                    file=sys.stderr)
              raise SystemExit(1)
          if BUILD_RETENTION_RELEASES < 1:
              print("::error::build_retention_releases must be at least 1 (got %d)"
                    % BUILD_RETENTION_RELEASES, file=sys.stderr)
              raise SystemExit(1)
          if BUILD_RETENTION_RELEASES > KEEP_SEMVER_COUNT:
              print("::error::build_retention_releases (%d) cannot exceed keep_semver_count "
                    "(%d): the boundary release must itself be retained, or the run would "
                    "delete the anchor it just used"
                    % (BUILD_RETENTION_RELEASES, KEEP_SEMVER_COUNT), file=sys.stderr)
              raise SystemExit(1)
          if GRACE_PERIOD_DAYS < 0:
              print("::error::grace_period_days cannot be negative (got %d)"
                    % GRACE_PERIOD_DAYS, file=sys.stderr)
              raise SystemExit(1)

          # Fail closed on a bad pattern. Treating it as "no releases" would look
          # exactly like a healthy repo that has not released yet — silent inertness
          # is the failure mode this whole version exists to remove.
          try:
              release_re = re.compile(RELEASE_TAG_PATTERN)
          except re.error as exc:
              print("::error::release_tag_pattern is not a valid regex: %s" % exc,
                    file=sys.stderr)
              raise SystemExit(1)

          def csv(name):
              return tuple(p for p in (s.strip() for s in os.environ.get(name, "").split(",")) if p)

          keep_tags = frozenset(csv("KEEP_TAGS"))
          keep_prefixes = csv("KEEP_TAG_PREFIXES")

          with open(os.environ.get("LIVE_DIGESTS_FILE", "/tmp/live-digests.txt")) as fh:
              live_digests = {ln.strip() for ln in fh if ln.strip()}

          # PLAN_FIXTURE is the CI self-test seam: read the image list from a file
          # instead of GAR, so ci.yml exercises THIS code (not a copy) against
          # synthetic registries. Unset in every real run.
          fixture = os.environ.get("PLAN_FIXTURE", "")
          if fixture:
              with open(fixture) as fh:
                  images = json.load(fh)
          else:
              raw = subprocess.check_output([
                  "gcloud", "artifacts", "docker", "images", "list",
                  REPO_PATH, "--include-tags", "--format=json",
              ])
              images = json.loads(raw)

          now = datetime.now(timezone.utc)

          # buildTime is deliberately excluded: reproducible builds report 1970-01-01,
          # which would pin every boundary to the epoch and disable the window.
          TIME_FIELDS = ("createTime", "uploadTime", "updateTime")

          # ONE clock for the whole policy. v1 read three different notions of time in
          # adjacent blocks — the keep-set ranked on raw updateTime, the boundary on the
          # oldest available field, the age rule on createTime — so the keep-set and the
          # window could disagree about which release was second-most-recent.
          #
          # The rule asks "how long has this image existed", so it reads createTime
          # first. `updateTime` answers a different question — GAR bumps it whenever a
          # tag is moved off a digest — so an actively-released repo re-ages its old
          # images on every push and they can outrun any fixed threshold indefinitely.
          # Observed: a digest pushed 2026-06-30 still read as 28d on 2026-08-11,
          # under a 30d limit, because `latest` had moved off it on 07-14.
          def created(img):
              for field in TIME_FIELDS:
                  value = img.get(field)
                  if not value:
                      continue
                  try:
                      return datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  except Exception:
                      continue
              return None

          # child digest -> parent index digest, from the resolve step. Absent or
          # unreadable ⇒ empty, and the delete loop behaves exactly as it did before.
          try:
              with open(os.environ.get("CHILD_MAP_FILE", "/tmp/manifest-children.json")) as fh:
                  child_to_parent = json.load(fh) or {}
          except Exception:
              child_to_parent = {}

          def protected(tag):
              return tag in keep_tags or (bool(keep_prefixes) and tag.startswith(keep_prefixes))

          def is_release(img):
              """An artifact is a RELEASE iff it carries a release tag. Everything else —
              sha tags, :latest-only images, other schemes, untagged manifests — is a
              BUILD. One classification, so there is no artifact the policy cannot see."""
              return any(release_re.match(tag) for tag in (img.get("tags", []) or []))

          by_pkg = {}
          for img in images:
              by_pkg.setdefault(img.get("package"), []).append(img)

          keep = set(live_digests)
          # `policy_keep` is the release-relative keep-set ALONE — releases and builds.
          # It anchors the grace cutoff. Live digests and protected tags are added to
          # `keep` further down but deliberately left out of this set: a service still
          # pinned to a year-old digest, or an ancient `buildcache` tag, would otherwise
          # drag the cutoff back with it and silently disable the sweep for the repo.
          policy_keep = set()
          retention = {}
          for pkg, imgs in by_pkg.items():
              for img in imgs:
                  if any(protected(t) for t in (img.get("tags", []) or [])):
                      keep.add(img.get("version"))

              # One clock for everything: createTime, falling back through uploadTime to
              # updateTime. Ranking on updateTime would let a moved `:latest` reorder the
              # release history, and the boundary with it.
              releases = sorted(
                  ((created(img), img) for img in imgs if is_release(img) and created(img)),
                  key=lambda r: r[0], reverse=True,
              )
              for _, img in releases[:KEEP_SEMVER_COUNT]:
                  policy_keep.add(img.get("version"))

              # Fewer releases than the window needs ⇒ no boundary ⇒ every build is kept.
              boundary = (releases[BUILD_RETENTION_RELEASES - 1]
                          if len(releases) >= BUILD_RETENTION_RELEASES else None)
              boundary_ts = boundary[0] if boundary else None

              builds = [img for img in imgs if not is_release(img)]
              for img in builds:
                  ts = created(img)
                  # No boundary, or an unreadable timestamp ⇒ keep. Both resolve toward
                  # keeping, which is the only safe direction on a destructive path.
                  if boundary_ts is None or ts is None or ts > boundary_ts:
                      policy_keep.add(img.get("version"))

              if not releases:
                  print("::warning::%s has no image tagged like a release (pattern %s) — "
                        "retention is inert for it and nothing will ever be deleted. If it "
                        "does publish releases, release_tag_pattern is wrong."
                        % (pkg, RELEASE_TAG_PATTERN), file=sys.stderr)

              retention[pkg] = {
                  "releases": len(releases),
                  "releases_kept": len(releases[:KEEP_SEMVER_COUNT]),
                  "boundary_time": boundary_ts.isoformat() if boundary_ts else None,
                  "boundary_tags": (boundary[1].get("tags", []) or []) if boundary else [],
                  "builds": len(builds),
                  # Filled in after the child pass below, which adds more builds.
                  "builds_kept": None,
                  "_builds": [b.get("version") for b in builds],
              }

          # An untagged child of a release we are KEEPING can never be deleted while its
          # parent lives, so it belongs in the keep-set rather than in a plan that
          # re-attempts it every run. Children of a DOOMED parent stay deletable: phase 1
          # removes tagged indexes first and `--delete-tags` cascades.
          for child, parent in child_to_parent.items():
              if parent in policy_keep:
                  policy_keep.add(child)

          # Recomputed here, not in the loop above: the child pass adds builds to the
          # keep-set, and a summary that under-reports what it kept is exactly the kind
          # of misleading number this version set out to remove.
          for pkg, info in retention.items():
              info["builds_kept"] = sum(1 for d in info.pop("_builds") if d in policy_keep)

          keep |= policy_keep

          # The grace cutoff, per package: an artifact outside the keep-set is deleted
          # only once it is more than GRACE_PERIOD_DAYS older than the OLDEST image the
          # release policy retained. Anchoring to the artifacts rather than to `now`
          # means the plan does not drift between two sweeps minutes apart — the whole
          # class of "why did this run plan two more than the last one" disappears.
          cutoff = {}
          for pkg, imgs in by_pkg.items():
              retained = [created(img) for img in imgs
                          if img.get("version") in policy_keep and created(img)]
              # Nothing retained by policy ⇒ no anchor ⇒ delete nothing for this package.
              cutoff[pkg] = (min(retained) - timedelta(days=GRACE_PERIOD_DAYS)
                             if retained else None)

          candidates = []
          per_pkg = {}
          for img in images:
              pkg = img.get("package")
              digest = img.get("version")
              tags = img.get("tags", []) or []
              per_pkg.setdefault(pkg, {"total": 0, "delete": 0})
              per_pkg[pkg]["total"] += 1
              ts = created(img)
              if ts is None or digest in keep:
                  continue
              edge = cutoff.get(pkg)
              if edge is None or ts >= edge:
                  continue
              candidates.append({
                  "image": f"{pkg}@{digest}",
                  "package": pkg,
                  "digest": digest,
                  "tags": tags,
                  "age_days": (now - ts).days,
                  "reason": ("outside the keep-set and older than the retention cutoff "
                             f"{edge.date().isoformat()}"),
              })

          # A child manifest is deletable only once no SURVIVING parent references it.
          # A parent that is itself being deleted this run frees its children as it
          # goes (phase 1 runs before phase 2, and `--delete-tags` cascades), so only
          # a parent that is present AND not doomed actually blocks.
          present = {img.get("version") for img in images}
          doomed = {c["digest"] for c in candidates}
          to_delete, blocked = [], []
          for cand in candidates:
              parent = child_to_parent.get(cand["digest"])
              if parent and parent in present and parent not in doomed:
                  blocked.append(dict(cand, blocked_by=parent))
              else:
                  to_delete.append(cand)
          for cand in to_delete:
              per_pkg[cand["package"]]["delete"] += 1

          print(json.dumps({
              "total_images": len(images),
              "live_digests": len(live_digests),
              "kept": len(keep),
              "keep_semver_count": KEEP_SEMVER_COUNT,
              "build_retention_releases": BUILD_RETENTION_RELEASES,
              "grace_period_days": GRACE_PERIOD_DAYS,
              "retention": retention,
              "cutoff": {p: (c.isoformat() if c else None) for p, c in cutoff.items()},
              "to_delete": to_delete,
              "blocked_by_parent": blocked,
              "per_package": per_pkg,
          }, indent=2))
          PY

          echo "candidates=$(jq '.to_delete | length' /tmp/delete-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Print summary of delete-set
        run: |
          TOTAL=$(jq '.total_images' /tmp/delete-plan.json)
          KEPT=$(jq '.kept' /tmp/delete-plan.json)
          LIVE=$(jq '.live_digests' /tmp/delete-plan.json)
          DEL=$(jq '.to_delete | length' /tmp/delete-plan.json)
          BLOCKED=$(jq '.blocked_by_parent | length' /tmp/delete-plan.json)
          {
            echo "## GAR cleanup plan — ${REPO_PATH}"
            echo ""
            echo "- Total image versions: $TOTAL"
            echo "- Live digests protected: $LIVE"
            echo "- Kept (live + semver + keep_tags/prefixes): $KEPT"
            echo "- Delete candidates: $DEL"
            echo "- Aged out but held by a surviving parent index: $BLOCKED"
            echo "- Dry run: ${DRY_RUN}"
            echo ""
            echo "> A child manifest of a surviving index cannot be deleted on its own."
            echo "> Those are reported above, not queued — they go when the parent tag does."
            echo ""
            echo "### Per image (candidates)"
            echo ""
            jq -r '.per_package | to_entries[] | "- `\(.key)` — \(.value.delete)/\(.value.total) candidates"' /tmp/delete-plan.json
            echo ""
            echo "### Retention policy"
            echo ""
            echo "- keep_semver_count: $(jq -r '.keep_semver_count' /tmp/delete-plan.json) releases"
            echo "- build_retention_releases: $(jq -r '.build_retention_releases' /tmp/delete-plan.json) (builds newer than the Nth-most-recent release)"
            echo "- grace_period_days: $(jq -r '.grace_period_days' /tmp/delete-plan.json)"
            echo ""
            jq -r '.retention | to_entries[] | "- `\(.key)` — \(.value.releases_kept)/\(.value.releases) release(s) kept, \(.value.builds_kept)/\(.value.builds) build(s) kept; boundary: \(.value.boundary_time // "NONE — too few releases, nothing will be deleted") \(.value.boundary_tags | join(","))"' /tmp/delete-plan.json
            echo ""
            echo "### Candidates"
            echo ""
            jq -r '.to_delete[] | "- `\(.image)` (\(.reason), age \(.age_days)d, tags: \(.tags | join(",") // "none"))"' /tmp/delete-plan.json
            echo ""
            echo "### Held by a surviving parent index"
            echo ""
            jq -r '.blocked_by_parent[] | "- `\(.image)` (\(.reason), age \(.age_days)d) — child of `\(.blocked_by)`"' /tmp/delete-plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Immutable tags block deletion outright: per `gcloud artifacts repositories
      # update --help`, "Tags cannot be deleted or moved to a different image digest,
      # and tagged images cannot be deleted." Untagged versions are still deletable,
      # so without this the sweep would half-succeed — untagged gone, every aged-out
      # tagged image failing — which is the worst outcome for a destructive job.
      # One enum decides the end state. The deprecated boolean is folded in here
      # rather than being consulted at the end, so exactly one value flows on and
      # no step has to reason about two half-overlapping knobs.
      - name: Resolve immutable-tag policy
        id: policy
        run: |
          p="$POLICY_IN"
          case "$p" in
            enforce|preserve|unlock) ;;
            *)
              echo "::error::immutable_tags_policy must be enforce, preserve or unlock (got '$p')" >&2
              exit 1
              ;;
          esac
          # Only an explicit false is distinguishable from the default, and it
          # has exactly one meaning, so it wins over an unset policy.
          if [ "$RELOCK_IN" = "false" ]; then
            p=unlock
            echo "::warning::relock_immutable_tags is deprecated — use immutable_tags_policy: unlock"
          fi
          echo "policy=$p" >> "$GITHUB_OUTPUT"
          echo "::notice::immutable-tag policy: $p"

          # A caller that explicitly keeps `buildcache` under `enforce` is asking us to
          # protect a BuildKit registry cache in a repository where that cache cannot be
          # maintained: immutable tags permit creating a tag but never moving one, so the
          # cache freezes at its first push and every later `cache-to` fails. Nothing
          # breaks loudly — builds just quietly stop getting cache hits — which is exactly
          # the kind of mismatch that needs saying at run time rather than in a doc.
          # Warn, never fail: the keep itself is harmless, and this is the caller's call.
          if [ "$p" = "enforce" ]; then
            # The plan step's csv() strips whitespace, so `latest, buildcache` is a
            # valid keep-set. Normalise the same way before matching, or this check
            # silently misses the spaced form it is meant to catch.
            case ",$(printf '%s' "$KEEP_TAGS" | tr -d '[:space:]')," in
              *,buildcache,*)
                {
                  echo "::warning::keep_tags contains 'buildcache' while immutable_tags_policy is 'enforce'."
                  echo "::warning::A BuildKit registry cache is a MOVING tag; an immutable repository lets it be"
                  echo "::warning::created once and never updated, so the cache freezes at its first push and"
                  echo "::warning::silently stops helping. Either drop 'buildcache' from keep_tags, or use"
                  echo "::warning::immutable_tags_policy: preserve/unlock if you really do run a registry cache."
                } >&2
                ;;
            esac
          fi

      - name: Check tag immutability
        id: immutable
        run: |
          state=$(gcloud artifacts repositories describe "$GAR_REPO" \
                    --location="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format="value(dockerConfig.immutableTags)" 2>/dev/null || echo "")
          case "$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')" in
            true) on=true ;;
            *)    on=false ;;
          esac
          echo "immutable=$on" >> "$GITHUB_OUTPUT"
          if [ "$on" = "true" ]; then
            echo "::notice::repository has immutable tags enabled"
          fi

      # Pre-flight BEFORE anything is deleted. Discovering the permission is missing
      # halfway through leaves the repo unlocked and the sweep half-done.
      # `gcloud artifacts repositories` has no test-iam-permissions subcommand, so
      # this goes through the REST endpoint.
      # Two callers now: unlocking a locked repo (mandatory — without it the sweep
      # can only half-succeed) and enforcing a lock on an unlocked one (desirable,
      # but nothing is lost by skipping it). Hence one probe, two verdicts below.
      - name: Verify permission to toggle immutability
        id: perm
        if: >-
          inputs.dry_run == false &&
          (steps.immutable.outputs.immutable == 'true' ||
           steps.policy.outputs.policy == 'enforce')
        env:
          STARTED: ${{ steps.immutable.outputs.immutable }}
          # Both warnings below interpolate ${SERVICE_ACCOUNT:-…}; without this they
          # always printed the generic fallback, which defeats the point — the message
          # exists to name the identity an operator has to grant a role to.
          SERVICE_ACCOUNT: ${{ inputs.service_account }}
        run: |
          res=$(curl -sS -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            -d '{"permissions":["artifactregistry.repositories.update"]}' \
            "https://artifactregistry.googleapis.com/v1/projects/${GCP_PROJECT}/locations/${GCP_REGION}/repositories/${GAR_REPO}:testIamPermissions")
          if printf '%s' "$res" | grep -q 'artifactregistry.repositories.update'; then
            echo "can_update=true" >> "$GITHUB_OUTPUT"
            echo "::notice::permission to toggle immutable tags confirmed"
            exit 0
          fi

          echo "can_update=false" >> "$GITHUB_OUTPUT"

          # Locked repo: tagged images cannot be deleted without unlocking, but
          # UNTAGGED manifests still can. Degrade to those rather than failing —
          # losing the permission must not take the whole sweep down with it, and
          # a registry that keeps collecting untagged buildx children is the
          # growth this job exists to stop. The run stays green but says exactly
          # what it could not do; it is never silently complete.
          if [ "$STARTED" = "true" ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            {
              echo "::warning::${SERVICE_ACCOUNT:-the deploy service account} cannot toggle immutable tags on"
              echo "::warning::${GCP_PROJECT}/${GAR_REPO}, which has them enabled. This sweep will delete only"
              echo "::warning::UNTAGGED manifests — every tagged image stays, whatever the plan says, because"
              echo "::warning::an immutable repository refuses to delete them. Retention is NOT being applied."
              echo "::warning::Grant artifactregistry.repositories.update (roles/artifactregistry.admin)."
            } >&2
            exit 0
          fi

          # Unlocked repo under `enforce`: the sweep itself is unaffected, and a
          # protection that was never there cannot be lost. Warn, sweep, move on
          # — failing here would turn a missing nice-to-have into a red pipeline.
          {
            echo "::warning::immutable_tags_policy is 'enforce' but ${SERVICE_ACCOUNT:-the deploy service account}"
            echo "::warning::cannot set immutable tags on ${GCP_PROJECT}/${GAR_REPO}. The sweep will run and the"
            echo "::warning::repository will be LEFT UNLOCKED — it already was, so nothing is lost, but the"
            echo "::warning::policy is not in effect. Grant artifactregistry.repositories.update"
            echo "::warning::(roles/artifactregistry.admin), or set immutable_tags_policy: preserve."
          } >&2

      - name: Unlock immutable tags
        if: >-
          steps.immutable.outputs.immutable == 'true' && inputs.dry_run == false &&
          steps.perm.outputs.can_update == 'true'
        run: |
          gcloud artifacts repositories update "$GAR_REPO" \
            --location="$GCP_REGION" --project="$GCP_PROJECT" --no-immutable-tags
          echo "::warning::immutable tags are OFF for ${GCP_PROJECT}/${GAR_REPO} while this sweep runs"

      - name: Execute deletions
        id: exec
        if: inputs.dry_run == false
        env:
          DEGRADED: ${{ steps.perm.outputs.degraded }}
        run: |
          set -uo pipefail

          del_one() {
            local img="$1" err rc
            err=$(gcloud artifacts docker images delete "$img" \
                    --delete-tags --quiet --project="$GCP_PROJECT" 2>&1); rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "OK deleted $img"
            elif printf '%s' "$err" | grep -q "referenced by parent manifests"; then
              echo "OK skipped(kept-parent) $img"
            elif printf '%s' "$err" | grep -qiE "not found|does not exist|NOT_FOUND"; then
              echo "OK skipped(gone) $img"
            else
              echo "FAIL $img :: $(printf '%s' "$err" | tr '\n' ' ')"
            fi
            return 0
          }
          export -f del_one
          export GCP_PROJECT

          : > /tmp/exec.log

          # Phase 1: tagged indexes first (cascades free orphaned children).
          # Skipped entirely on a degraded run: the repository is immutable and we
          # could not unlock it, so every one of these would fail. Attempting them
          # would turn a known limitation into a wall of red delete errors.
          TAGGED_SKIPPED=0
          if [ "${DEGRADED:-false}" = "true" ]; then
            TAGGED_SKIPPED=$(jq '[.to_delete[] | select((.tags|length) > 0)] | length' /tmp/delete-plan.json)
            echo "::warning::DEGRADED SWEEP — skipping $TAGGED_SKIPPED tagged image(s); the repository is"
            echo "::warning::immutable and this service account cannot unlock it. Only untagged manifests"
            echo "::warning::are being deleted, so retention is not being enforced on releases or builds."
          else
            jq -r '.to_delete[] | select((.tags|length) > 0) | .image' /tmp/delete-plan.json \
              | xargs -r -P 8 -I {} bash -c 'del_one "$@"' _ {} | tee -a /tmp/exec.log
          fi

          # Phase 2: untagged manifests.
          jq -r '.to_delete[] | select((.tags|length) == 0) | .image' /tmp/delete-plan.json \
            | xargs -r -P 8 -I {} bash -c 'del_one "$@"' _ {} | tee -a /tmp/exec.log

          DELETED=$(grep -c '^OK deleted ' /tmp/exec.log || true)
          SKIPPED=$(grep -c '^OK skipped' /tmp/exec.log || true)
          FAILED=$(grep -c '^FAIL ' /tmp/exec.log || true)
          echo "deleted=$DELETED skipped=$SKIPPED failed=$FAILED"
          {
            echo "deleted=$DELETED"
            echo "skipped=$SKIPPED"
            echo "failed=$FAILED"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Execution result"
            echo ""
            echo "- Deleted: $DELETED"
            echo "- Skipped (kept-parent child / already gone): $SKIPPED"
            echo "- Failed: $FAILED"
            if [ "${DEGRADED:-false}" = "true" ]; then
              echo "- **Skipped (degraded, tagged): $TAGGED_SKIPPED** — the repository is immutable"
              echo "  and this service account cannot unlock it. Retention is not being enforced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A plan that deletes nothing is not a quiet success. Between 2026-08-06 and
          # 2026-08-11 a caller ran six green sweeps at deleted=0/skipped=8..16, because
          # every candidate was an undeletable child — nothing in the run said so.
          # Not on a degraded run: "planned N, deleted 0" is fully explained there,
          # and this warning would read as a plan/keep-set bug instead of a grant.
          CAND=$(jq '.to_delete | length' /tmp/delete-plan.json)
          if [ "$CAND" -gt 0 ] && [ "$DELETED" -eq 0 ] && [ "${DEGRADED:-false}" != "true" ]; then
            echo "::warning::Planned $CAND deletion(s) and removed none — this sweep was a no-op. Check the plan's parent/child resolution and the keep-set."
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED deletion(s) failed for unexpected reasons:"
            grep '^FAIL ' /tmp/exec.log || true
            exit 1
          fi

      # Deliberately AFTER the sweep and BEFORE the re-lock.
      #
      # After, because the plan was built at "Compute delete-set" long before any
      # tag is touched: keeping the tag intact until the sweep has finished is what
      # preserves plan/apply parity, the property that lets a reviewed dry-run
      # digest set be trusted to match the applied run. The consequence is
      # intended and documented — once the tag is gone the digest is untagged, and
      # it is reclaimed on the NEXT run, not this one.
      #
      # Before, because deleting a tag in a locked repository is refused exactly
      # like deleting a tagged image; it needs the same unlock window.
      - name: Clean up stranded :latest tag
        id: latest
        if: inputs.cleanup_latest_tag
        env:
          DEGRADED:        ${{ steps.perm.outputs.degraded }}
          POLICY:          ${{ steps.policy.outputs.policy }}
          STARTED:         ${{ steps.immutable.outputs.immutable }}
          SERVICE_ACCOUNT: ${{ inputs.service_account }}
          DRY_RUN:         ${{ inputs.dry_run }}
        run: |
          # This is what makes defaulting to true safe. Act only where :latest
          # CANNOT be a live tag: under `enforce` a moving tag is unpushable, so
          # any :latest present is stranded by definition; under `preserve` that
          # holds only if the repository is already locked. Under `unlock`, or
          # `preserve` on an unlocked repository, the build may still be pushing
          # :latest — which is exactly what those modes exist for.
          if [ "$POLICY" = "enforce" ] || { [ "$POLICY" = "preserve" ] && [ "$STARTED" = "true" ]; }; then
            :
          else
            echo "::notice::policy '${POLICY}' leaves ${GCP_PROJECT}/${GAR_REPO} writable, so :latest may be a live tag — leaving it alone"
            echo "tags_deleted=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The sweep degrades here (skip tagged images, stay green) because losing
          # retention on some images beats failing the whole job. That trade is wrong
          # for a cleanup the caller asked for outright: exiting green having removed
          # nothing is precisely the "green tick means it did not run" failure.
          if [ "${DEGRADED:-false}" = "true" ]; then
            {
              echo "::error::cleanup_latest_tag is enabled but ${GCP_PROJECT}/${GAR_REPO} has immutable"
              echo "::error::tags enabled and ${SERVICE_ACCOUNT:-the deploy service account} cannot toggle"
              echo "::error::them, so :latest cannot be removed. Failing rather than reporting a cleanup"
              echo "::error::that did not happen. Grant artifactregistry.repositories.update"
              echo "::error::(roles/artifactregistry.admin), then re-run."
            } >&2
            exit 1
          fi

          # Packages come off the plan the sweep already built, so this never issues
          # its own repo-wide listing. `// empty` because the resolver prints {} when
          # it cannot enumerate manifests.
          PKGS=$(jq -r '.per_package // empty | keys[]' /tmp/delete-plan.json)
          if [ -z "$PKGS" ]; then
            echo "::warning::no packages in the plan — nothing to clean up" >&2
            echo "tags_deleted=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DELETED=0
          FOUND=0
          for pkg in $PKGS; do
            # EXACT match, deliberately not `--filter=tag:latest`: gcloud's `:` is a
            # has/contains operator, so a repository carrying `latest-rc` would read
            # as having `latest` and the delete would then fail on a tag that never
            # existed. awk gives string equality.
            digest=$(gcloud artifacts docker tags list "$pkg" \
                       --format='value(tag,version)' 2>/dev/null \
                       | awk -F'\t' '$1 == "latest" { print $2; exit }')

            if [ -z "$digest" ]; then
              echo "  ${pkg}:latest — not present, nothing to do"
              continue
            fi
            FOUND=$((FOUND + 1))

            if [ "$DRY_RUN" = "true" ]; then
              echo "  ${pkg}:latest — WOULD DELETE the tag (digest ${digest} would survive this run)"
              continue
            fi

            echo "  ${pkg}:latest — deleting tag (digest ${digest} survives; swept next run)"
            gcloud artifacts docker tags delete "${pkg}:latest" --quiet
            DELETED=$((DELETED + 1))
          done

          echo "tags_deleted=${DELETED}" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" -gt 0 ]; then
            {
              echo ""
              echo "### Stranded \`:latest\` cleanup"
              echo ""
              if [ "$DRY_RUN" = "true" ]; then
                echo "- Found on $FOUND package(s) — **dry run, nothing deleted**"
              else
                echo "- Tag removed from $DELETED of $FOUND package(s)"
                echo "- The digests survive this run and are judged by the next sweep."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ALWAYS. The deletion step above exits 1 on any unexpected failure, and a repo
      # left unlocked because a sweep failed is a silent loss of the protection the
      # setting exists to provide. Runs even if the job is cancelled mid-sweep.
      # Under `enforce` this is no longer a restore step: an applied sweep is the
      # thing that makes immutable tags true, so a repository that has never been
      # locked ends its first sweep locked. Still `always()` — a repo left
      # unlocked by a FAILED sweep is the silent loss this step exists to prevent.
      - name: Ensure immutable-tag end-state
        if: >-
          always() && inputs.dry_run == false &&
          (steps.immutable.outputs.immutable == 'true' ||
           steps.policy.outputs.policy == 'enforce')
        env:
          POLICY:     ${{ steps.policy.outputs.policy }}
          STARTED:    ${{ steps.immutable.outputs.immutable }}
          CAN_UPDATE: ${{ steps.perm.outputs.can_update }}
        run: |
          fix_cmd="gcloud artifacts repositories update ${GAR_REPO} --location=${GCP_REGION} --project=${GCP_PROJECT} --immutable-tags"

          if [ "$POLICY" = "unlock" ]; then
            echo "::warning::immutable_tags_policy is 'unlock' — ${GCP_PROJECT}/${GAR_REPO} is being LEFT UNLOCKED."
            echo "::warning::Tags can now be moved to a different digest. Re-enable with:"
            echo "::warning::  ${fix_cmd}"
            exit 0
          fi

          if [ "$POLICY" = "preserve" ] && [ "$STARTED" != "true" ]; then
            echo "::notice::policy 'preserve' and ${GCP_PROJECT}/${GAR_REPO} started unlocked — leaving it as it was"
            exit 0
          fi

          # The pre-flight already decided, and already spoke. A locked repo that
          # failed it was never unlocked (that step exits 1 before any deletion),
          # so there is nothing here to restore and nothing alarming to report.
          if [ "$CAN_UPDATE" != "true" ]; then
            echo "::notice::no permission to change immutability on ${GCP_PROJECT}/${GAR_REPO} — left as found"
            exit 0
          fi

          gcloud artifacts repositories update "$GAR_REPO" \
            --location="$GCP_REGION" --project="$GCP_PROJECT" --immutable-tags || true

          # Trust the readback, not the exit code: the whole point is the state
          # the repository is actually in when this run ends.
          state=$(gcloud artifacts repositories describe "$GAR_REPO" \
                    --location="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format="value(dockerConfig.immutableTags)" 2>/dev/null || echo "")
          if [ "$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            if [ "$STARTED" = "true" ]; then
              echo "::notice::immutable tags re-enabled on ${GCP_PROJECT}/${GAR_REPO}"
            else
              echo "::notice::immutable tags ENABLED on ${GCP_PROJECT}/${GAR_REPO} (policy: enforce; it started unlocked)"
            fi
            exit 0
          fi

          {
            echo "::error::FAILED TO LOCK ${GCP_PROJECT}/${GAR_REPO}. The repository is UNLOCKED:"
            echo "::error::tags can be moved to a different digest until this is fixed. Run:"
            echo "::error::  ${fix_cmd}"
          } >&2
          exit 1
