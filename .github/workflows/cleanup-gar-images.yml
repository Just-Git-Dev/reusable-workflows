name: Cleanup GAR images (reusable)

# Age-sweeps every image in a Google Artifact Registry Docker repo.
#
# The keep-set is built from:
#   - live digests referenced by ALL Cloud Run Services AND Jobs in-region
#     (cron/migration containers commonly live on Jobs, not Services)
#   - the most-recent N semver (vX.Y.Z) tags per image
#   - any tag in keep_tags, or matching a prefix in keep_tag_prefixes
#   - commit-sha-tagged images inside the release-relative retention window
#     (see "sha retention" below) — the build-once/promote-to-prod source
# Everything else is deleted once older than the untagged/tagged age limits.
#
# sha retention (build-once, promote-to-prod):
#   Under build-once, `main` publishes image:<commit-sha> and a release only
#   RETAGS that digest — so an age sweep that deletes :<sha> destroys the
#   promotion source. Per package this workflow keeps every sha-tagged image
#   newer than the (sha_retention_releases)-th most recent release, i.e. the
#   unreleased-but-pending builds plus one release worth of rollback window.
#   The pass is keep-ONLY: it can never select anything extra for deletion, so
#   enabling it can only ever delete less than before.
#
# The caller owns the schedule and the dry_run decision. This workflow performs
# exactly what dry_run says. Run with dry_run: true first and read the plan.
#
# Required IAM on service_account:
#   roles/artifactregistry.repoAdmin  (on the target repo)
#   roles/run.viewer                  (to enumerate live Services + Jobs)

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'GCP project id owning the Artifact Registry repo.'
        type: string
        required: true
      gcp_region:
        description: 'Region of both the Artifact Registry repo and the Cloud Run Services/Jobs.'
        type: string
        required: false
        default: 'asia-southeast1'
      wif_provider:
        description: 'Workload Identity Federation provider resource name.'
        type: string
        required: true
      service_account:
        description: 'Service account email to impersonate via WIF.'
        type: string
        required: true
      gar_repo:
        description: 'Artifact Registry repository name (e.g. backend).'
        type: string
        required: true
      keep_semver_count:
        description: 'Per image, keep this many of the most recent vX.Y.Z-tagged digests.'
        type: string
        required: false
        default: '5'
      untagged_max_age_days:
        description: 'Delete untagged manifests at least this many days old.'
        type: string
        required: false
        default: '15'
      tagged_max_age_days:
        description: 'Delete tagged images at least this many days old, unless in the keep-set.'
        type: string
        required: false
        default: '30'
      keep_tags:
        description: 'Comma-separated exact tags that are never deleted.'
        type: string
        required: false
        default: 'latest,buildcache'
      keep_tag_prefixes:
        description: 'Comma-separated tag prefixes that are never deleted.'
        type: string
        required: false
        default: 'hotfix-,rc-,debug-'
      sha_tag_pattern:
        description: >-
          Regex (Python re.search) identifying commit-sha tags published by a
          build-once `main` pipeline. Empty ⇒ sha retention off entirely.
        type: string
        required: false
        default: '^[0-9a-f]{40}$'
      sha_retention_releases:
        description: >-
          Keep sha-tagged images newer than the Nth-most-recent release of that
          package (releases ordered by TIME, not semver precedence). 1 = keep
          unreleased builds plus one release of rollback window. 0 ⇒ off.
        type: string
        required: false
        default: '1'
      relock_immutable_tags:
        description: >-
          Re-enable immutable tags after the sweep. DEFAULT TRUE — leave it alone
          unless you deliberately want the repository left unlocked (a maintenance
          window, or debugging a failed sweep). Setting it false removes the
          protection that stops a tag being moved to a different digest, and the
          run will say so loudly.
        type: boolean
        required: false
        default: true
      dry_run:
        description: 'true = print the plan only, delete nothing.'
        type: boolean
        required: false
        default: true
    outputs:
      candidates:
        description: 'Number of image versions selected for deletion by the plan.'
        value: ${{ jobs.cleanup.outputs.candidates }}
      deleted:
        description: 'Number of image versions actually deleted (0 on a dry run).'
        value: ${{ jobs.cleanup.outputs.deleted }}
      skipped:
        description: 'Deletions skipped because the manifest was already gone or held by a kept parent.'
        value: ${{ jobs.cleanup.outputs.skipped }}

permissions:
  contents: read
  id-token: write

concurrency:
  # Deletions run with `xargs -P 8`; never let two sweeps of the same repo
  # race on a delete-set computed before the other sweep started.
  group: cleanup-gar-${{ inputs.gcp_project }}-${{ inputs.gar_repo }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v1.24.0

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GCP_PROJECT: ${{ inputs.gcp_project }}
      GCP_REGION:  ${{ inputs.gcp_region }}
      GAR_REPO:    ${{ inputs.gar_repo }}
      REPO_PATH:   ${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project }}/${{ inputs.gar_repo }}
      KEEP_SEMVER_COUNT:     ${{ inputs.keep_semver_count }}
      UNTAGGED_MAX_AGE_DAYS: ${{ inputs.untagged_max_age_days }}
      TAGGED_MAX_AGE_DAYS:   ${{ inputs.tagged_max_age_days }}
      KEEP_TAGS:             ${{ inputs.keep_tags }}
      KEEP_TAG_PREFIXES:     ${{ inputs.keep_tag_prefixes }}
      SHA_TAG_PATTERN:        ${{ inputs.sha_tag_pattern }}
      SHA_RETENTION_RELEASES: ${{ inputs.sha_retention_releases }}
      DRY_RUN:               ${{ inputs.dry_run }}
      RELOCK:                ${{ inputs.relock_immutable_tags }}
    outputs:
      candidates: ${{ steps.plan.outputs.candidates }}
      deleted: ${{ steps.exec.outputs.deleted }}
      skipped: ${{ steps.exec.outputs.skipped }}

    steps:
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account:            ${{ inputs.service_account }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Collect live image digests (all Services + Jobs)
        run: |
          set -euo pipefail
          : > /tmp/live-digests.txt

          resolve() {
            local ref="$1"
            if [[ "$ref" == *@sha256:* ]]; then
              echo "${ref#*@}"
            else
              gcloud artifacts docker images describe "$ref" \
                --format='value(image_summary.digest)' 2>/dev/null || echo ""
            fi
          }

          record() {
            local kind="$1" name="$2" img="$3"
            [ -z "$img" ] && return 0
            case "$img" in
              "$REPO_PATH"/*) ;;
              *) echo "skip (other repo): $kind/$name -> $img"; return 0 ;;
            esac
            local dig
            dig=$(resolve "$img")
            if [ -z "$dig" ]; then
              echo "::error::Could not resolve live image for $kind/$name ($img). Aborting for safety."
              exit 1
            fi
            echo "$dig" >> /tmp/live-digests.txt
            echo "live: $kind/$name -> $img ($dig)"
          }

          for svc in $(gcloud run services list --region="$GCP_REGION" --project="$GCP_PROJECT" \
                         --format='value(metadata.name)'); do
            IMG=$(gcloud run services describe "$svc" --region="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
            record service "$svc" "$IMG"
          done

          for job in $(gcloud run jobs list --region="$GCP_REGION" --project="$GCP_PROJECT" \
                         --format='value(metadata.name)'); do
            IMG=$(gcloud run jobs describe "$job" --region="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format='value(spec.template.spec.template.spec.containers[0].image)' 2>/dev/null || echo "")
            record job "$job" "$IMG"
          done

          sort -u -o /tmp/live-digests.txt /tmp/live-digests.txt
          COUNT=$(wc -l < /tmp/live-digests.txt | tr -d ' ')
          echo "Collected $COUNT live digest(s)."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No live digests resolved for $REPO_PATH. Aborting for safety."
            exit 1
          fi

      - name: Compute delete-set (all images in repo)
        id: plan
        run: |
          python3 <<'PY' | tee /tmp/delete-plan.json
          import json, os, subprocess, re, sys
          from datetime import datetime, timezone

          REPO_PATH = os.environ["REPO_PATH"]
          KEEP_SEMVER_COUNT = int(os.environ["KEEP_SEMVER_COUNT"])
          UNTAGGED_MAX_AGE_DAYS = int(os.environ["UNTAGGED_MAX_AGE_DAYS"])
          TAGGED_MAX_AGE_DAYS = int(os.environ["TAGGED_MAX_AGE_DAYS"])
          SHA_TAG_PATTERN = os.environ.get("SHA_TAG_PATTERN", "").strip()
          SHA_RETENTION_RELEASES = int(os.environ.get("SHA_RETENTION_RELEASES", "0") or 0)

          # Fail closed on a bad pattern. Silently disabling the window would let the
          # sweep delete the promotion source — the exact failure this rule prevents.
          # Same stance as "zero live digests ⇒ abort" in the previous step.
          sha_re = None
          if SHA_TAG_PATTERN:
              try:
                  sha_re = re.compile(SHA_TAG_PATTERN)
              except re.error as exc:
                  print("::error::sha_tag_pattern is not a valid regex: %s" % exc, file=sys.stderr)
                  raise SystemExit(1)

          window_on = sha_re is not None and SHA_RETENTION_RELEASES > 0
          # The releases that DEFINE the window must not age out of the semver keep-set
          # between sweeps, or the boundary would drift and take the window with it.
          EFF_SEMVER_COUNT = (
              max(KEEP_SEMVER_COUNT, SHA_RETENTION_RELEASES + 1) if window_on else KEEP_SEMVER_COUNT
          )

          def csv(name):
              return tuple(p for p in (s.strip() for s in os.environ.get(name, "").split(",")) if p)

          keep_tags = frozenset(csv("KEEP_TAGS"))
          keep_prefixes = csv("KEEP_TAG_PREFIXES")

          with open(os.environ.get("LIVE_DIGESTS_FILE", "/tmp/live-digests.txt")) as fh:
              live_digests = {ln.strip() for ln in fh if ln.strip()}

          # PLAN_FIXTURE is the CI self-test seam: read the image list from a file
          # instead of GAR, so ci.yml exercises THIS code (not a copy) against
          # synthetic registries. Unset in every real run.
          fixture = os.environ.get("PLAN_FIXTURE", "")
          if fixture:
              with open(fixture) as fh:
                  images = json.load(fh)
          else:
              raw = subprocess.check_output([
                  "gcloud", "artifacts", "docker", "images", "list",
                  REPO_PATH, "--include-tags", "--format=json",
              ])
              images = json.loads(raw)

          now = datetime.now(timezone.utc)
          semver_re = re.compile(r"^v\d+\.\d+\.\d+$")

          # buildTime is deliberately excluded: reproducible builds report 1970-01-01,
          # which would pin every boundary to the epoch and disable the window.
          TIME_FIELDS = ("createTime", "uploadTime", "updateTime")

          def _times(img):
              out = []
              for f in TIME_FIELDS:
                  v = img.get(f)
                  if not v:
                      continue
                  try:
                      out.append(datetime.fromisoformat(str(v).replace("Z", "+00:00")))
                  except Exception:
                      continue
              return out

          # Asymmetric on purpose: newest() on the sha side, oldest() on the boundary
          # release. Every timestamp ambiguity then resolves toward KEEPING the image.
          def newest(img):
              ts = _times(img)
              return max(ts) if ts else None

          def oldest(img):
              ts = _times(img)
              return min(ts) if ts else None

          def protected(tag):
              return tag in keep_tags or (bool(keep_prefixes) and tag.startswith(keep_prefixes))

          def is_sha_tagged(img):
              return sha_re is not None and any(
                  sha_re.search(t) for t in (img.get("tags", []) or [])
              )

          by_pkg = {}
          for img in images:
              by_pkg.setdefault(img.get("package"), []).append(img)

          keep = set(live_digests)
          for pkg, imgs in by_pkg.items():
              for img in imgs:
                  tags = img.get("tags", []) or []
                  if any(protected(t) for t in tags):
                      keep.add(img.get("version"))
              semver_imgs = []
              for img in imgs:
                  for t in (img.get("tags", []) or []):
                      if semver_re.match(t):
                          semver_imgs.append((img.get("updateTime"), img.get("version")))
                          break
              # Sort on coalesced strings: a single image missing updateTime used to
              # raise TypeError (NoneType vs str) and abort the whole sweep.
              semver_imgs.sort(key=lambda kv: (kv[0] or "", kv[1] or ""), reverse=True)
              for _, digest in semver_imgs[:EFF_SEMVER_COUNT]:
                  keep.add(digest)

          # ---- sha retention window (KEEP-ONLY pass; runs before the delete loop) ----
          # Invariant: this block may only `keep.add(...)`. It never appends to
          # to_delete and never removes from keep, so enabling it can only ever delete
          # LESS than before — "never deletes more than today" is true by construction.
          sha_retention = {}
          if window_on:
              for pkg, imgs in by_pkg.items():
                  releases = [
                      (oldest(img), img)
                      for img in imgs
                      if any(semver_re.match(t) for t in (img.get("tags", []) or []))
                  ]
                  # Order releases by TIME, not semver precedence: a sha image carries no
                  # semver, so the comparison is time-based regardless, and semver order
                  # breaks on backports (v3.0.0 released long before a fresh v2.9.0 would
                  # put the boundary at the backport and delete genuine pending builds).
                  ranked = sorted(
                      (r for r in releases if r[0] is not None), key=lambda r: r[0], reverse=True
                  )
                  boundary = ranked[SHA_RETENTION_RELEASES] if len(ranked) > SHA_RETENTION_RELEASES else None
                  boundary_ts = boundary[0] if boundary else None

                  sha_imgs = [img for img in imgs if is_sha_tagged(img)]
                  kept_here = 0
                  for img in sha_imgs:
                      ts = newest(img)
                      # No boundary (too few releases) or unreadable timestamp ⇒ keep.
                      if boundary_ts is None or ts is None or ts > boundary_ts:
                          keep.add(img.get("version"))
                          kept_here += 1
                  sha_retention[pkg] = {
                      "releases": len(ranked),
                      "releases_undated": len(releases) - len(ranked),
                      "boundary_time": boundary_ts.isoformat() if boundary_ts else None,
                      "boundary_tags": (boundary[1].get("tags", []) or []) if boundary else [],
                      "sha_images": len(sha_imgs),
                      "sha_kept": kept_here,
                  }

          to_delete = []
          per_pkg = {}
          for img in images:
              pkg = img.get("package")
              digest = img.get("version")
              tags = img.get("tags", []) or []
              update_time = img.get("updateTime")
              per_pkg.setdefault(pkg, {"total": 0, "delete": 0})
              per_pkg[pkg]["total"] += 1
              if not update_time or digest in keep:
                  continue
              try:
                  ts = datetime.fromisoformat(update_time.replace("Z", "+00:00"))
              except Exception:
                  continue
              age_days = (now - ts).days
              if not tags and age_days >= UNTAGGED_MAX_AGE_DAYS:
                  reason = f"untagged>={UNTAGGED_MAX_AGE_DAYS}d"
              elif tags and age_days >= TAGGED_MAX_AGE_DAYS:
                  reason = f"tagged>={TAGGED_MAX_AGE_DAYS}d"
              else:
                  continue
              per_pkg[pkg]["delete"] += 1
              to_delete.append({
                  "image": f"{pkg}@{digest}",
                  "package": pkg,
                  "digest": digest,
                  "tags": tags,
                  "age_days": age_days,
                  "reason": reason,
              })

          print(json.dumps({
              "total_images": len(images),
              "live_digests": len(live_digests),
              "kept": len(keep),
              "sha_retention_releases": SHA_RETENTION_RELEASES if window_on else 0,
              "sha_retention": sha_retention,
              "to_delete": to_delete,
              "per_package": per_pkg,
          }, indent=2))
          PY

          echo "candidates=$(jq '.to_delete | length' /tmp/delete-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Print summary of delete-set
        run: |
          TOTAL=$(jq '.total_images' /tmp/delete-plan.json)
          KEPT=$(jq '.kept' /tmp/delete-plan.json)
          LIVE=$(jq '.live_digests' /tmp/delete-plan.json)
          DEL=$(jq '.to_delete | length' /tmp/delete-plan.json)
          {
            echo "## GAR cleanup plan — ${REPO_PATH}"
            echo ""
            echo "- Total image versions: $TOTAL"
            echo "- Live digests protected: $LIVE"
            echo "- Kept (live + semver + keep_tags/prefixes): $KEPT"
            echo "- Delete candidates: $DEL"
            echo "- Dry run: ${DRY_RUN}"
            echo ""
            echo "> Untagged child manifests of a KEPT parent index can't be deleted"
            echo "> while the parent exists — those are skipped at execution."
            echo ""
            echo "### Per image (candidates)"
            echo ""
            jq -r '.per_package | to_entries[] | "- `\(.key)` — \(.value.delete)/\(.value.total) candidates"' /tmp/delete-plan.json
            echo ""
            echo "### sha retention window (build-once promotion sources)"
            echo ""
            echo "- sha_retention_releases: $(jq -r '.sha_retention_releases' /tmp/delete-plan.json) (0 = off)"
            echo ""
            jq -r '.sha_retention | to_entries[] | "- `\(.key)` — kept \(.value.sha_kept)/\(.value.sha_images) sha image(s); \(.value.releases) release(s); boundary: \(.value.boundary_time // "none (unbounded — every sha kept)") \(.value.boundary_tags | join(","))"' /tmp/delete-plan.json
            echo ""
            echo "### Candidates"
            echo ""
            jq -r '.to_delete[] | "- `\(.image)` (\(.reason), age \(.age_days)d, tags: \(.tags | join(",") // "none"))"' /tmp/delete-plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Immutable tags block deletion outright: per `gcloud artifacts repositories
      # update --help`, "Tags cannot be deleted or moved to a different image digest,
      # and tagged images cannot be deleted." Untagged versions are still deletable,
      # so without this the sweep would half-succeed — untagged gone, every aged-out
      # tagged image failing — which is the worst outcome for a destructive job.
      - name: Check tag immutability
        id: immutable
        run: |
          state=$(gcloud artifacts repositories describe "$GAR_REPO" \
                    --location="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format="value(dockerConfig.immutableTags)" 2>/dev/null || echo "")
          case "$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')" in
            true) on=true ;;
            *)    on=false ;;
          esac
          echo "immutable=$on" >> "$GITHUB_OUTPUT"
          if [ "$on" = "true" ]; then
            echo "::notice::repository has immutable tags enabled"
          fi

      # Pre-flight BEFORE anything is deleted. Discovering the permission is missing
      # halfway through leaves the repo unlocked and the sweep half-done.
      # `gcloud artifacts repositories` has no test-iam-permissions subcommand, so
      # this goes through the REST endpoint.
      - name: Verify permission to toggle immutability
        if: steps.immutable.outputs.immutable == 'true' && inputs.dry_run == false
        run: |
          res=$(curl -sS -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            -d '{"permissions":["artifactregistry.repositories.update"]}' \
            "https://artifactregistry.googleapis.com/v1/projects/${GCP_PROJECT}/locations/${GCP_REGION}/repositories/${GAR_REPO}:testIamPermissions")
          if ! printf '%s' "$res" | grep -q 'artifactregistry.repositories.update'; then
            {
              echo "::error::${SERVICE_ACCOUNT:-the deploy service account} cannot toggle immutable tags on"
              echo "::error::${GCP_PROJECT}/${GAR_REPO}, but the repository has them enabled and this sweep"
              echo "::error::would need to unlock it to delete tagged images. Nothing has been deleted."
              echo "::error::Grant artifactregistry.repositories.update (roles/artifactregistry.admin),"
              echo "::error::or run with dry_run: true to see the plan without deleting."
            } >&2
            exit 1
          fi
          echo "::notice::permission to toggle immutable tags confirmed"

      - name: Unlock immutable tags
        if: steps.immutable.outputs.immutable == 'true' && inputs.dry_run == false
        run: |
          gcloud artifacts repositories update "$GAR_REPO" \
            --location="$GCP_REGION" --project="$GCP_PROJECT" --no-immutable-tags
          echo "::warning::immutable tags are OFF for ${GCP_PROJECT}/${GAR_REPO} while this sweep runs"

      - name: Execute deletions
        id: exec
        if: inputs.dry_run == false
        run: |
          set -uo pipefail

          del_one() {
            local img="$1" err rc
            err=$(gcloud artifacts docker images delete "$img" \
                    --delete-tags --quiet --project="$GCP_PROJECT" 2>&1); rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "OK deleted $img"
            elif printf '%s' "$err" | grep -q "referenced by parent manifests"; then
              echo "OK skipped(kept-parent) $img"
            elif printf '%s' "$err" | grep -qiE "not found|does not exist|NOT_FOUND"; then
              echo "OK skipped(gone) $img"
            else
              echo "FAIL $img :: $(printf '%s' "$err" | tr '\n' ' ')"
            fi
            return 0
          }
          export -f del_one
          export GCP_PROJECT

          : > /tmp/exec.log

          # Phase 1: tagged indexes first (cascades free orphaned children).
          jq -r '.to_delete[] | select((.tags|length) > 0) | .image' /tmp/delete-plan.json \
            | xargs -r -P 8 -I {} bash -c 'del_one "$@"' _ {} | tee -a /tmp/exec.log

          # Phase 2: untagged manifests.
          jq -r '.to_delete[] | select((.tags|length) == 0) | .image' /tmp/delete-plan.json \
            | xargs -r -P 8 -I {} bash -c 'del_one "$@"' _ {} | tee -a /tmp/exec.log

          DELETED=$(grep -c '^OK deleted ' /tmp/exec.log || true)
          SKIPPED=$(grep -c '^OK skipped' /tmp/exec.log || true)
          FAILED=$(grep -c '^FAIL ' /tmp/exec.log || true)
          echo "deleted=$DELETED skipped=$SKIPPED failed=$FAILED"
          {
            echo "deleted=$DELETED"
            echo "skipped=$SKIPPED"
            echo "failed=$FAILED"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Execution result"
            echo ""
            echo "- Deleted: $DELETED"
            echo "- Skipped (kept-parent child / already gone): $SKIPPED"
            echo "- Failed: $FAILED"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED deletion(s) failed for unexpected reasons:"
            grep '^FAIL ' /tmp/exec.log || true
            exit 1
          fi

      # ALWAYS. The deletion step above exits 1 on any unexpected failure, and a repo
      # left unlocked because a sweep failed is a silent loss of the protection the
      # setting exists to provide. Runs even if the job is cancelled mid-sweep.
      - name: Relock immutable tags
        if: always() && steps.immutable.outputs.immutable == 'true' && inputs.dry_run == false
        run: |
          if [ "${RELOCK}" != "true" ]; then
            echo "::warning::relock_immutable_tags is false — ${GCP_PROJECT}/${GAR_REPO} is being LEFT UNLOCKED."
            echo "::warning::Tags can now be moved to a different digest. Re-enable with:"
            echo "::warning::  gcloud artifacts repositories update ${GAR_REPO} --location=${GCP_REGION} --project=${GCP_PROJECT} --immutable-tags"
            exit 0
          fi

          gcloud artifacts repositories update "$GAR_REPO" \
            --location="$GCP_REGION" --project="$GCP_PROJECT" --immutable-tags || true

          # Trust the readback, not the exit code: the whole point is that the
          # repository ends this run as protected as it started.
          state=$(gcloud artifacts repositories describe "$GAR_REPO" \
                    --location="$GCP_REGION" --project="$GCP_PROJECT" \
                    --format="value(dockerConfig.immutableTags)" 2>/dev/null || echo "")
          if [ "$(printf '%s' "$state" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            echo "::notice::immutable tags re-enabled on ${GCP_PROJECT}/${GAR_REPO}"
            exit 0
          fi

          {
            echo "::error::FAILED TO RE-LOCK ${GCP_PROJECT}/${GAR_REPO}. The repository is UNLOCKED:"
            echo "::error::tags can be moved to a different digest until this is fixed. Run:"
            echo "::error::  gcloud artifacts repositories update ${GAR_REPO} --location=${GCP_REGION} --project=${GCP_PROJECT} --immutable-tags"
          } >&2
          exit 1
