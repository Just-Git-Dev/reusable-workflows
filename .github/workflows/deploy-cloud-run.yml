# Reusable Cloud Run deploy: build → push (GAR, gha-cached) → deploy.
#
# Two modes (deploy_mode):
#   update-image  (default, safest) — `gcloud run services update --image`, a
#                 strict image flip. Env/secrets/scale/SA/probes are owned by a
#                 separate provision workflow; this only moves which image is live.
#   deploy        — `gcloud run deploy`, which can create/configure the service.
#                 Pass service config through `extra_deploy_flags`.
#
# `build_only: true` publishes the image and stops — no Cloud Run mutation, no
# Deployment record. That is the `main`-side half of build-once/promote-to-prod:
# merge builds and pushes image:<commit-sha>, and a later `promote-image` run
# retags that exact digest to vX.Y.Z instead of rebuilding from source. It
# mirrors `promote-image.yml`'s `deploy_target: none`, so the two reusables are
# symmetric halves of one flow.
#
# App-specific pre-deploy gates (unit tests, version-file cross-checks, migration
# smokes) stay as their own jobs in the caller and gate this via `needs:`.
name: Build and deploy to Cloud Run (reusable)

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'GCP project id owning the Artifact Registry repo and Cloud Run service.'
        type: string
        required: true
      gcp_region:
        description: 'Region of the Artifact Registry repo and the Cloud Run service.'
        type: string
        required: false
        default: 'asia-southeast1'
      wif_provider:
        description: 'Workload Identity Federation provider resource name.'
        type: string
        required: true
      service_account:
        description: 'Releaser service account email to impersonate via WIF.'
        type: string
        required: true
      gar_repo:
        description: 'Artifact Registry repository name (e.g. backend).'
        type: string
        required: true
      image_name:
        description: 'Image name within the GAR repo (may differ from the service name).'
        type: string
        required: true
      service:
        description: 'Cloud Run service name. Optional only when build_only is true (nothing is rolled).'
        type: string
        required: false
        default: ''
      build_only:
        description: >-
          Build and push the image, then stop — no Cloud Run mutation, no
          GitHub Deployment record. Use on `main` to publish image:<commit-sha>
          for a later promote-image run to retag. Mirrors promote-image.yml's
          `deploy_target: none`.
        type: boolean
        required: false
        default: false
      image_tag:
        description: 'Image tag to build/deploy. Empty ⇒ the ref name that triggered the run.'
        type: string
        required: false
        default: ''
      checkout_ref:
        description: 'Git ref to build from. Empty ⇒ the resolved image tag. Set this when the image tag is not itself a git ref (e.g. an app-version tag like 0.1.8 decoupled from the pushed git tag v0.1.8).'
        type: string
        required: false
        default: ''
      require_semver:
        description: 'Reject a tag that is not vX.Y.Z.'
        type: boolean
        required: false
        default: true
      also_tag_latest:
        description: 'Also push/tag the image as :latest.'
        type: boolean
        required: false
        default: true
      context:
        description: 'Docker build context.'
        type: string
        required: false
        default: '.'
      dockerfile:
        description: 'Dockerfile path, relative to context.'
        type: string
        required: false
        default: 'Dockerfile'
      docker_target:
        description: >-
          Multi-stage Dockerfile stage to build (docker build --target). Empty ⇒
          the last stage, i.e. today''s behaviour. Use when one Dockerfile carries
          several leaves (e.g. a hermetic self-compiling stage for local work and a
          slimmer CI stage).
        type: string
        required: false
        default: ''
      platforms:
        description: 'Target build platform(s).'
        type: string
        required: false
        default: 'linux/amd64'
      build_args:
        description: 'Newline-separated docker build args (e.g. GOPROXY=direct).'
        type: string
        required: false
        default: ''
      provenance:
        description: >-
          docker/build-push-action `provenance:` value. Default `mode=min` reproduces
          buildx's own default (an attestation manifest alongside the image) — set
          explicitly so it survives an action bump instead of drifting silently.
        type: string
        required: false
        default: 'mode=min'
      sbom:
        description: >-
          docker/build-push-action `sbom:` value. Default `false` reproduces buildx's
          own default (buildx does not emit an SBOM unless asked).
        type: string
        required: false
        default: 'false'
      deploy_mode:
        description: 'update-image (strict flip) | deploy (full gcloud run deploy).'
        type: string
        required: false
        default: 'update-image'
      deploy_flags:
        description: 'Extra flags for deploy_mode=deploy, ONE PER LINE. Spaces within a line are preserved, so --set-env-vars=CORS=a,b or a value containing a space is safe. Preferred over extra_deploy_flags. Ignored for update-image.'
        type: string
        required: false
        default: ''
      extra_deploy_flags:
        description: 'Legacy: extra deploy flags as a single space-separated string (word-split — a space inside any value breaks argv). Prefer deploy_flags. Ignored for update-image.'
        type: string
        required: false
        default: ''
      timeout_minutes:
        description: 'Job timeout.'
        type: number
        required: false
        default: 20
      dry_run:
        description: 'Build only: do not push the image and do not mutate Cloud Run.'
        type: boolean
        required: false
        default: false
      environment:
        description: >-
          Environment name (e.g. staging, production). When set, records a GitHub
          Deployment marking this env's live commit — the git-native half of the
          live-commit record that forward-only reads back. Empty ⇒ no Deployment
          record (the service label is still stamped).
        type: string
        required: false
        default: ''
      record_github_deployment:
        description: 'Record a GitHub Deployment (needs `environment` set + `deployments: write`).'
        type: boolean
        required: false
        default: true
      enforce_forward_only:
        description: >-
          Reject a deploy whose commit is BEHIND this environment's current live
          commit (an out-of-order / older deploy). Reads the live commit from the
          latest successful GitHub Deployment for `environment`, compares via the
          GitHub compare API, blocks only when strictly behind ("block iff behind" —
          allows ahead/diverged/identical, so a stage lineage switch passes).
          Requires `environment`. Opt-in (default off). Runs before the build, so a
          blocked deploy wastes no build.
        type: boolean
        required: false
        default: false
      env_file:
        description: >-
          Path, in the checkout, of the YAML env file of plain (non-secret) config, deployed
          with `gcloud --env-vars-file`. Empty ⇒ v3 behaviour, no env file.
        type: string
        required: false
        default: ''
      generated_env:
        description: 'Newline-separated KEY=VALUE pairs the caller produces (e.g. APP_VERSION), merged into the env file. A key also in the file is refused.'
        type: string
        required: false
        default: ''
      env_secret:
        description: 'Secret Manager bundle secret (a dotenv blob, e.g. <deployable>-env) mounted as a file. Empty ⇒ no bundle handling.'
        type: string
        required: false
        default: ''
      env_mount_path:
        description: 'Path where the service mounts the bundle (required with env_secret).'
        type: string
        required: false
        default: ''
      pin_env:
        description: 'Keep the bundle mounted at a numbered version (never latest). false skips pinning and warns.'
        type: boolean
        required: false
        default: true
      manifest_retention_days:
        description: 'Retention, in days, of the config-manifest.json artifact (capped by the repository maximum).'
        type: number
        required: false
        default: 400
    outputs:
      image:
        description: 'Fully-qualified image reference that was built.'
        value: ${{ jobs.deploy.outputs.image }}
      service_url:
        description: 'Cloud Run service URL after the deploy.'
        value: ${{ jobs.deploy.outputs.service_url }}

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  # Never cancel an in-flight deploy of the same service. build_only runs mutate
  # nothing, so they key per-commit instead — a `main` build must not queue
  # behind (or serialise with) a production roll of the same service.
  group: deploy-cloud-run-${{ inputs.gcp_project }}-${{ inputs.build_only && format('build-{0}', github.sha) || inputs.service }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v3.9.0

jobs:
  deploy:
    name: build · push · ${{ inputs.build_only && 'build-only' || inputs.deploy_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      image: ${{ steps.ref.outputs.image }}
      service_url: ${{ steps.url.outputs.url }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve tag + image ref
        id: ref
        env:
          IN_TAG: ${{ inputs.image_tag }}
          FALLBACK_TAG: ${{ github.ref_name }}
          REQUIRE_SEMVER: ${{ inputs.require_semver }}
          REGION: ${{ inputs.gcp_region }}
          PROJECT: ${{ inputs.gcp_project }}
          GAR_REPO: ${{ inputs.gar_repo }}
          IMAGE_NAME: ${{ inputs.image_name }}
          ALSO_LATEST: ${{ inputs.also_tag_latest }}
          BUILD_ONLY: ${{ inputs.build_only }}
          SERVICE: ${{ inputs.service }}
        run: |
          if [ "$BUILD_ONLY" != "true" ] && [ -z "$SERVICE" ]; then
            echo "::error::'service' is required unless build_only is true" >&2
            exit 1
          fi
          TAG="${IN_TAG:-$FALLBACK_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::no image tag: pass image_tag or trigger on a tag ref" >&2
            exit 1
          fi
          if [ "$REQUIRE_SEMVER" = "true" ] && [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a vX.Y.Z semver tag (set require_semver:false to allow)" >&2
            exit 1
          fi
          BASE="${REGION}-docker.pkg.dev/${PROJECT}/${GAR_REPO}/${IMAGE_NAME}"
          # tags is a newline-separated list for docker/build-push-action.
          {
            echo "tag=$TAG"
            echo "image=${BASE}:${TAG}"
            echo "tags<<__TAGS__"
            echo "${BASE}:${TAG}"
            [ "$ALSO_LATEST" = "true" ] && echo "${BASE}:latest"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Decoupled from the image tag: checkout_ref wins, else fall back to the tag.
          ref: ${{ inputs.checkout_ref || steps.ref.outputs.tag }}
          persist-credentials: false

      - name: Resolve built commit
        id: commit
        # The exact commit that was checked out and built — stamped onto the service
        # so forward-only can read back "what is live" for this environment.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Forward-only: reject an out-of-order (older) deploy before the build.
      # The baseline is the env's latest successful GitHub Deployment; when there is none
      # (e.g. a renamed environment) it falls back to the service's jgd_commit label, which
      # needs the cloud auth above.
      - name: Forward-only guard
        # build_only rolls nothing, so there is no environment lineage to protect.
        if: ${{ inputs.enforce_forward_only && !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          HEAD: ${{ steps.commit.outputs.sha }}
          SERVICE: ${{ inputs.service }}
          PROJECT: ${{ inputs.gcp_project }}
          REGION: ${{ inputs.gcp_region }}
        run: |
          if [ -z "$ENVIRONMENT" ]; then
            echo "::error::enforce_forward_only requires 'environment' (to read the live commit)." >&2
            exit 1
          fi
          # Live baseline = sha of the most recent SUCCESSFUL deployment for the env
          # (deployment ids are monotonic, so sort desc for newest-first).
          BASE=""
          for id in $(gh api "repos/${REPO}/deployments?environment=${ENVIRONMENT}&per_page=30" \
                        --jq 'sort_by(.id) | reverse | .[].id' 2>/dev/null); do
            state="$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // ""' 2>/dev/null || echo '')"
            if [ "$state" = "success" ]; then
              BASE="$(gh api "repos/${REPO}/deployments/${id}" --jq '.sha' 2>/dev/null || echo '')"
              break
            fi
          done
          if [ -z "$BASE" ]; then
            # No successful Deployment: fall back to the live revision's commit label.
            BASE="$(gcloud --project="$PROJECT" run services describe "$SERVICE" --region="$REGION" \
                      --format='value(metadata.labels.jgd_commit)' 2>/dev/null || echo '')"
            if [ -n "$BASE" ]; then
              echo "::notice::forward-only: no successful Deployment for '${ENVIRONMENT}'; baseline is the service's jgd_commit label (${BASE})."
            fi
          fi
          if [ -z "$BASE" ]; then
            echo "::notice::forward-only: no prior successful deployment or jgd_commit label for '${ENVIRONMENT}' — allowing (no baseline)."
            exit 0
          fi
          if [ "$BASE" = "$HEAD" ]; then
            echo "::notice::forward-only: candidate equals live (${HEAD}) — no-op, allowed."
            exit 0
          fi
          # compare BASE...HEAD: 'behind' ⇒ HEAD is an ancestor of BASE ⇒ out-of-order.
          STATUS="$(gh api "repos/${REPO}/compare/${BASE}...${HEAD}" --jq '.status' 2>/dev/null || echo 'ERROR')"
          case "$STATUS" in
            behind)
              echo "::error::forward-only: candidate ${HEAD} is BEHIND live ${BASE} for '${ENVIRONMENT}' — refusing out-of-order deploy." >&2
              exit 1 ;;
            ahead|identical|diverged)
              echo "::notice::forward-only OK: ${HEAD} is '${STATUS}' relative to live ${BASE}." ;;
            *)
              # Fail closed: a safety guard must not wave a deploy through on an API error.
              echo "::error::forward-only: could not compare ${BASE}...${HEAD} (compare API error/unknown commit). Refusing; re-run, or set enforce_forward_only:false to override." >&2
              exit 1 ;;
          esac

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${{ inputs.gcp_region }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          # Empty string ⇒ build-push-action falls through to the last stage,
          # so existing callers are unaffected.
          target: ${{ inputs.docker_target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ !inputs.dry_run }}
          build-args: ${{ inputs.build_args }}
          tags: ${{ steps.ref.outputs.tags }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runtime config (v4): see docs/deploy-cloud-run.md "Runtime config (v4)".
      - name: Render env file
        id: render
        if: ${{ !inputs.build_only && (inputs.env_file != '' || inputs.generated_env != '') }}
        env:
          ENV_FILE: ${{ inputs.env_file }}
          GENERATED_ENV: ${{ inputs.generated_env }}
        run: |
          # Pure merge of env_file + generated_env into one flat YAML for --env-vars-file.
          # Secret-looking keys are refused (names only, never values).
          python3 - <<'PY'
          import hashlib, os, re, sys
          import yaml

          out = os.path.join(os.environ["RUNNER_TEMP"], "env.rendered.yaml")
          merged = {}
          path = os.environ.get("ENV_FILE", "")
          if path:
              with open(path) as f:
                  data = yaml.safe_load(f) or {}
              if not isinstance(data, dict):
                  sys.exit(f"::error::{path} must be a flat YAML mapping of KEY: value")
              merged.update({str(k): v for k, v in data.items()})
          gen = {}
          for line in os.environ.get("GENERATED_ENV", "").splitlines():
              if not line.strip():
                  continue
              k, sep, v = line.partition("=")
              if not sep or not k.strip():
                  sys.exit("::error::generated_env lines must be KEY=VALUE")
              gen[k.strip()] = v
          dup = sorted(set(gen) & set(merged))
          if dup:
              sys.exit(f"::error::key(s) in both env_file and generated_env: {', '.join(dup)}")
          merged.update(gen)
          bad = sorted(k for k in merged
                       if re.search(r"PASSWORD|SECRET|TOKEN", k.upper()) or k.upper().endswith("_URL"))
          if bad:
              sys.exit(f"::error::secret-looking key(s) in the plain env file (put them in the bundle): {', '.join(bad)}")

          def text(v):
              if isinstance(v, bool):
                  return "true" if v else "false"
              return "" if v is None else str(v)

          with open(out, "w") as f:
              yaml.safe_dump({k: text(v) for k, v in sorted(merged.items())}, f, default_flow_style=False)
          sha = hashlib.sha256(open(out, "rb").read()).hexdigest()[:8]
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"path={out}\nenv_sha={sha}\n")
          PY

      - name: Pin env bundle
        id: pin
        if: ${{ !inputs.build_only && inputs.env_secret != '' }}
        env:
          ENV_SECRET: ${{ inputs.env_secret }}
          ENV_MOUNT_PATH: ${{ inputs.env_mount_path }}
          PIN_ENV: ${{ inputs.pin_env }}
          SERVICE: ${{ inputs.service }}
          PROJECT: ${{ inputs.gcp_project }}
          REGION: ${{ inputs.gcp_region }}
        run: |
          if [ "$PIN_ENV" != "true" ]; then
            echo "::warning::pin_env is false: the bundle ${ENV_SECRET} is NOT pinned to a version by this deploy." >&2
            exit 0
          fi
          if [ -z "$ENV_MOUNT_PATH" ]; then
            echo "::error::env_mount_path is required with env_secret" >&2
            exit 1
          fi
          # The version the live service mounts the bundle at (empty if no service yet).
          CUR="$(gcloud --project="$PROJECT" run services describe "$SERVICE" --region="$REGION" --format=json 2>/dev/null \
                  | jq -r --arg s "$ENV_SECRET" \
                    '[.spec.template.spec.volumes[]? | select(.secret.secretName == $s) | .secret.items[]?.version][0] // ""' \
                  || echo '')"
          if [[ "$CUR" =~ ^[0-9]+$ ]]; then
            N="$CUR"          # a numeric pin: a deploy never moves it
          else
            # latest (a v3 service) or not mounted yet: resolve the newest ENABLED version.
            N="$(gcloud secrets versions list "$ENV_SECRET" --project="$PROJECT" \
                   --filter='state=ENABLED' --format='value(name)' | sort -n | tail -n 1)"
            if ! [[ "$N" =~ ^[0-9]+$ ]]; then
              echo "::error::no ENABLED version of secret ${ENV_SECRET}" >&2
              exit 1
            fi
          fi
          {
            echo "env_version=$N"
            echo "update_secrets=${ENV_MOUNT_PATH}=${ENV_SECRET}:${N}"
          } >> "$GITHUB_OUTPUT"

      - name: Read bundle key names
        id: bundle
        if: ${{ !inputs.build_only && !inputs.dry_run && steps.pin.outputs.env_version != '' }}
        env:
          ENV_SECRET: ${{ inputs.env_secret }}
          ENV_VERSION: ${{ steps.pin.outputs.env_version }}
          PROJECT: ${{ inputs.gcp_project }}
        run: |
          # Key NAMES only (the part before '='); values never leave the pipe.
          KEYS="$(gcloud secrets versions access "$ENV_VERSION" --secret="$ENV_SECRET" --project="$PROJECT" \
                    | sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' | paste -sd, -)"
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        if: ${{ !inputs.build_only }}
        env:
          ENV_RENDERED: ${{ steps.render.outputs.path }}
          ENV_SHA: ${{ steps.render.outputs.env_sha }}
          ENV_VERSION: ${{ steps.pin.outputs.env_version }}
          UPDATE_SECRETS: ${{ steps.pin.outputs.update_secrets }}
          RUN_ID: ${{ github.run_id }}
          IMAGE: ${{ steps.ref.outputs.image }}
          SERVICE: ${{ inputs.service }}
          PROJECT: ${{ inputs.gcp_project }}
          REGION: ${{ inputs.gcp_region }}
          MODE: ${{ inputs.deploy_mode }}
          DEPLOY_FLAGS: ${{ inputs.deploy_flags }}
          EXTRA: ${{ inputs.extra_deploy_flags }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Stamp the live commit, bundle version, env-file hash and run as resource
          # labels (keys are slash-free). The v4 labels appear only when their input exists.
          LABELS=""
          [ -n "$COMMIT" ] && LABELS="jgd_commit=$COMMIT"
          [ -n "$ENV_VERSION" ] && LABELS="${LABELS:+$LABELS,}jgd_env_version=$ENV_VERSION"
          [ -n "$ENV_SHA" ] && LABELS="${LABELS:+$LABELS,}jgd_env_sha=$ENV_SHA"
          [ -n "$ENV_SHA$ENV_VERSION" ] && LABELS="${LABELS:+$LABELS,}jgd_run=$RUN_ID"
          LABEL=()
          [ -n "$LABELS" ] && LABEL=(--update-labels="$LABELS")
          # v4 runtime config: the rendered env file and the version-pinned bundle mount.
          [ -n "$ENV_RENDERED" ] && LABEL+=(--env-vars-file="$ENV_RENDERED")
          [ -n "$UPDATE_SECRETS" ] && LABEL+=(--update-secrets="$UPDATE_SECRETS")
          if [ "$MODE" = "update-image" ]; then
            set -- gcloud run services update "$SERVICE" \
              --project="$PROJECT" --region="$REGION" --image="$IMAGE" "${LABEL[@]}"
          elif [ "$MODE" = "deploy" ]; then
            args=(gcloud run deploy "$SERVICE"
              --project="$PROJECT" --region="$REGION" --image="$IMAGE" "${LABEL[@]}")
            # Preferred: one flag per line — spaces within a line are preserved.
            if [ -n "$DEPLOY_FLAGS" ]; then
              while IFS= read -r flag; do
                [ -z "$flag" ] && continue
                args+=("$flag")
              done <<< "$DEPLOY_FLAGS"
            fi
            # Legacy: single space-separated string. Intentional word-split; a space
            # inside any value breaks — that's why deploy_flags exists.
            if [ -n "$EXTRA" ]; then
              # shellcheck disable=SC2206
              args+=($EXTRA)
            fi
            set -- "${args[@]}"
          else
            echo "::error::deploy_mode must be 'update-image' or 'deploy' (got '$MODE')" >&2
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — would execute:"
            printf ' %q' "$@"; echo
            exit 0
          fi
          "$@"

      - name: Record GitHub Deployment (live-commit marker)
        if: ${{ inputs.environment != '' && inputs.record_github_deployment && !inputs.dry_run && !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          # Best-effort audit record: the deploy already happened, so a Deployments
          # API hiccup must NOT fail the job. Warn and move on.
          [ -z "$COMMIT" ] && { echo "::warning::no commit resolved; skipping Deployment record." >&2; exit 0; }
          BODY="$(jq -nc \
            --arg ref "$COMMIT" --arg env "$ENVIRONMENT" --arg desc "deploy ${IMAGE}" \
            '{ref:$ref, environment:$env, description:$desc, auto_merge:false, required_contexts:[]}')"
          DEP_ID="$(printf '%s' "$BODY" | gh api "repos/${REPO}/deployments" --input - --jq '.id' 2>/dev/null || true)"
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            echo "::warning::could not create GitHub Deployment (missing deployments: write, or API conflict); service label still stamped." >&2
            exit 0
          fi
          gh api "repos/${REPO}/deployments/${DEP_ID}/statuses" \
            -f state=success -f environment="$ENVIRONMENT" -f description="deploy ${IMAGE}" >/dev/null 2>&1 \
            || echo "::warning::deployment #${DEP_ID} created but status update failed." >&2
          echo "::notice::recorded GitHub Deployment #${DEP_ID} (${ENVIRONMENT} @ ${COMMIT})"

      - name: Write config manifest
        id: manifest
        if: ${{ !inputs.build_only && !inputs.dry_run && (inputs.env_file != '' || inputs.generated_env != '' || inputs.env_secret != '') }}
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ENV_VERSION: ${{ steps.pin.outputs.env_version }}
          GENERATED_ENV: ${{ inputs.generated_env }}
          BUNDLE_KEYS: ${{ steps.bundle.outputs.keys }}
          RENDERED_PATH: ${{ steps.render.outputs.path }}
          SERVICE: ${{ inputs.service }}
          PROJECT: ${{ inputs.gcp_project }}
          REGION: ${{ inputs.gcp_region }}
        run: |
          # The revision this deploy created; the rendered file is the non-secret config.
          REVISION="${REVISION:-$(gcloud --project="$PROJECT" run services describe "$SERVICE" --region="$REGION" \
                      --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo '')}"
          export REVISION
          RENDERED="${RENDERED:-}"
          if [ -z "$RENDERED" ] && [ -n "$RENDERED_PATH" ]; then RENDERED="$(cat "$RENDERED_PATH")"; fi
          export RENDERED
          python3 - <<'PY'
          import json, os
          import yaml

          rendered = yaml.safe_load(os.environ.get("RENDERED", "")) or {}
          gen = {l.partition("=")[0].strip() for l in os.environ.get("GENERATED_ENV", "").splitlines() if "=" in l}
          keys = [{"name": k, "source": "generated" if k in gen else "file", "value": str(v)}
                  for k, v in sorted(rendered.items())]
          keys += [{"name": k, "source": "bundle"}
                   for k in sorted(filter(None, os.environ.get("BUNDLE_KEYS", "").split(",")))]
          ver = os.environ.get("ENV_VERSION", "")
          m = {"commit": os.environ["COMMIT"], "image_digest": os.environ.get("IMAGE_DIGEST", ""),
               "revision": os.environ.get("REVISION", ""),
               "env_secret_version": int(ver) if ver.isdigit() else None, "keys": keys}
          with open(os.path.join(os.environ["RUNNER_TEMP"], "config-manifest.json"), "w") as f:
              json.dump(m, f, indent=2)
          summary = ["", "### Config manifest", "", "| key | source | value |", "|---|---|---|"]
          summary += [f"| `{k['name']}` | {k['source']} | {('`' + k['value'] + '`') if 'value' in k else ''} |" for k in keys]
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as f:
              f.write("\n".join(summary) + "\n")
          PY

      - name: Upload config manifest
        if: ${{ steps.manifest.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-manifest
          path: ${{ runner.temp }}/config-manifest.json
          retention-days: ${{ inputs.manifest_retention_days }}

      - name: Get service URL
        id: url
        if: ${{ always() && !inputs.dry_run && !inputs.build_only }}
        env:
          SERVICE: ${{ inputs.service }}
          PROJECT: ${{ inputs.gcp_project }}
          REGION: ${{ inputs.gcp_region }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          URL: ${{ steps.url.outputs.url }}
          MODE: ${{ inputs.build_only && 'build-only (no Cloud Run mutation)' || inputs.deploy_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          TITLE: ${{ inputs.build_only && format('build-only — {0}', inputs.image_name) || format('deploy — {0}', inputs.service) }}
        run: |
          # `if`, not `[ -n … ] && echo`: this group is the LAST statement in the
          # step, so the group's status is the script's status. A trailing
          # AND-list that evaluates false returns 1 and fails an otherwise
          # successful job — which is exactly what build_only (URL always empty)
          # and dry_run did.
          SUFFIX=""
          [ "$DRY_RUN" = "true" ] && SUFFIX=" (dry run)"
          {
            echo "## Cloud Run $TITLE"
            echo ""
            echo "- Mode: \`$MODE\`$SUFFIX"
            echo "- Image: \`$IMAGE\`"
            if [ -n "${URL:-}" ]; then
              echo "- Service URL: $URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
