name: Sync keys into Secret Manager bundle (reusable)

# A THIN WRAPPER since v4.1.0: the one job below calls the composite action
# actions/sync-bundle-key, where all the logic lives (scripts beside action.yml). Inputs,
# secret and outputs are unchanged. A caller whose secrets are in an ENVIRONMENT and who is in
# another org cannot use this workflow (environment secrets do not cross the org boundary into
# a reusable workflow); it calls the action from its own environment job instead:
# docs/sync-bundle-key-action.md.

# Upserts one or more keys into a Secret Manager "bundle" secret — a dotenv
# blob of KEY=value lines mounted into Cloud Run — adds a new secret version,
# rolls the named Cloud Run service(s) onto it, and disables the old version.
#
# The key->value payload is a single JSON secret (`payload_json`) whose KEYS are
# the DESTINATION bundle keys. That absorbs both the number of keys and any
# naming drift between projects without branching in this workflow. Build it in
# the caller with toJSON() so values stay masked:
#
#   payload_json: |
#     {"DB_PASSWORD": ${{ toJSON(secrets.DB_PASSWORD) }},
#      "REDIS_PASSWORD": ${{ toJSON(secrets.REDIS_PASSWORD) }}}
#
# ORDERING CONTRACT: the previous secret version is disabled only after EVERY
# service has rolled successfully. If any roll fails the job fails with the old
# version still enabled, so no running service is left pointing at a disabled
# secret version.
#
# Required IAM on service_account:
#   roles/secretmanager.secretVersionManager  (on bundle_secret)
#   roles/secretmanager.secretAccessor        (on bundle_secret)
#   roles/run.developer                       (on the target services)
#   secretmanager.secrets.get                 (on bundle_secret; the existence check needs it)

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'GCP project id holding the bundle secret and the Cloud Run services.'
        type: string
        required: true
      gcp_region:
        description: 'Region of the Cloud Run services.'
        type: string
        required: false
        default: 'asia-southeast1'
      wif_provider:
        description: 'Workload Identity Federation provider resource name.'
        type: string
        required: true
      service_account:
        description: 'Service account email to impersonate via WIF.'
        type: string
        required: true
      bundle_secret:
        description: 'Secret Manager bundle secret name.'
        type: string
        required: false
        default: 'app-secrets'
      mount_path:
        description: >-
          Container path the bundle is mounted at — must match where the service already
          mounts it (e.g. /secrets/app.env). No default since v3.0.0: --update-secrets adds
          a mount and never removes one, so a guessed path is silently wrong.
        type: string
        required: true
      services_csv:
        description: 'Comma-separated Cloud Run service names to roll onto the new version.'
        type: string
        required: true
      title:
        description: 'Human label for the run summary (e.g. "DB + Redis passwords").'
        type: string
        required: false
        default: 'secrets'
      dry_run:
        description: 'true = validate the payload and print the plan; write nothing, roll nothing.'
        type: boolean
        required: false
        default: false
      min_value_length:
        description: >-
          Reject the run if any payload value is shorter than this many characters.
          Guards against distributing a placeholder that is technically a valid
          non-empty string but cannot be a credential. Set to 0 to disable.
        type: number
        required: false
        default: 8
      strict_values:
        description: >-
          true (DEFAULT since v4.0.0; it was false in v3.x) = also refuse payload keys that
          are not env-var names (^[A-Za-z_][A-Za-z0-9_]*$), empty or whitespace-only values
          (even with min_value_length 0), and values that are wholly a placeholder ("-",
          changeme, todo, xxx..., <...>, ${...}). Set false to keep the v3 leniency while
          the payload is fixed. A newline, CR or NUL in a key or value is refused
          regardless, because it corrupts the bundle.
        type: boolean
        required: false
        default: true
      environment:
        description: >-
          GitHub environment the job runs in (the job's environment key is set from this).
          Empty = no environment, as in v3. When set, step S0 refuses an environment
          without a deployment branch policy (unless require_branch_policy is false).
        type: string
        required: false
        default: ''
      require_branch_policy:
        description: 'Step S0: refuse an environment with no deployment branch policy. Only meaningful with environment.'
        type: boolean
        required: false
        default: true
      payload_source:
        description: >-
          caller = the payload_json secret. environment = build the payload from the keys
          named in secret_keys_file, read from the job's environment secrets. Does NOT work
          from another organisation through this workflow: use the composite action
          actions/sync-bundle-key (docs/sync-bundle-key-action.md).
        type: string
        required: false
        default: 'caller'
      mode:
        description: >-
          replace (DEFAULT since v4.0.0) = (current bundle limited to the keys listed in
          secret_keys_file) overlaid with the payload; unlisted keys are dropped and a listed
          key found in neither the payload nor the bundle is refused. merge = the v3
          behaviour: current bundle overlaid with the payload, nothing dropped.
        type: string
        required: false
        default: 'replace'
      secret_keys_file:
        description: >-
          Committed list of bundle key NAMES, one per line (# comments allowed), read from the
          caller's checkout. Required when mode is replace or payload_source is environment.
        type: string
        required: false
        default: 'deploy/secret-keys.txt'
      confirm_removed:
        description: >-
          CSV of key names. A live run that would drop keys refuses unless this equals the
          dropped set exactly.
        type: string
        required: false
        default: ''
      pin_versions:
        description: >-
          true (DEFAULT since v4.0.0) = roll with <bundle>:<N+1> and the jgd_env_version /
          jgd_run labels. false = the v3 :latest roll.
        type: boolean
        required: false
        default: true
      keep_enabled_count:
        description: >-
          A FLOOR under the keep-set. After a successful roll the versions kept
          ENABLED are the new one, the versions pinned by the two newest previous
          revisions of every rolled service, and at least this many of the most
          recent ENABLED versions; the rest are DISABLED. 1 (DEFAULT) adds nothing
          beyond the new version. 2 leaves the previous version
          ENABLED as a rollback target that needs no re-enable first. Minimum 1:
          0 would disable every version and leave `latest` unresolvable. This
          step only ever DISABLES — destruction belongs to cleanup-secret-versions,
          which owns the quarantine clock and the Cloud Run consumer scan.
        type: string
        required: false
        default: '1'
    secrets:
      payload_json:
        description: >-
          JSON object {DEST_BUNDLE_KEY: value, ...} — keys are destination bundle keys.
          Required unless payload_source is environment.
        required: false
    outputs:
      old_version:
        description: 'Bundle version that was enabled before this run (empty if none).'
        value: ${{ jobs.sync.outputs.old_version }}
      new_version:
        description: 'Bundle version created by this run (empty on a dry run).'
        value: ${{ jobs.sync.outputs.new_version }}
      services_rolled:
        description: 'Number of Cloud Run services rolled onto the new version.'
        value: ${{ jobs.sync.outputs.services_rolled }}

permissions:
  contents: read
  id-token: write
  actions: read   # step S0 reads the environment's branch policy

concurrency:
  # ONE lock across all three bundle writers. sync-bundle-key,
  # rotate-signing-keypair and rotate-worker-signing-secret each read the latest
  # version of the SAME app-secrets blob, patch a key or two, and add a new
  # version — so any two of them running at once both read version N and the
  # second write silently drops the first one's keys. The group string must stay
  # byte-identical in all three files (tests/run_concurrency_tests.py asserts it);
  # a differently-spelled prefix is a different lock. Keyed on the blob, never on
  # bundle_key: two runs patching different keys still collide on the whole-blob
  # read-modify-write. Caveat: GitHub scopes the group to the CALLER's repo, so
  # two caller repos writing the same bundle are still not serialised.
  group: bundle-write-${{ inputs.gcp_project }}-${{ inputs.bundle_secret }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v4.0.0


jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    outputs:
      old_version: ${{ steps.sync.outputs.old_version }}
      new_version: ${{ steps.sync.outputs.new_version }}
      services_rolled: ${{ steps.sync.outputs.services_rolled }}

    steps:
      # A thin wrapper: every step lives once, in the composite action (its scripts sit beside
      # action.yml). The ref is REMOTE on purpose: `./actions/...` would resolve to the CALLER's
      # repo. scripts/stamp_version.py rewrites the vX.Y.Z at release. The action warns that it
      # cannot see this job's concurrency group; the group is declared above.
      - name: Sync keys into the bundle
        id: sync
        uses: Just-Git-Dev/reusable-workflows/actions/sync-bundle-key@v4.0.0
        with:
          # Reason: the action picks `payload_json` (or the keys named in secret_keys_file) out of
          # the job's secrets, and a key name cannot be a static `secrets.NAME`.
          secrets_json: ${{ toJSON(secrets) }}  # zizmor: ignore[overprovisioned-secrets]
          gcp_project: ${{ inputs.gcp_project }}
          gcp_region: ${{ inputs.gcp_region }}
          wif_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}
          bundle_secret: ${{ inputs.bundle_secret }}
          mount_path: ${{ inputs.mount_path }}
          services_csv: ${{ inputs.services_csv }}
          title: ${{ inputs.title }}
          dry_run: ${{ inputs.dry_run }}
          min_value_length: ${{ inputs.min_value_length }}
          strict_values: ${{ inputs.strict_values }}
          environment: ${{ inputs.environment }}
          require_branch_policy: ${{ inputs.require_branch_policy }}
          payload_source: ${{ inputs.payload_source }}
          mode: ${{ inputs.mode }}
          secret_keys_file: ${{ inputs.secret_keys_file }}
          confirm_removed: ${{ inputs.confirm_removed }}
          pin_versions: ${{ inputs.pin_versions }}
          keep_enabled_count: ${{ inputs.keep_enabled_count }}
