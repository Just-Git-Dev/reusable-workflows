name: Rotate a Cloudflare Worker signing secret (reusable)

# Rotates an HMAC signing secret shared between a Cloudflare Worker (which
# VERIFIES signed URLs) and a backend that SIGNS them from a Secret Manager
# bundle mounted into Cloud Run. The rotation is zero-downtime via a two-slot
# grace window: URLs already signed with the OLD secret keep verifying until
# they expire.
#
# Sequence:
#   1. generate a new secret (openssl rand -hex <secret_bytes>)
#   2. add it to the SM bundle under <bundle_key>, roll the Cloud Run service(s)
#      so the SIGNER starts emitting URLs signed with the new secret
#   3. set the Worker's PREVIOUS slot = old secret, PRIMARY slot = new secret,
#      so the VERIFIER accepts both during the overlap
#   4. wait grace_seconds (must be > your longest signed-URL TTL) for every
#      old-signed URL to expire
#   5. remove the PREVIOUS slot and disable the old SM version
#
# The Worker is expected to verify against PRIMARY, then fall back to PREVIOUS
# when set — the shape emitted by <service>-files-cdn:
#   ok = eq(hmac(env.PRIMARY, data), sig)
#        || (env.PREVIOUS && eq(hmac(env.PREVIOUS, data), sig))
#
# Overlaps sync-bundle-key on the SM-write + Cloud-Run-roll, but stays
# standalone: the CF two-slot push, the grace window, the delayed disable, and
# the roll-forward rollback all interleave around that write and can't be
# delegated without contorting the ordering. See DECISIONS 2026-07-13.
#
# Required IAM on service_account:
#   roles/secretmanager.secretVersionManager  (on bundle_secret)
#   roles/secretmanager.secretAccessor         (on bundle_secret)
#   roles/run.developer                        (on the target services)
# Plus a Cloudflare API token (secret) with Workers Scripts:Edit on the account.

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'GCP project id holding the bundle secret and the Cloud Run services.'
        type: string
        required: true
      gcp_region:
        description: 'Region of the Cloud Run services.'
        type: string
        required: false
        default: 'asia-southeast1'
      wif_provider:
        description: 'Workload Identity Federation provider resource name.'
        type: string
        required: true
      service_account:
        description: 'Service account email to impersonate via WIF.'
        type: string
        required: true
      bundle_secret:
        description: 'Secret Manager bundle secret name (dotenv blob mounted into Cloud Run).'
        type: string
        required: false
        default: 'app-secrets'
      bundle_key:
        description: 'Key inside the bundle to rotate (e.g. FILES_SIGNING_SECRET).'
        type: string
        required: true
      mount_path:
        description: >-
          Container path the bundle is mounted at — must match where the service already
          mounts it (e.g. /secrets/app.env). No default since v3.0.0: --update-secrets adds
          a mount and never removes one, so a guessed path is silently wrong.
        type: string
        required: true
      services_csv:
        description: 'Comma-separated Cloud Run service names to roll onto the new version.'
        type: string
        required: true
      cf_account_id:
        description: 'Cloudflare account id owning the Worker script.'
        type: string
        required: true
      cf_worker_script:
        description: 'Cloudflare Worker script name that verifies the signature.'
        type: string
        required: true
      cf_primary_secret_name:
        description: 'Worker secret binding for the current (primary) signing secret.'
        type: string
        required: true
      cf_previous_secret_name:
        description: 'Worker secret binding for the previous secret during grace. Blank = "<primary>_PREVIOUS".'
        type: string
        required: false
        default: ''
      grace_seconds:
        description: 'Seconds to keep the PREVIOUS slot live. MUST be > your longest signed-URL TTL.'
        type: number
        required: false
        default: 900
      secret_bytes:
        description: 'Byte length of the generated secret (hex-encoded, so the string is 2x this).'
        type: number
        required: false
        default: 32
      bootstrap:
        description: 'true = tolerate a missing bundle secret / missing services (first-run setup); no grace, no disable.'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'true = print the plan; generate nothing, write nothing, roll nothing.'
        type: boolean
        required: false
        default: false
      pin_versions:
        description: >-
          true (DEFAULT since v4.0.0) = roll with <bundle>:<N+1> and the jgd_env_version /
          jgd_run labels. false = the v3 :latest roll.
        type: boolean
        required: false
        default: true
      keep_enabled_count:
        description: >-
          After a successful roll, keep this many of the most recent ENABLED
          versions of the bundle secret and DISABLE the rest. 1 (DEFAULT) keeps
          only the version this run wrote — the historical behaviour in the
          steady state these workflows maintain. 2 leaves the previous version
          ENABLED as a rollback target that needs no re-enable first. Minimum 1:
          0 would disable every version and leave `latest` unresolvable. This
          step only ever DISABLES — destruction belongs to cleanup-secret-versions,
          which owns the quarantine clock and the Cloud Run consumer scan.
        type: string
        required: false
        default: '1'
    secrets:
      cloudflare_api_token:
        description: 'Cloudflare API token with Workers Scripts:Edit on cf_account_id.'
        required: true
    outputs:
      old_version:
        description: 'Bundle version enabled before this run (empty if none / bootstrap).'
        value: ${{ jobs.rotate.outputs.old_version }}
      new_version:
        description: 'Bundle version created by this run (empty on dry run).'
        value: ${{ jobs.rotate.outputs.new_version }}

permissions:
  contents: read
  id-token: write

concurrency:
  # ONE lock across all three bundle writers. sync-bundle-key,
  # rotate-signing-keypair and rotate-worker-signing-secret each read the latest
  # version of the SAME app-secrets blob, patch a key or two, and add a new
  # version — so any two of them running at once both read version N and the
  # second write silently drops the first one's keys. The group string must stay
  # byte-identical in all three files (tests/run_concurrency_tests.py asserts it);
  # a differently-spelled prefix is a different lock. Keyed on the blob, never on
  # bundle_key: two runs patching different keys still collide on the whole-blob
  # read-modify-write. Caveat: GitHub scopes the group to the CALLER's repo, so
  # two caller repos writing the same bundle are still not serialised.
  group: bundle-write-${{ inputs.gcp_project }}-${{ inputs.bundle_secret }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v4.1.0

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      old_version: ${{ steps.rotate.outputs.old_version }}
      new_version: ${{ steps.rotate.outputs.new_version }}

    steps:
      # A thin wrapper: every step lives once, in the composite action (its scripts sit beside
      # action.yml). The ref is REMOTE on purpose: `./actions/...` would resolve to the CALLER's
      # repo. scripts/stamp_version.py rewrites the vX.Y.Z at release. The concurrency group is
      # declared above, so the action only prints a notice (concurrency_declared).
      - name: Rotate the Worker signing secret
        id: rotate
        uses: Just-Git-Dev/reusable-workflows/actions/rotate-worker-signing-secret@v4.1.0
        with:
          # Reason: the action picks `cloudflare_api_token` out of the job's secrets as one named
          # key, and a composite action has no `secrets` context of its own.
          secrets_json: ${{ toJSON(secrets) }}  # zizmor: ignore[overprovisioned-secrets]
          gcp_project: ${{ inputs.gcp_project }}
          gcp_region: ${{ inputs.gcp_region }}
          wif_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}
          bundle_secret: ${{ inputs.bundle_secret }}
          bundle_key: ${{ inputs.bundle_key }}
          mount_path: ${{ inputs.mount_path }}
          services_csv: ${{ inputs.services_csv }}
          cf_account_id: ${{ inputs.cf_account_id }}
          cf_worker_script: ${{ inputs.cf_worker_script }}
          cf_primary_secret_name: ${{ inputs.cf_primary_secret_name }}
          cf_previous_secret_name: ${{ inputs.cf_previous_secret_name }}
          grace_seconds: ${{ inputs.grace_seconds }}
          secret_bytes: ${{ inputs.secret_bytes }}
          bootstrap: ${{ inputs.bootstrap }}
          dry_run: ${{ inputs.dry_run }}
          pin_versions: ${{ inputs.pin_versions }}
          keep_enabled_count: ${{ inputs.keep_enabled_count }}
          # This workflow declares the concurrency group above, so the action only needs a notice.
          concurrency_declared: 'true'
