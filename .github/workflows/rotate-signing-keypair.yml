name: Rotate an asymmetric signing keypair (reusable)

# Rotates an RS256 signing keypair (JWT-shaped by default) held in a Secret
# Manager bundle mounted into Cloud Run. Generates a fresh keypair + key id,
# upserts the three values into the bundle, adds a new SM version, rolls the
# Cloud Run service(s) onto it, and disables the old version.
#
# NO dual-slot / grace window (unlike rotate-worker-signing-secret): asymmetric
# JWTs already carry a `kid`, and verifiers churn short-lived tokens naturally,
# so the old key is disabled as soon as the signer is on the new one. If your
# verifier caches a single public key with no `kid` selection, do NOT use this —
# you need an overlap window it does not provide.
#
# Overlaps sync-bundle-key on the SM-write + roll, but stays standalone because
# the keypair is GENERATED here: a reusable workflow's outputs are not treated as
# secrets, so generating in one workflow and handing the private key to
# sync-bundle-key in another would leak it in logs. Generation and consumption
# must live in the same workflow. See DECISIONS 2026-07-13.
#
# Required IAM on service_account:
#   roles/secretmanager.secretVersionManager  (on bundle_secret)
#   roles/secretmanager.secretAccessor         (on bundle_secret)
#   roles/run.developer                        (on the target services)

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'GCP project id holding the bundle secret and the Cloud Run services.'
        type: string
        required: true
      gcp_region:
        description: 'Region of the Cloud Run services.'
        type: string
        required: false
        default: 'asia-southeast1'
      wif_provider:
        description: 'Workload Identity Federation provider resource name.'
        type: string
        required: true
      service_account:
        description: 'Service account email to impersonate via WIF.'
        type: string
        required: true
      bundle_secret:
        description: 'Secret Manager bundle secret name (dotenv blob mounted into Cloud Run).'
        type: string
        required: false
        default: 'app-secrets'
      mount_path:
        description: >-
          Container path the bundle is mounted at — must match where the service already
          mounts it (e.g. /secrets/app.env). No default since v3.0.0: --update-secrets adds
          a mount and never removes one, so a guessed path is silently wrong.
        type: string
        required: true
      services_csv:
        description: 'Comma-separated Cloud Run service names to roll onto the new version.'
        type: string
        required: true
      rsa_bits:
        description: 'RSA key size in bits.'
        type: number
        required: false
        default: 2048
      private_key_name:
        description: 'Bundle key for the base64-encoded private key PEM.'
        type: string
        required: false
        default: 'JWT_PRIVATE_KEY_BASE64'
      public_key_name:
        description: 'Bundle key for the base64-encoded public key PEM.'
        type: string
        required: false
        default: 'JWT_PUBLIC_KEY_BASE64'
      key_id_name:
        description: 'Bundle key for the key id (kid = first 16 hex of SHA-256 over the public PEM).'
        type: string
        required: false
        default: 'JWT_KEY_ID'
      title:
        description: 'Human label for the run summary.'
        type: string
        required: false
        default: 'JWT signing keys'
      bootstrap:
        description: 'true = tolerate missing bundle / missing services (first-run setup); no disable of an old version.'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'true = print the plan; generate nothing, write nothing, roll nothing.'
        type: boolean
        required: false
        default: false
      pin_versions:
        description: >-
          true (DEFAULT since v4.0.0) = roll with <bundle>:<N+1> and the jgd_env_version /
          jgd_run labels. false = the v3 :latest roll.
        type: boolean
        required: false
        default: true
      keep_enabled_count:
        description: >-
          After a successful roll, keep this many of the most recent ENABLED
          versions of the bundle secret and DISABLE the rest. 1 (DEFAULT) keeps
          only the version this run wrote — the historical behaviour in the
          steady state these workflows maintain. 2 leaves the previous version
          ENABLED as a rollback target that needs no re-enable first. Minimum 1:
          0 would disable every version and leave `latest` unresolvable. This
          step only ever DISABLES — destruction belongs to cleanup-secret-versions,
          which owns the quarantine clock and the Cloud Run consumer scan.
        type: string
        required: false
        default: '1'
    outputs:
      old_version:
        description: 'Bundle version enabled before this run (empty if none / bootstrap).'
        value: ${{ jobs.rotate.outputs.old_version }}
      new_version:
        description: 'Bundle version created by this run (empty on dry run).'
        value: ${{ jobs.rotate.outputs.new_version }}
      key_id:
        description: 'The kid of the newly generated key.'
        value: ${{ jobs.rotate.outputs.key_id }}

permissions:
  contents: read
  id-token: write

concurrency:
  # ONE lock across all three bundle writers. sync-bundle-key,
  # rotate-signing-keypair and rotate-worker-signing-secret each read the latest
  # version of the SAME app-secrets blob, patch a key or two, and add a new
  # version — so any two of them running at once both read version N and the
  # second write silently drops the first one's keys. The group string must stay
  # byte-identical in all three files (tests/run_concurrency_tests.py asserts it);
  # a differently-spelled prefix is a different lock. Keyed on the blob, never on
  # bundle_key: two runs patching different keys still collide on the whole-blob
  # read-modify-write. Caveat: GitHub scopes the group to the CALLER's repo, so
  # two caller repos writing the same bundle are still not serialised.
  group: bundle-write-${{ inputs.gcp_project }}-${{ inputs.bundle_secret }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v5.2.0

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GCP_PROJECT:   ${{ inputs.gcp_project }}
      GCP_REGION:    ${{ inputs.gcp_region }}
      BUNDLE_SECRET: ${{ inputs.bundle_secret }}
      MOUNT_PATH:    ${{ inputs.mount_path }}
      SERVICES_CSV:  ${{ inputs.services_csv }}
      RSA_BITS:      ${{ inputs.rsa_bits }}
      PRIV_KEY:      ${{ inputs.private_key_name }}
      PUB_KEY:       ${{ inputs.public_key_name }}
      KID_KEY:       ${{ inputs.key_id_name }}
      BOOTSTRAP:     ${{ inputs.bootstrap }}
      DRY_RUN:       ${{ inputs.dry_run }}
    outputs:
      old_version: ${{ steps.cur.outputs.current_version }}
      new_version: ${{ steps.new_version.outputs.new_version }}
      key_id:      ${{ steps.gen.outputs.kid }}

    steps:
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account:            ${{ inputs.service_account }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Generate RSA keypair + key id
        id: gen
        run: |
          openssl genpkey -algorithm RSA -pkeyopt "rsa_keygen_bits:${RSA_BITS}" -out /tmp/priv.pem
          openssl rsa -pubout -in /tmp/priv.pem -out /tmp/pub.pem 2>/dev/null
          PRIV_B64=$(base64 -w0 /tmp/priv.pem)
          PUB_B64=$(base64 -w0 /tmp/pub.pem)
          # kid = first 16 hex chars of SHA-256 over the public PEM (stable per key).
          KID=$(openssl dgst -sha256 -binary /tmp/pub.pem | xxd -p -c 256 | cut -c1-16)
          echo "::add-mask::$PRIV_B64"
          {
            echo "priv=$PRIV_B64"
            echo "pub=$PUB_B64"
            echo "kid=$KID"
          } >> "$GITHUB_OUTPUT"
          rm -f /tmp/priv.pem /tmp/pub.pem
          echo "Generated new key with kid=$KID."

      - name: Read current bundle (or start empty)
        id: cur
        run: |
          if ! gcloud secrets describe "$BUNDLE_SECRET" --project="$GCP_PROJECT" >/dev/null 2>&1; then
            if [ "$BOOTSTRAP" = "true" ]; then
              echo "::warning::Bundle $BUNDLE_SECRET absent — bootstrap run, starting empty."
              : > /tmp/bundle.env
              echo "empty=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Secret $BUNDLE_SECRET does not exist in $GCP_PROJECT. Create it first, or set bootstrap: true."
            exit 1
          fi
          # --limit=1 (not | head -1): closing the pipe can SIGPIPE gcloud, which
          # under pipefail would fail the step.
          CURRENT_VERSION=$(gcloud secrets versions list "$BUNDLE_SECRET" \
            --project="$GCP_PROJECT" --filter='state=ENABLED' \
            --sort-by=~createTime --limit=1 --format='value(name)')
          if [ -z "$CURRENT_VERSION" ]; then
            : > /tmp/bundle.env
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No enabled version yet — starting from an empty bundle."
            exit 0
          fi
          gcloud secrets versions access "$CURRENT_VERSION" \
            --secret="$BUNDLE_SECRET" --project="$GCP_PROJECT" > /tmp/bundle.env
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "empty=false" >> "$GITHUB_OUTPUT"
          echo "Current enabled version: $CURRENT_VERSION"

      - name: Upsert keypair into the bundle
        run: |
          upsert() {
            local key="$1" val="$2"
            if grep -q "^${key}=" /tmp/bundle.env; then
              # awk not sed: base64 values contain +/= that trip sed's replacement.
              awk -v k="$key" -v v="$val" 'BEGIN{FS=OFS="="} $1==k{print k"="v; next} {print}' /tmp/bundle.env > /tmp/bundle.env.new
              mv /tmp/bundle.env.new /tmp/bundle.env
            else
              echo "${key}=${val}" >> /tmp/bundle.env
            fi
          }
          upsert "$PRIV_KEY" "${{ steps.gen.outputs.priv }}"
          upsert "$PUB_KEY"  "${{ steps.gen.outputs.pub }}"
          upsert "$KID_KEY"  "${{ steps.gen.outputs.kid }}"

      - name: Add new bundle version
        id: new_version
        if: inputs.dry_run == false
        run: |
          gcloud secrets versions add "$BUNDLE_SECRET" \
            --project="$GCP_PROJECT" --data-file=/tmp/bundle.env
          NEW_VERSION=$(gcloud secrets versions list "$BUNDLE_SECRET" \
            --project="$GCP_PROJECT" --filter='state=ENABLED' \
            --sort-by=~createTime --limit=1 --format='value(name)')
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Could not resolve the newly added version of $BUNDLE_SECRET."
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Force new Cloud Run revision(s)
        id: roll
        if: inputs.dry_run == false
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
          PIN_VERSIONS: ${{ inputs.pin_versions }}
        run: |
          # `value(name)` may return a full resource path; the mount wants the number.
          NEW_VERSION="${NEW_VERSION##*/}"
          if [ "$PIN_VERSIONS" = "true" ]; then
            if [ -z "$NEW_VERSION" ]; then
              echo "::error::pin_versions needs the new bundle version, which is empty."
              exit 1
            fi
            SECRET_REF="${BUNDLE_SECRET}:${NEW_VERSION}"
            LABELS="jgd_env_version=${NEW_VERSION},jgd_run=${GITHUB_RUN_ID}"
          else
            SECRET_REF="${BUNDLE_SECRET}:latest"
            LABELS=""
          fi
          IFS=',' read -ra SERVICES <<< "$SERVICES_CSV"
          ROLLED=0
          FAILED=()
          for svc in "${SERVICES[@]}"; do
            svc="${svc#"${svc%%[![:space:]]*}"}"   # ltrim
            svc="${svc%"${svc##*[![:space:]]}"}"   # rtrim
            [ -z "$svc" ] && continue
            if gcloud run services update "$svc" \
                 --region="$GCP_REGION" \
                 --project="$GCP_PROJECT" \
                 --update-secrets="${MOUNT_PATH}=${SECRET_REF}" \
                 ${LABELS:+--update-labels="$LABELS"}; then
              echo "rolled: $svc"
              ROLLED=$((ROLLED + 1))
            elif [ "${BOOTSTRAP:-false}" = "true" ]; then
              echo "::warning::Failed to update $svc during bootstrap (may not exist yet) — continuing."
            else
              echo "::error::Failed to roll $svc onto ${SECRET_REF}"
              FAILED+=("$svc")
            fi
          done
          echo "rolled=$ROLLED" >> "$GITHUB_OUTPUT"

          # Fail loud and leave the old version ENABLED. Disabling it now would
          # strand any service still reading it.
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::${#FAILED[@]} service(s) failed to roll: ${FAILED[*]}"
            echo "::error::The previous bundle version is still enabled. Fix and re-run."
            exit 1
          fi
          if [ "$ROLLED" -eq 0 ]; then
            if [ "${BOOTSTRAP:-false}" = "true" ]; then
              echo "::warning::No service rolled during bootstrap — continuing."
            else
              echo "::error::services_csv resolved to zero service names."
              exit 1
            fi
          fi

      - name: Roll back the new SM version on failure
        # Fires ONLY when an earlier step failed AND the Cloud Run roll did NOT
        # succeed — the window in which nothing consumes the new version yet, so
        # reverting `latest` to the prior content is safe. Roll-forward (add a fresh
        # version with the old content), never disable `latest` (that would strand
        # the `:latest` mount). Not blanket-failure(): once the signer is on the new
        # key, reverting here would break signing.
        if: >-
          failure()
          && inputs.dry_run == false
          && steps.new_version.outputs.new_version != ''
          && steps.cur.outputs.current_version != ''
          && steps.roll.outcome != 'success'
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
          CUR_VERSION: ${{ steps.cur.outputs.current_version }}
        run: |
          NEW_VERSION="${NEW_VERSION##*/}"
          CUR_VERSION="${CUR_VERSION##*/}"
          echo "::warning::Rotation failed before the signer moved over — restoring ${BUNDLE_SECRET} latest to version ${CUR_VERSION}."
          gcloud secrets versions access "$CUR_VERSION" \
            --secret="$BUNDLE_SECRET" --project="$GCP_PROJECT" > /tmp/rollback.env
          if [ ! -s /tmp/rollback.env ]; then
            echo "::error::Could not read previous version ${CUR_VERSION} — manual intervention needed."
            exit 1
          fi
          gcloud secrets versions add "$BUNDLE_SECRET" \
            --project="$GCP_PROJECT" --data-file=/tmp/rollback.env
          rm -f /tmp/rollback.env
          # A PARTIAL roll (service A rolled onto N+1, service B failed) leaves live revisions
          # pinning N+1: disabling it would break their next cold start. Refuse to disable a
          # version any revision with traffic > 0 still pins; leave it ENABLED and fail loudly
          # so a human looks. A listing failure also leaves it enabled (fail closed).
          PINNED=""
          mark() { case " $PINNED " in *" $1 "*) ;; *) PINNED="${PINNED} $1" ;; esac; }
          # shellcheck disable=SC2016
          # (jq program: the $vars are jq's, not the shell's)
          PINS_JQ='def pins($s): . as $r
                    | [$r.spec.containers[]?.volumeMounts[]?.name] as $mounted
                    | ( [$r.spec.volumes[]?
                         | select(.secret.secretName == $s and (.name as $v | $mounted | index($v) != null))
                         | .secret.items[]? | (.key // .version) | tostring | sub("^.*/"; "")]
                      + [$r.spec.containers[]?.env[]?.valueFrom.secretKeyRef?
                         | select(.name == $s) | .key | tostring | sub("^.*/"; "")] );'
          # LIVE = a revision with traffic > 0 or a tag, the latest READY and latest CREATED
          # revisions (the template's revision takes traffic as soon as it is ready), and the
          # service TEMPLATE itself. Read from the newest-50 list AND by name: a traffic-holding
          # revision can be older than the 50 newest.
          IFS=',' read -ra SERVICES <<< "$SERVICES_CSV"
          for svc in "${SERVICES[@]}"; do
            svc="${svc#"${svc%%[![:space:]]*}"}"   # ltrim
            svc="${svc%"${svc##*[![:space:]]}"}"   # rtrim
            [ -z "$svc" ] && continue
            if ! gcloud --project="$GCP_PROJECT" run services describe "$svc" \
                  --region="$GCP_REGION" --format=json </dev/null > /tmp/service.json \
               || ! gcloud --project="$GCP_PROJECT" run revisions list --service="$svc" \
                  --region="$GCP_REGION" --sort-by=~metadata.creationTimestamp --limit=50 \
                  --format=json </dev/null > /tmp/revisions.json; then
              echo "::error::Could not read ${svc}'s revisions — leaving version ${NEW_VERSION} ENABLED (cannot prove nothing pins it). Manual intervention needed."
              exit 1
            fi
            [ -s /tmp/service.json ] || echo '{}' > /tmp/service.json
            [ -s /tmp/revisions.json ] || echo '[]' > /tmp/revisions.json
            if jq -e --arg s "$BUNDLE_SECRET" --arg n "$NEW_VERSION" --slurpfile svc /tmp/service.json \
                 "$PINS_JQ"'
                 ($svc[0].status.latestReadyRevisionName // "") as $ready
                 | ([$svc[0].status.traffic[]? | select((.percent // 0) > 0 or ((.tag // "") != ""))
                     | (.revisionName // $ready)]
                    + [$ready, ($svc[0].status.latestCreatedRevisionName // "")]) as $live
                 | ( [.[] | select(.metadata.name as $nm | $live | index($nm)) | pins($s)[]]
                     + ($svc[0].spec.template // {} | pins($s)) )
                 | index($n) != null' /tmp/revisions.json > /dev/null; then
              mark "$svc"
            fi
            jq -r '(.status.latestReadyRevisionName // "") as $ready | $ready,
                   (.status.latestCreatedRevisionName // ""),
                   (.status.traffic[]? | select((.percent // 0) > 0 or ((.tag // "") != ""))
                    | (.revisionName // $ready))' /tmp/service.json | grep -v '^$' | sort -u > /tmp/live.txt || true
            while read -r rev; do
              [ -n "$rev" ] || continue
              if ! gcloud --project="$GCP_PROJECT" run revisions describe "$rev" \
                    --region="$GCP_REGION" --format=json </dev/null > /tmp/rev.json; then
                echo "::error::Could not read revision ${rev} of ${svc} — leaving version ${NEW_VERSION} ENABLED (cannot prove nothing pins it). Manual intervention needed."
                exit 1
              fi
              [ -s /tmp/rev.json ] || echo '{}' > /tmp/rev.json
              if jq -e --arg s "$BUNDLE_SECRET" --arg n "$NEW_VERSION" "$PINS_JQ"'pins($s) | index($n) != null' \
                   /tmp/rev.json > /dev/null; then
                mark "$svc"
              fi
            done < /tmp/live.txt
          done
          if [ -n "$PINNED" ]; then
            echo "::error::Partial roll: live revision(s) of${PINNED} still pin ${BUNDLE_SECRET}:${NEW_VERSION}. NOT disabling it (that would break their next cold start). 'latest' content is restored; re-run the rotation or roll those services back, then disable ${NEW_VERSION} by hand."
            exit 1
          fi
          gcloud secrets versions disable "$NEW_VERSION" \
            --secret="$BUNDLE_SECRET" --project="$GCP_PROJECT" \
            || echo "::warning::Could not disable failed version ${NEW_VERSION} (non-fatal — latest already restored)."

      - name: Disable superseded bundle version(s)
        # Reached only when every service rolled: a failed roll fails the step
        # above, and `if: success()` is the implicit default for later steps.
        #
        # KEEP-SET (v4). ENABLED versions kept = the union of
        #   - the new version N+1,
        #   - the version pinned by each of the two newest PREVIOUS revisions of every
        #     rolled service (read only from volumes a volumeMount actually uses; an
        #     orphan declared volume pins nothing), so the previous revision stays a
        #     valid rollback target, and
        #   - the `keep_enabled_count` newest ENABLED versions (a floor, minimum 1).
        # Everything else is disabled. A pre-existing ENABLED tail (a hand-added
        # version, or one from manage-config-secrets) is therefore mopped up too.
        #
        # DISABLE ONLY, never destroy. Destruction needs a quarantine clock (GSM
        # stores no disabled-at timestamp, so it comes from Admin Activity audit
        # logs) and the Cloud Run consumer scan; both live in
        # cleanup-secret-versions, and this workflow deliberately holds neither
        # roles/logging.viewer nor roles/run.viewer. See DECISIONS.md 2026-08-17.
        if: inputs.dry_run == false && steps.cur.outputs.empty == 'false' && steps.cur.outputs.current_version != ''
        env:
          KEEP_ENABLED_COUNT: ${{ inputs.keep_enabled_count }}
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
        run: |
          case "$KEEP_ENABLED_COUNT" in
            ''|*[!0-9]*)
              echo "::error::keep_enabled_count must be a non-negative integer (got '$KEEP_ENABLED_COUNT')."
              exit 1 ;;
          esac
          if [ "$KEEP_ENABLED_COUNT" -lt 1 ]; then
            echo "::error::keep_enabled_count must be >= 1: 0 disables every version and leaves 'latest' unresolvable."
            exit 1
          fi
          NEW_VERSION="${NEW_VERSION##*/}"
          # `latest` resolves SERVER-SIDE to the newest ENABLED version, so keeping
          # at least one guarantees this step can never silently repoint it.
          # Written to a file rather than piped: a heredoc consumer downstream of a
          # pipe claims stdin and kills the producer (shellcheck SC2259).
          gcloud secrets versions list "$BUNDLE_SECRET" \
            --project="$GCP_PROJECT" --filter='state=ENABLED' \
            --sort-by=~createTime --format='value(name)' > /tmp/enabled.raw
          sed 's|.*/||' /tmp/enabled.raw | grep -v '^$' > /tmp/enabled.txt || true
          TOTAL=$(wc -l < /tmp/enabled.txt | tr -d ' ')
          # Keep-set, one version per line.
          : > /tmp/keep.txt
          [ -z "$NEW_VERSION" ] || echo "$NEW_VERSION" >> /tmp/keep.txt
          head -n "$KEEP_ENABLED_COUNT" /tmp/enabled.txt >> /tmp/keep.txt
          # Keep-set = every pin a LIVE or recent revision holds, across EVERY consumer of the
          # bundle secret in the project, in EVERY region (not only services_csv / GCP_REGION):
          #   (a) each revision with traffic > 0, or a tag (served at its tag URL), on a Service
          #       (after a `rollback to_revision` traffic stays pinned to an old revision until
          #       `--to-latest`). Read BY NAME as well as out of the newest-50 list: a pin can
          #       sit on a revision older than the 50 newest for as long as traffic is held there,
          #   (b) the two newest revisions before the one just rolled, per Service,
          #   (c) every Cloud Run Job's pin (a Job has no traffic; its pin is live).
          # A pin is a secret volume item (`volumes[].secret.items[].key`) a volumeMount uses OR an
          # env var `valueFrom.secretKeyRef{name,key}`.
          # A listing/describe failure fails the step BEFORE anything is disabled.
          # shellcheck disable=SC2016
          # (jq program: the $vars are jq's, not the shell's)
          PINS_JQ='def pins($s): . as $r
                    | [$r.spec.containers[]?.volumeMounts[]?.name] as $mounted
                    | ( [$r.spec.volumes[]?
                         | select(.secret.secretName == $s and (.name as $v | $mounted | index($v) != null))
                         | .secret.items[]? | (.key // .version) | tostring | sub("^.*/"; "")]
                      + [$r.spec.containers[]?.env[]?.valueFrom.secretKeyRef?
                         | select(.name == $s) | .key | tostring | sub("^.*/"; "")] );'
          # No --region: list every region the project uses; the label carries each one's region.
          LOC='metadata.labels."cloud.googleapis.com/location"'
          gcloud --project="$GCP_PROJECT" run services list \
            --format="value(metadata.name,${LOC})" </dev/null > /tmp/consumers.raw 2> /tmp/consumers.err
          # An all-region list that skipped a region ("did not respond ... may be incomplete") would
          # hide that region's consumers from the keep-set: refuse, disable nothing.
          cat /tmp/consumers.err >&2
          if grep -qiE 'did not respond|may be incomplete' /tmp/consumers.err; then
            echo "::error::the all-region services list did not cover every region (refusing; nothing disabled): $(head -c 300 /tmp/consumers.err)" >&2
            exit 1
          fi
          IFS=',' read -ra LISTED <<< "$SERVICES_CSV"
          for svc in "${LISTED[@]}"; do
            svc="${svc#"${svc%%[![:space:]]*}"}"   # ltrim
            svc="${svc%"${svc##*[![:space:]]}"}"   # rtrim
            [ -z "$svc" ] || printf '%s\t%s\n' "$svc" "$GCP_REGION" >> /tmp/consumers.raw
          done
          # name<TAB>region, an empty region meaning GCP_REGION.
          awk -F'\t' -v r="$GCP_REGION" 'NF && $1 != "" { print $1 "\t" ($2 == "" ? r : $2) }' \
            /tmp/consumers.raw | sort -u > /tmp/consumers.txt
          while IFS=$'\t' read -r svc reg; do
            [ -n "$svc" ] || continue
            gcloud --project="$GCP_PROJECT" run services describe "$svc" \
              --region="$reg" --format=json </dev/null > /tmp/service.json
            [ -s /tmp/service.json ] || echo '{}' > /tmp/service.json
            gcloud --project="$GCP_PROJECT" run revisions list --service="$svc" \
              --region="$reg" \
              --sort-by=~metadata.creationTimestamp --limit=50 --format=json \
              </dev/null > /tmp/revisions.json
            [ -s /tmp/revisions.json ] || echo '[]' > /tmp/revisions.json
            jq -r --arg s "$BUNDLE_SECRET" --arg n "$NEW_VERSION" --slurpfile svc /tmp/service.json "
              $PINS_JQ
              (\$svc[0].status.latestReadyRevisionName // \"\") as \$latest
              | ([\$svc[0].status.traffic[]? | select((.percent // 0) > 0 or ((.tag // \"\") != \"\"))
                  | (.revisionName // \$latest)]) as \$live
              | ( [.[] | select(.metadata.name as \$nm | \$live | index(\$nm)) | pins(\$s)[]]
                + [.[0:3] | map({pins: pins(\$s)}) | map(select((.pins | index(\$n)) == null))
                   | .[0:2][].pins[]] )
              | .[] | select(test(\"^[0-9]+\$\"))" /tmp/revisions.json >> /tmp/keep.txt
            # (a) by name: every traffic-holding (or tagged) revision, listed or not.
            jq -r '(.status.latestReadyRevisionName // "") as $latest | .status.traffic[]?
                   | select((.percent // 0) > 0 or ((.tag // "") != "")) | (.revisionName // $latest)
                   | select(. != "")' /tmp/service.json | sort -u > /tmp/live.txt
            while read -r rev; do
              [ -n "$rev" ] || continue
              gcloud --project="$GCP_PROJECT" run revisions describe "$rev" \
                --region="$reg" --format=json </dev/null > /tmp/rev.json
              [ -s /tmp/rev.json ] || echo '{}' > /tmp/rev.json
              jq -r --arg s "$BUNDLE_SECRET" "
                $PINS_JQ
                pins(\$s)[] | select(test(\"^[0-9]+\$\"))" /tmp/rev.json >> /tmp/keep.txt
            done < /tmp/live.txt
          done < /tmp/consumers.txt
          gcloud --project="$GCP_PROJECT" run jobs list \
            --format="value(metadata.name,${LOC})" </dev/null > /tmp/jobs.raw 2> /tmp/jobs.err
          cat /tmp/jobs.err >&2
          if grep -qiE 'did not respond|may be incomplete' /tmp/jobs.err; then
            echo "::error::the all-region jobs list did not cover every region (refusing; nothing disabled): $(head -c 300 /tmp/jobs.err)" >&2
            exit 1
          fi
          awk -F'\t' -v r="$GCP_REGION" 'NF && $1 != "" { print $1 "\t" ($2 == "" ? r : $2) }' \
            /tmp/jobs.raw | sort -u > /tmp/jobs.txt
          while IFS=$'\t' read -r job reg; do
            [ -n "$job" ] || continue
            gcloud --project="$GCP_PROJECT" run jobs describe "$job" \
              --region="$reg" --format=json </dev/null > /tmp/job.json
            [ -s /tmp/job.json ] || echo '{}' > /tmp/job.json
            jq -r --arg s "$BUNDLE_SECRET" "
              $PINS_JQ
              (.spec.template.spec.template // {}) | pins(\$s)[] | select(test(\"^[0-9]+\$\"))" \
              /tmp/job.json >> /tmp/keep.txt
          done < /tmp/jobs.txt
          grep -vxFf /tmp/keep.txt /tmp/enabled.txt > /tmp/to-disable.txt || true
          COUNT=$(wc -l < /tmp/to-disable.txt | tr -d ' ')
          echo "ENABLED versions: $TOTAL; keeping $(sort -u /tmp/keep.txt | wc -l | tr -d ' ') in the keep-set; disabling $COUNT."
          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::Disabling $COUNT versions, more than the one this run superseded — a pre-existing ENABLED tail was present. Every one is reversible with 'gcloud secrets versions enable'."
          fi
          while read -r v; do
            [ -n "$v" ] || continue
            echo "Disabling version $v"
            gcloud secrets versions disable "$v" \
              --secret="$BUNDLE_SECRET" \
              --project="$GCP_PROJECT" </dev/null
          done < /tmp/to-disable.txt

      - name: Shred local bundle copies
        if: always()
        run: rm -f /tmp/bundle.env /tmp/bundle.env.new /tmp/rollback.env /tmp/priv.pem /tmp/pub.pem /tmp/enabled.txt /tmp/to-disable.txt

      - name: Summary
        if: always()
        env:
          TITLE: ${{ inputs.title }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## [dry run] Would rotate ${TITLE} in ${BUNDLE_SECRET} (${GCP_PROJECT})"
              echo ""
              echo "- New kid: ${{ steps.gen.outputs.kid }}"
              echo "- Current bundle version: ${{ steps.cur.outputs.current_version }} (would be disabled)"
              echo "- Would roll: \`${SERVICES_CSV}\`"
            else
              echo "## Rotated ${TITLE} in ${BUNDLE_SECRET} (${GCP_PROJECT})"
              echo ""
              echo "- Empty/bootstrap: ${{ steps.cur.outputs.empty }}"
              echo "- New kid: ${{ steps.gen.outputs.kid }}"
              echo "- Old version: ${{ steps.cur.outputs.current_version }} (disabled)"
              echo "- New version: ${{ steps.new_version.outputs.new_version }}"
              echo "- Cloud Run rolled: \`${SERVICES_CSV}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
