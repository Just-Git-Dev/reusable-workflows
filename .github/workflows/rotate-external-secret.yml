name: Rotate a secret shared with an external system (reusable)

# Rotates a Cloudflare Worker secret that a backend service also holds, with two alternating Worker
# secret slots. Runs in the org's project repo; needs NO GCP identity, because the service's own
# bundle sync (dispatched here, waited for) is the only writer of its bundle. One run advances one
# step of a small state machine kept in a non-secret repo variable: schedule it daily.
# docs/rotate-external-secret.md has the state table, the App permissions and the caller template.

on:
  workflow_call:
    inputs:
      cf_account_id:
        description: 'Cloudflare account id owning the Worker script.'
        type: string
        required: true
      worker_script:
        description: 'Cloudflare Worker script name that holds the secret.'
        type: string
        required: true
      slot_a:
        description: 'First of the two Worker secret names that alternate.'
        type: string
        required: true
      slot_b:
        description: 'Second of the two Worker secret names that alternate.'
        type: string
        required: true
      target_repo:
        description: 'Name of the service repo (same owner as this repo) that receives the environment secret and runs the sync.'
        type: string
        required: true
      target_environment:
        description: 'Environment of target_repo that holds the secret.'
        type: string
        required: false
        default: 'prod'
      target_secret_name:
        description: 'Environment secret name written in target_repo.'
        type: string
        required: true
      sync_workflow:
        description: 'File name of the service sync workflow; it must accept a correlation_id input and set run-name from it.'
        type: string
        required: true
      sync_ref:
        description: 'Ref the sync is dispatched on.'
        type: string
        required: false
        default: 'main'
      sync_inputs_json:
        description: 'JSON object of extra dispatch inputs for the sync (correlation_id is added).'
        type: string
        required: false
        default: '{"dry_run":"false"}'
      state_variable:
        description: 'Name of the non-secret state variable in this repo.'
        type: string
        required: true
      rotate_every_days:
        description: 'Age of the current value at which a rotation is due.'
        type: number
        required: false
        default: 30
      grace_hours:
        description: 'Hours the old slot stays valid after a rotation; at least the longest lifetime of anything signed with the old value, plus a margin.'
        type: number
        required: false
        default: 24
      wait_minutes:
        description: 'Minutes to wait for the sync run (1 to 30; the job timeout is 40).'
        type: number
        required: false
        default: 30
      secret_bytes:
        description: 'Random bytes of the generated value (hex-encoded, so the string is 2x this).'
        type: number
        required: false
        default: 32
      force:
        description: 'true = rotate now when exactly one slot exists.'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'true = read state and print the plan; make no write call.'
        type: boolean
        required: false
        default: true
      app_id:
        description: 'Id of the org relay GitHub App.'
        type: string
        required: true
      environment:
        description: 'GitHub environment the job runs in (holds app_key and the Cloudflare token). Empty = none.'
        type: string
        required: false
        default: ''
    secrets:
      cloudflare_api_token:
        description: 'Cloudflare API token with Workers Scripts:Edit on cf_account_id.'
        required: true
      app_key:
        description: 'Private key of the org relay GitHub App.'
        required: true

permissions:
  contents: read

concurrency:
  # Two overlapping runs would both advance the same state variable.
  group: rotate-external-${{ inputs.worker_script }}-${{ inputs.slot_a }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches the tag.
  WORKFLOW_VERSION: v5.1.1

jobs:
  rotate:
    runs-on: ubuntu-latest
    # wait_minutes is capped at 30 by the action, so wait + 10 is at most 40.
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    steps:
      # A thin wrapper: every step lives once, in the composite action. The ref is REMOTE on purpose:
      # `./actions/...` would resolve to the CALLER's repo. scripts/stamp_version.py rewrites the
      # vX.Y.Z at release.
      - name: Rotate the external secret
        uses: Just-Git-Dev/reusable-workflows/actions/rotate-external-secret@v5.1.1
        with:
          cloudflare_api_token: ${{ secrets.cloudflare_api_token }}
          app_key: ${{ secrets.app_key }}
          app_id: ${{ inputs.app_id }}
          cf_account_id: ${{ inputs.cf_account_id }}
          worker_script: ${{ inputs.worker_script }}
          slot_a: ${{ inputs.slot_a }}
          slot_b: ${{ inputs.slot_b }}
          target_repo: ${{ inputs.target_repo }}
          target_environment: ${{ inputs.target_environment }}
          target_secret_name: ${{ inputs.target_secret_name }}
          sync_workflow: ${{ inputs.sync_workflow }}
          sync_ref: ${{ inputs.sync_ref }}
          sync_inputs_json: ${{ inputs.sync_inputs_json }}
          state_variable: ${{ inputs.state_variable }}
          rotate_every_days: ${{ inputs.rotate_every_days }}
          grace_hours: ${{ inputs.grace_hours }}
          wait_minutes: ${{ inputs.wait_minutes }}
          secret_bytes: ${{ inputs.secret_bytes }}
          force: ${{ inputs.force }}
          dry_run: ${{ inputs.dry_run }}
          # This workflow declares the concurrency group above, so the action only needs a notice.
          concurrency_declared: 'true'
