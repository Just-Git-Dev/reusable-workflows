# Reusable Go CI: build · vet · test · golangci-lint, with module/build caching.
#
# The universal core every Go repo copy-pastes. Repo-specific gates (guard
# scripts, ephemeral-DB migration smokes, docker VCS-fallback builds) stay as
# their own jobs in the caller — this workflow owns only the toolchain core, so
# it stays adoptable everywhere. Each step is individually toggleable.
#
# Optional extras (match zopsmart/workflows test-and-lint so callers lose
# nothing on migration):
#   coverage_threshold — fail if total statement coverage is below this percent.
#   enable_services    — run the test job with postgres + mysql + redis service
#                        containers on localhost (5432 / 3306 / 6379) for
#                        integration suites. When on, tests run in the `go-db`
#                        job; build/vet/lint stay in the `go` job.
#   update_badges      — commit shields.io Coverage + nolint-count badges back
#                        into the caller's README on default-branch pushes.
#                        ON BY DEFAULT; set false to opt out. To push, grant
#                        `permissions: contents: write` on the calling job —
#                        without it the push degrades to a warning, not a
#                        failure.
name: ci-go

on:
  workflow_call:
    inputs:
      runs_on:
        # setup-go v7 runs on Node 24, which needs Actions Runner >= v2.327.1.
        # GitHub-hosted runners satisfy this; a self-hosted label must be on >= v2.327.1.
        description: 'Runner label. Self-hosted runners must be on Actions Runner >= v2.327.1 (Node 24).'
        type: string
        required: false
        default: 'ubuntu-latest'
      working_directory:
        description: 'Directory to run build/vet/test in (monorepo module root).'
        type: string
        required: false
        default: '.'
      go_version:
        description: 'Explicit Go version (e.g. 1.25). Empty = derive from go_version_file.'
        type: string
        required: false
        default: ''
      go_version_file:
        description: 'go.mod path (repo-root-relative) to derive the Go version from, used when go_version is empty.'
        type: string
        required: false
        default: 'go.mod'
      timeout_minutes:
        description: 'Job timeout.'
        type: number
        required: false
        default: 15
      run_build:
        description: 'Run `go build`.'
        type: boolean
        required: false
        default: true
      build_packages:
        description: 'Package pattern for `go build`.'
        type: string
        required: false
        default: './...'
      run_vet:
        description: 'Run `go vet`.'
        type: boolean
        required: false
        default: true
      run_tests:
        description: >-
          Run `go test`. Set false when the suite needs an external DB/stack the
          caller stands up in its own job (keep build+vet+lint centralized here).
        type: boolean
        required: false
        default: true
      test_args:
        description: 'Arguments to `go test` (packages + flags).'
        type: string
        required: false
        default: '-race -count=1 ./...'
      coverage_threshold:
        description: >-
          Minimum total statement coverage percent. 0 disables the gate. When
          non-zero, tests run with -coverprofile and the job fails below this.
        type: number
        required: false
        default: 0
      enable_services:
        description: >-
          Run tests in a job with postgres + mysql + redis service containers
          (localhost 5432 / 3306 / 6379). Use for DB-backed integration suites.
        type: boolean
        required: false
        default: false
      postgres_image:
        description: 'Postgres service image (enable_services only).'
        type: string
        required: false
        default: 'postgres:16'
      postgres_db:
        description: 'POSTGRES_DB for the postgres service.'
        type: string
        required: false
        default: 'test'
      postgres_password:
        description: 'POSTGRES_PASSWORD for the postgres service.'
        type: string
        required: false
        default: 'postgres'
      mysql_image:
        description: 'MySQL service image (enable_services only).'
        type: string
        required: false
        default: 'mysql:8'
      mysql_database:
        description: 'MYSQL_DATABASE for the mysql service.'
        type: string
        required: false
        default: 'test'
      mysql_root_password:
        description: 'MYSQL_ROOT_PASSWORD for the mysql service.'
        type: string
        required: false
        default: 'root'
      redis_image:
        description: 'Redis service image (enable_services only).'
        type: string
        required: false
        default: 'redis:7'
      run_lint:
        description: 'Run golangci-lint.'
        type: boolean
        required: false
        default: true
      golangci_version:
        description: 'golangci-lint version for golangci-lint-action (e.g. v2.5, latest).'
        type: string
        required: false
        default: 'latest'
      golangci_args:
        description: 'Arguments passed to golangci-lint.'
        type: string
        required: false
        default: '--timeout=5m'
      lint_blocking:
        description: 'When false, a lint failure is reported but does not fail the job (paydown mode).'
        type: boolean
        required: false
        default: true
      go_private:
        description: 'GOPRIVATE glob for private modules (e.g. github.com/zopsmart/*). When set,
          git is configured to fetch over HTTPS with the go_private_token secret. Empty ⇒ off.'
        type: string
        required: false
        default: ''
      update_badges:
        description: >-
          Commit shields.io Coverage + nolint-count badges into the caller's
          README on default-branch pushes. ON BY DEFAULT — set false to opt out.
          Needs `permissions: contents: write` on the calling job to actually
          push; without it the badges are still generated and the push degrades
          to a warning rather than failing the run.
        type: boolean
        required: false
        default: true
      badge_insert:
        description: >-
          When a README has no badges yet, insert them after the first `# ` heading.
          True keeps today's behaviour. Set false to only ever REFRESH badges that
          already exist — badges are on by default, so on first upgrade insertion
          means an unsolicited `chore(ci): update README badges` commit in a repo
          that never asked for them.
        type: boolean
        required: false
        default: true
      readme_path:
        description: 'README to rewrite, REPO-ROOT relative (not working_directory relative).'
        type: string
        required: false
        default: 'README.md'
      badge_branch:
        description: >-
          Branch the badge commit is pushed to. Empty ⇒ the repository default
          branch. Set to a sandbox branch to trial the feature.
        type: string
        required: false
        default: ''

    secrets:
      # NOTE: must NOT be named github_token / GITHUB_TOKEN — GitHub reserves those
      # as a system secret name inside workflow_call and rejects the workflow at parse
      # time ("would collide with system reserved name").
      go_private_token:
        description: 'Token for fetching private Go modules. Required when go_private is set.'
        required: false

# No workflow-level `permissions:` on purpose. A reusable workflow's declared
# permissions are validated against the CALLER at startup, before any job-level
# `if:` runs — so declaring more than a caller granted fails the whole run with
# `startup_failure` and no logs. Omitting it here lets each job say what it needs
# and lets the badge job inherit whatever the caller actually granted.

concurrency:
  group: ci-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v2.1.1

jobs:
  # build · vet · lint always here; tests here too UNLESS enable_services routes
  # them to the go-db job below (service containers cannot be attached
  # conditionally to a single job, so the DB path is a second job).
  go:
    name: build · vet${{ inputs.enable_services && '' || ' · test' }} · lint
    permissions:
      contents: read
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      coverage: ${{ steps.test.outputs.coverage }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          # setup-go ignores go-version-file when go-version is set.
          go-version-file: ${{ inputs.go_version == '' && inputs.go_version_file || '' }}
          cache: true # module + build cache keyed on go.sum

      - name: Configure private module access
        if: ${{ inputs.go_private != '' }}
        env:
          GH_TOKEN: ${{ secrets.go_private_token }}
          GO_PRIVATE: ${{ inputs.go_private }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::go_private is set but the go_private_token secret is empty."; exit 1
          fi
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=${GO_PRIVATE}" >> "$GITHUB_ENV"

      - name: go build
        if: ${{ inputs.run_build }}
        run: go build ${{ inputs.build_packages }}

      - name: go vet
        if: ${{ inputs.run_vet }}
        run: go vet ./...

      - name: go test
        id: test
        if: ${{ inputs.run_tests && !inputs.enable_services }}
        env:
          TEST_ARGS: ${{ inputs.test_args }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
          UPDATE_BADGES: ${{ inputs.update_badges }}
        run: |
          # Coverage is MEASURED when a gate is set OR badges are on; it is only
          # ENFORCED when coverage_threshold != 0.
          # TEST_ARGS is deliberately unquoted — it carries multiple go-test args.
          # shellcheck disable=SC2086
          if [ "${COVERAGE_THRESHOLD}" != "0" ] || [ "${UPDATE_BADGES}" = "true" ]; then
            go test -coverprofile=coverage.out -covermode=atomic ${TEST_ARGS}
            TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
            echo "coverage=${TOTAL}" >> "$GITHUB_OUTPUT"
            if [ "${COVERAGE_THRESHOLD}" != "0" ]; then
              echo "::notice::total coverage ${TOTAL}% (threshold ${COVERAGE_THRESHOLD}%)"
              awk -v t="${TOTAL:-0}" -v thr="${COVERAGE_THRESHOLD}" \
                'BEGIN { if (t+0 < thr+0) { exit 1 } }' \
                || { echo "::error::coverage ${TOTAL}% is below threshold ${COVERAGE_THRESHOLD}%"; exit 1; }
            else
              echo "::notice::total coverage ${TOTAL}%"
            fi
          else
            go test ${TEST_ARGS}
          fi

      - name: golangci-lint
        if: ${{ inputs.run_lint }}
        continue-on-error: ${{ !inputs.lint_blocking }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci_version }}
          args: ${{ inputs.golangci_args }}
          working-directory: ${{ inputs.working_directory }}

  # DB-backed tests. Only runs when enable_services=true. postgres/mysql/redis
  # all start (GitHub cannot attach a service conditionally); a suite connects to
  # whichever it needs on localhost. Override *_image to pin/skip-pull versions.
  go-db:
    name: test (postgres · mysql · redis)
    if: ${{ inputs.run_tests && inputs.enable_services }}
    permissions:
      contents: read
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      coverage: ${{ steps.test.outputs.coverage }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres_db }}
          POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready" --health-interval 10s
          --health-timeout 5s --health-retries 5
      mysql:
        image: ${{ inputs.mysql_image }}
        env:
          MYSQL_DATABASE: ${{ inputs.mysql_database }}
          MYSQL_ROOT_PASSWORD: ${{ inputs.mysql_root_password }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: ${{ inputs.redis_image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          go-version-file: ${{ inputs.go_version == '' && inputs.go_version_file || '' }}
          cache: true

      - name: Configure private module access
        if: ${{ inputs.go_private != '' }}
        env:
          GH_TOKEN: ${{ secrets.go_private_token }}
          GO_PRIVATE: ${{ inputs.go_private }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::go_private is set but the go_private_token secret is empty."; exit 1
          fi
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=${GO_PRIVATE}" >> "$GITHUB_ENV"

      - name: go test (with services)
        id: test
        env:
          TEST_ARGS: ${{ inputs.test_args }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
          UPDATE_BADGES: ${{ inputs.update_badges }}
        run: |
          # Coverage is MEASURED when a gate is set OR badges are on; it is only
          # ENFORCED when coverage_threshold != 0.
          # TEST_ARGS is deliberately unquoted — it carries multiple go-test args.
          # shellcheck disable=SC2086
          if [ "${COVERAGE_THRESHOLD}" != "0" ] || [ "${UPDATE_BADGES}" = "true" ]; then
            go test -coverprofile=coverage.out -covermode=atomic ${TEST_ARGS}
            TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
            echo "coverage=${TOTAL}" >> "$GITHUB_OUTPUT"
            if [ "${COVERAGE_THRESHOLD}" != "0" ]; then
              echo "::notice::total coverage ${TOTAL}% (threshold ${COVERAGE_THRESHOLD}%)"
              awk -v t="${TOTAL:-0}" -v thr="${COVERAGE_THRESHOLD}" \
                'BEGIN { if (t+0 < thr+0) { exit 1 } }' \
                || { echo "::error::coverage ${TOTAL}% is below threshold ${COVERAGE_THRESHOLD}%"; exit 1; }
            else
              echo "::notice::total coverage ${TOTAL}%"
            fi
          else
            go test ${TEST_ARGS}
          fi

  # Commit shields.io badges back into the caller's README. Isolated as its own
  # job so `contents: write` never touches the build/test jobs, and so the badge
  # logic exists once instead of being duplicated across the services split.
  # No `defaults.run.working-directory` here — readme_path is repo-root relative.
  badges:
    name: README badges
    needs: [go, go-db]
    if: >-
      ${{ inputs.update_badges
          && github.event_name == 'push'
          && !cancelled()
          && needs.go.result == 'success'
          && contains(fromJSON('["success","skipped"]'), needs['go-db'].result)
          && github.ref_name == (inputs.badge_branch != '' && inputs.badge_branch
                                 || github.event.repository.default_branch) }}
    # Inherits the caller's grant deliberately — see the note above `concurrency`.
    # With `contents: write` the badge commit lands; with read-only the push step
    # degrades to a warning instead of failing the run.
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # ref: is required — the default detached-HEAD checkout cannot be pushed from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Rewrite README badges
        env:
          README: ${{ inputs.readme_path }}
          SCAN_DIR: ${{ inputs.working_directory }}
          BADGE_INSERT: ${{ inputs.badge_insert }}
          COVERAGE: ${{ needs['go-db'].result == 'success' && needs['go-db'].outputs.coverage || needs.go.outputs.coverage }}
        run: |
          # A warning, not an error: badges default to on, so this runs against
          # repos that never asked for them and must not fail their CI.
          if [ ! -f "$README" ]; then
            echo "::warning::readme_path '${README}' not found at the repository root — skipping badges"
            exit 0
          fi

          # grep exits 1 on zero matches; that is a valid count, not a failure.
          # Deliberately narrower than zopsmart/workflows' `grep -r -E '//\s*nolint' .`,
          # which also counts .git/, vendor/ and binaries. Expect a LOWER number.
          SUPPRESSIONS=$({ grep -rIE --include='*.go' --exclude-dir=vendor --exclude-dir=.git \
            -- '//[[:space:]]*nolint' "${SCAN_DIR:-.}" || true; } | wc -l | tr -d ' ')

          # shields.io: '%' must be percent-encoded, and a literal '-' in a label
          # must be doubled ('--') because '-' separates label/message/colour.
          ramp() {
            awk -v p="${1:-0}" 'BEGIN {
              if (p+0 >= 90)      print "brightgreen";
              else if (p+0 >= 80) print "green";
              else if (p+0 >= 70) print "yellowgreen";
              else if (p+0 >= 60) print "yellow";
              else if (p+0 >= 50) print "orange";
              else                print "red";
            }'
          }

          PENDING=""
          upsert() { # $1 = alt text, $2 = full badge markdown
            if grep -qF "![$1](" "$README"; then
              # Anchored on the alt text so a pre-existing (incl. legacy zopsmart)
              # badge is replaced in place rather than duplicated.
              sed -i "s|!\\[$1\\]([^)]*)|$2|" "$README"
            else
              PENDING="${PENDING:+$PENDING }$2"
            fi
          }

          if [ -n "${COVERAGE}" ]; then
            upsert "Coverage" \
              "![Coverage](https://img.shields.io/badge/Coverage-${COVERAGE}%25-$(ramp "${COVERAGE}"))"
          else
            echo "::notice::no coverage value available — skipping the coverage badge"
          fi

          if [ "${SUPPRESSIONS}" -gt 0 ]; then NOLINT_COLOUR=orange; else NOLINT_COLOUR=brightgreen; fi
          upsert "nolint count" \
            "![nolint count](https://img.shields.io/badge/nolint_count-${SUPPRESSIONS}-${NOLINT_COLOUR})"

          if [ -n "${PENDING}" ] && [ "${BADGE_INSERT}" != "true" ]; then
            # Refresh-only: the caller has opted out of being given badges they
            # never asked for. Existing badges (upserted above) are still updated.
            echo "::notice::badge_insert is false and '${README}' has no badges yet — none were added"
          elif [ -n "${PENDING}" ]; then
            if grep -q '^# ' "$README"; then
              awk -v ins="${PENDING}" '
                { print }
                !done && /^# / { print ""; print ins; done = 1 }
              ' "$README" > "$README.badges.tmp"
            else
              { printf '%s\n\n' "${PENDING}"; cat "$README"; } > "$README.badges.tmp"
            fi
            mv "$README.badges.tmp" "$README"
          fi

      - name: Commit + push
        env:
          README: ${{ inputs.readme_path }}
          BRANCH: ${{ inputs.badge_branch != '' && inputs.badge_branch || github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- "$README"; then
            echo "::notice::README badges already up to date — nothing to commit"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$README"
          git commit -m 'chore(ci): update README badges'
          # No [skip ci] needed: pushes authenticated with GITHUB_TOKEN do not
          # trigger further workflow runs.
          ERR="${RUNNER_TEMP:-/tmp}/badge-push.err"
          push() { git push origin "HEAD:${BRANCH}" 2>"$ERR"; }

          # Badges are on by default, so this job also runs for callers that never
          # granted write. That is not an error — say so and move on, rather than
          # failing a CI run over a cosmetic README update.
          readonly_token() {
            grep -qiE '403|permission|denied|not authorized|read-only|protected branch' "$ERR"
          }

          if push; then exit 0; fi
          if readonly_token; then
            echo "::warning::README badges were generated but not pushed — the workflow token cannot write to '${BRANCH}'. Grant 'permissions: contents: write' on the job that calls this workflow, or set 'update_badges: false'."
            exit 0
          fi

          echo "::notice::push rejected — rebasing once and retrying"
          # Guarded: an unguarded `git pull --rebase` failing would abort this step
          # under `set -e` and fail the caller's CI, which is the same unfairness the
          # readonly_token branch below exists to avoid.
          if ! git pull --rebase origin "${BRANCH}" 2>"$ERR"; then
            echo "::warning::README badges were generated but not pushed — could not rebase onto '${BRANCH}'."
            cat "$ERR" >&2
            exit 0
          fi
          if push; then exit 0; fi

          # No push failure may fail the run. Badges are cosmetic AND on by default,
          # so this job executes for callers that never asked for them; failing their
          # CI over a README commit is not a trade they agreed to. The reason is still
          # surfaced — as a warning and on stderr — it just does not gate the build.
          echo "::warning::README badges were generated but not pushed. See the error below; set 'update_badges: false' to stop trying."
          cat "$ERR" >&2
          exit 0
