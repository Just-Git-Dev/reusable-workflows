# Reusable Node CI: install · lint · test · build, with setup-node caching.
#
# The universal core every Node/React repo copy-pastes. Bespoke steps (OpenAPI
# type-drift checks, sibling-repo checkouts, custom guards) stay as their own
# jobs/steps in the caller. Every stage is toggleable; commands default to npm
# but are overridable, so yarn/pnpm and no-dependency suites (`node --test`) fit
# by overriding install/test commands and the cache backend.
#
# enable_services runs the test step in a `node-db` job with postgres + mysql +
# redis service containers on localhost (5432 / 3306 / 6379), for DB-backed Node
# backends — the same capability ci-go offers. Service containers are not
# language-specific; a Node/Python/Java backend gets them the same way.
#
# update_badges commits shields.io Coverage + eslint-disable-count badges back
# into the caller's README on default-branch pushes (parity with
# zopsmart/workflows test-and-lint). ON BY DEFAULT — set update_badges: false to
# opt out. To push, the caller must grant `permissions: contents: write` on the
# calling job; without it the badges are generated and the push degrades to a
# warning, never a failed run. Coverage is read from an Istanbul `json-summary`
# report, so the caller's test_command must emit one.
name: ci-node

on:
  workflow_call:
    inputs:
      runs_on:
        # setup-node v7 runs on Node 24, which needs Actions Runner >= v2.327.1.
        # GitHub-hosted runners satisfy this; a self-hosted label must be on >= v2.327.1.
        description: 'Runner label. Self-hosted runners must be on Actions Runner >= v2.327.1 (Node 24).'
        type: string
        required: false
        default: 'ubuntu-latest'
      working_directory:
        description: 'Directory to run install/lint/test/build in (monorepo package root).'
        type: string
        required: false
        default: '.'
      node_version:
        description: >-
          Node.js version (any setup-node spec: 24, 22, lts/*). Defaults to the
          active LTS. Node 20 reached end-of-life on 2026-04-30 and receives no
          security patches — pin it explicitly only if you must.
        type: string
        required: false
        default: '24'
      node_cache:
        description: 'setup-node cache backend (npm | yarn | pnpm). Empty string disables caching.'
        type: string
        required: false
        default: 'npm'
      cache_dependency_path:
        description: 'Lockfile setup-node keys its cache on. Defaults to package-lock.json in working_directory.'
        type: string
        required: false
        default: ''
      cache_node_modules:
        description: >-
          Cache the installed node_modules tree and SKIP the install step on an exact
          lockfile hit. Off by default. node_cache (above) only caches the npm
          download cache — npm still unpacks and links the tree every run, which for
          a large app is most of the install time. Opt in only if you understand the
          trade: on a hit, install_command never runs, so package lifecycle scripts
          (postinstall, prisma generate, husky, playwright install) never run either.
          Only the node_modules directly under working_directory is cached — a
          monorepo with nested node_modules is not fully covered.
        type: boolean
        required: false
        default: false
      enable_corepack:
        description: 'Run `corepack enable` before setup-node (needed for pnpm / modern yarn caching).'
        type: boolean
        required: false
        default: false
      npm_registry_url:
        description: >
          Private npm registry to authenticate against, e.g. https://npm.pkg.github.com.
          Empty (the default) leaves registry auth untouched — setup-node writes no .npmrc
          at all, so callers that do not need it are unaffected.
        type: string
        required: false
        default: ''
      npm_registry_scope:
        description: >
          Package scope routed to npm_registry_url, e.g. "@acme". Optional: for
          npm.pkg.github.com setup-node falls back to the repository owner. Ignored
          unless npm_registry_url is set.
        type: string
        required: false
        default: ''
      timeout_minutes:
        description: 'Job timeout.'
        type: number
        required: false
        default: 15
      install:
        description: 'Run the install step.'
        type: boolean
        required: false
        default: true
      install_command:
        description: 'Dependency install command.'
        type: string
        required: false
        default: 'npm ci'
      run_lint:
        description: 'Run the lint step.'
        type: boolean
        required: false
        default: true
      lint_command:
        description: 'Lint command.'
        type: string
        required: false
        default: 'npm run lint'
      lint_blocking:
        description: 'When false, a lint failure is reported but does not fail the job.'
        type: boolean
        required: false
        default: true
      run_tests:
        description: 'Run the test step.'
        type: boolean
        required: false
        default: true
      test_command:
        description: 'Test command.'
        type: string
        required: false
        default: 'npm test'
      coverage_threshold:
        description: >-
          Minimum total line-coverage percent, read from coverage_summary_path.
          0 disables the gate. Non-zero requires test_command to emit an Istanbul
          json-summary report.
        type: number
        required: false
        default: 0
      coverage_summary_path:
        description: >-
          Istanbul json-summary report, relative to working_directory. Read when
          coverage_threshold is non-zero or update_badges is true.
        type: string
        required: false
        default: 'coverage/coverage-summary.json'
      enable_services:
        description: >-
          Run tests in a job with postgres + mysql + redis service containers
          (localhost 5432 / 3306 / 6379). Use for DB-backed Node backends.
        type: boolean
        required: false
        default: false
      postgres_image:
        description: 'Postgres service image (enable_services only).'
        type: string
        required: false
        default: 'postgres:16'
      postgres_db:
        description: 'POSTGRES_DB for the postgres service.'
        type: string
        required: false
        default: 'test'
      postgres_password:
        description: 'POSTGRES_PASSWORD for the postgres service.'
        type: string
        required: false
        default: 'postgres'
      mysql_image:
        description: 'MySQL service image (enable_services only).'
        type: string
        required: false
        default: 'mysql:8'
      mysql_database:
        description: 'MYSQL_DATABASE for the mysql service.'
        type: string
        required: false
        default: 'test'
      mysql_root_password:
        description: 'MYSQL_ROOT_PASSWORD for the mysql service.'
        type: string
        required: false
        default: 'root'
      redis_image:
        description: 'Redis service image (enable_services only).'
        type: string
        required: false
        default: 'redis:7'
      run_build:
        description: 'Run the build step.'
        type: boolean
        required: false
        default: true
      build_command:
        description: 'Build command.'
        type: string
        required: false
        default: 'npm run build'
      update_badges:
        description: >-
          Commit shields.io Coverage + eslint-disable-count badges into the
          caller's README on default-branch pushes. ON BY DEFAULT — set false to
          opt out. Needs `permissions: contents: write` on the calling job to
          actually push; without it the badges are still generated and the push
          degrades to a warning rather than failing the run.
        type: boolean
        required: false
        default: true
      badge_insert:
        description: >-
          When a README has no badges yet, insert them after the first `# ` heading.
          True keeps today's behaviour. Set false to only ever REFRESH badges that
          already exist — badges are on by default, so on first upgrade insertion
          means an unsolicited `chore(ci): update README badges` commit in a repo
          that never asked for them.
        type: boolean
        required: false
        default: true
      readme_path:
        description: 'README to rewrite, REPO-ROOT relative (not working_directory relative).'
        type: string
        required: false
        default: 'README.md'
      badge_branch:
        description: >-
          Branch the badge commit is pushed to. Empty ⇒ the repository default
          branch. Set to a sandbox branch to trial the feature.
        type: string
        required: false
        default: ''
    secrets:
      npm_auth_token:
        description: >
          Token for npm_registry_url, exposed to the install step as NODE_AUTH_TOKEN.
          A secret rather than an input because workflow_call inputs are not masked in
          logs. For GitHub Packages this needs read:packages, and must be a PAT when the
          package lives in a different repo than the caller — GITHUB_TOKEN only reaches
          packages owned by, or explicitly shared with, the caller repo.
        required: false

# No workflow-level `permissions:` on purpose. A reusable workflow's declared
# permissions are validated against the CALLER at startup, before any job-level
# `if:` runs — so declaring more than a caller granted fails the whole run with
# `startup_failure` and no logs. Omitting it here lets each job say what it needs
# and lets the badge job inherit whatever the caller actually granted.

concurrency:
  group: ci-node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v2.3.0

jobs:
  # install · lint · build always here; tests here too UNLESS enable_services
  # routes them to the node-db job below (service containers cannot be attached
  # conditionally to a single job, so the DB path is a second job).
  node:
    name: install · lint${{ inputs.enable_services && '' || ' · test' }} · build
    permissions:
      contents: read
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        if: ${{ inputs.enable_corepack }}
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.node_cache }}
          cache-dependency-path: ${{ inputs.cache_dependency_path != '' && inputs.cache_dependency_path || format('{0}/package-lock.json', inputs.working_directory) }}
          # Empty ⇒ setup-node skips auth entirely (no .npmrc, no NPM_CONFIG_USERCONFIG),
          # so callers without a private registry keep exactly today's behaviour.
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.npm_registry_scope }}

      # Opt-in. The key is exact-match only — no restore-keys — because a prefix
      # fallback would restore a tree built from a DIFFERENT lockfile and then skip
      # the install that would have reconciled it. Keyed on the version setup-node
      # actually resolved, so `lts/*` sliding to a new major misses rather than
      # restoring native modules built against the old ABI.
      - name: Restore node_modules
        id: node_modules_cache
        if: ${{ inputs.install && inputs.cache_node_modules }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working_directory }}/node_modules
          key: node-modules-${{ runner.os }}-${{ steps.setup.outputs.node-version || inputs.node_version }}-${{ hashFiles(inputs.cache_dependency_path != '' && inputs.cache_dependency_path || format('{0}/package-lock.json', inputs.working_directory)) }}

      - name: Install
        if: ${{ inputs.install && steps.node_modules_cache.outputs.cache-hit != 'true' }}
        env:
          # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` into $RUNNER_TEMP/.npmrc;
          # npm expands it here, at install time. Empty when no registry is configured.
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token }}
        run: ${{ inputs.install_command }}

      # Skipping the install is invisible in the log otherwise, and it is the first
      # thing to suspect when a build fails on a missing postinstall artefact.
      - name: Note the skipped install
        if: ${{ steps.node_modules_cache.outputs.cache-hit == 'true' }}
        env:
          # Via the environment, never spliced into the body: a caller-supplied
          # string interpolated into `run:` is a script-injection seam.
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: echo "::notice::node_modules restored from cache — '$INSTALL_COMMAND' was skipped, so package lifecycle scripts did not run."

      - name: Lint
        if: ${{ inputs.run_lint }}
        continue-on-error: ${{ !inputs.lint_blocking }}
        run: ${{ inputs.lint_command }}

      - name: Test
        if: ${{ inputs.run_tests && !inputs.enable_services }}
        run: ${{ inputs.test_command }}

      # Coverage is MEASURED when a gate is set OR badges are on; it is only
      # ENFORCED when coverage_threshold != 0. Parsed with node (guaranteed
      # present here) rather than jq (not guaranteed on every runner label).
      - name: Coverage
        id: coverage
        if: ${{ inputs.run_tests && !inputs.enable_services && (inputs.coverage_threshold != 0 || inputs.update_badges) }}
        env:
          SUMMARY: ${{ inputs.coverage_summary_path }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          # The JS is deliberately single-quoted: it must reach node verbatim,
          # env vars are read via process.env, not shell expansion.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const p = process.env.SUMMARY;
            const how = "test_command must emit an Istanbul json-summary report (jest --coverage --coverageReporters=json-summary, or vitest --coverage --coverage.reporter=json-summary)";
            if (!fs.existsSync(p)) {
              const gate = Number(process.env.COVERAGE_THRESHOLD || 0);
              if (gate > 0) {
                console.log(`::error::coverage summary "${p}" not found, but coverage_threshold is ${gate} — ${how}`);
                process.exit(1);
              }
              // Badges-only: coverage is a nice-to-have here. Badges are ON BY
              // DEFAULT from v1.21.0, so failing would break every caller whose
              // tests do not emit coverage — which is most of them. The badge
              // step omits the coverage badge and keeps the suppression one.
              console.log(`::warning::coverage summary "${p}" not found — skipping the coverage badge. ${how}`);
              process.exit(0);
            }
            const pct = JSON.parse(fs.readFileSync(p, "utf8")).total.lines.pct;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `coverage=${pct}\n`);
            const thr = Number(process.env.COVERAGE_THRESHOLD || 0);
            if (thr > 0) {
              console.log(`::notice::total coverage ${pct}% (threshold ${thr}%)`);
              if (pct < thr) {
                console.log(`::error::coverage ${pct}% is below threshold ${thr}%`);
                process.exit(1);
              }
            } else {
              console.log(`::notice::total coverage ${pct}%`);
            }
          '

      - name: Build
        if: ${{ inputs.run_build }}
        run: ${{ inputs.build_command }}

  # DB-backed tests. Only runs when enable_services=true. postgres/mysql/redis
  # all start (GitHub cannot attach a service conditionally); a suite connects to
  # whichever it needs on localhost. Override *_image to pin/skip-pull versions.
  node-db:
    name: test (postgres · mysql · redis)
    if: ${{ inputs.run_tests && inputs.enable_services }}
    permissions:
      contents: read
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres_db }}
          POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready" --health-interval 10s
          --health-timeout 5s --health-retries 5
      mysql:
        image: ${{ inputs.mysql_image }}
        env:
          MYSQL_DATABASE: ${{ inputs.mysql_database }}
          MYSQL_ROOT_PASSWORD: ${{ inputs.mysql_root_password }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: ${{ inputs.redis_image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        if: ${{ inputs.enable_corepack }}
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.node_cache }}
          cache-dependency-path: ${{ inputs.cache_dependency_path != '' && inputs.cache_dependency_path || format('{0}/package-lock.json', inputs.working_directory) }}
          # Empty ⇒ setup-node skips auth entirely (no .npmrc, no NPM_CONFIG_USERCONFIG),
          # so callers without a private registry keep exactly today's behaviour.
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.npm_registry_scope }}

      # Opt-in. The key is exact-match only — no restore-keys — because a prefix
      # fallback would restore a tree built from a DIFFERENT lockfile and then skip
      # the install that would have reconciled it. Keyed on the version setup-node
      # actually resolved, so `lts/*` sliding to a new major misses rather than
      # restoring native modules built against the old ABI.
      - name: Restore node_modules
        id: node_modules_cache
        if: ${{ inputs.install && inputs.cache_node_modules }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working_directory }}/node_modules
          key: node-modules-${{ runner.os }}-${{ steps.setup.outputs.node-version || inputs.node_version }}-${{ hashFiles(inputs.cache_dependency_path != '' && inputs.cache_dependency_path || format('{0}/package-lock.json', inputs.working_directory)) }}

      - name: Install
        if: ${{ inputs.install && steps.node_modules_cache.outputs.cache-hit != 'true' }}
        env:
          # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` into $RUNNER_TEMP/.npmrc;
          # npm expands it here, at install time. Empty when no registry is configured.
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token }}
        run: ${{ inputs.install_command }}

      # Skipping the install is invisible in the log otherwise, and it is the first
      # thing to suspect when a build fails on a missing postinstall artefact.
      - name: Note the skipped install
        if: ${{ steps.node_modules_cache.outputs.cache-hit == 'true' }}
        env:
          # Via the environment, never spliced into the body: a caller-supplied
          # string interpolated into `run:` is a script-injection seam.
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: echo "::notice::node_modules restored from cache — '$INSTALL_COMMAND' was skipped, so package lifecycle scripts did not run."

      - name: Test (with services)
        run: ${{ inputs.test_command }}

      # See the note on the `node` job's Coverage step.
      - name: Coverage
        id: coverage
        if: ${{ inputs.coverage_threshold != 0 || inputs.update_badges }}
        env:
          SUMMARY: ${{ inputs.coverage_summary_path }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          # The JS is deliberately single-quoted: it must reach node verbatim,
          # env vars are read via process.env, not shell expansion.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const p = process.env.SUMMARY;
            const how = "test_command must emit an Istanbul json-summary report (jest --coverage --coverageReporters=json-summary, or vitest --coverage --coverage.reporter=json-summary)";
            if (!fs.existsSync(p)) {
              const gate = Number(process.env.COVERAGE_THRESHOLD || 0);
              if (gate > 0) {
                console.log(`::error::coverage summary "${p}" not found, but coverage_threshold is ${gate} — ${how}`);
                process.exit(1);
              }
              // Badges-only: coverage is a nice-to-have here. Badges are ON BY
              // DEFAULT from v1.21.0, so failing would break every caller whose
              // tests do not emit coverage — which is most of them. The badge
              // step omits the coverage badge and keeps the suppression one.
              console.log(`::warning::coverage summary "${p}" not found — skipping the coverage badge. ${how}`);
              process.exit(0);
            }
            const pct = JSON.parse(fs.readFileSync(p, "utf8")).total.lines.pct;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `coverage=${pct}\n`);
            const thr = Number(process.env.COVERAGE_THRESHOLD || 0);
            if (thr > 0) {
              console.log(`::notice::total coverage ${pct}% (threshold ${thr}%)`);
              if (pct < thr) {
                console.log(`::error::coverage ${pct}% is below threshold ${thr}%`);
                process.exit(1);
              }
            } else {
              console.log(`::notice::total coverage ${pct}%`);
            }
          '

  # Commit shields.io badges back into the caller's README. Isolated as its own
  # job so `contents: write` never touches the build/test jobs, and so the badge
  # logic exists once instead of being duplicated across the services split.
  # No `defaults.run.working-directory` here — readme_path is repo-root relative.
  badges:
    name: README badges
    needs: [node, node-db]
    if: >-
      ${{ inputs.update_badges
          && github.event_name == 'push'
          && !cancelled()
          && needs.node.result == 'success'
          && contains(fromJSON('["success","skipped"]'), needs['node-db'].result)
          && github.ref_name == (inputs.badge_branch != '' && inputs.badge_branch
                                 || github.event.repository.default_branch) }}
    # Inherits the caller's grant deliberately — see the note above `concurrency`.
    # With `contents: write` the badge commit lands; with read-only the push step
    # degrades to a warning instead of failing the run.
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # ref: is required — the default detached-HEAD checkout cannot be pushed from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Rewrite README badges
        env:
          README: ${{ inputs.readme_path }}
          SCAN_DIR: ${{ inputs.working_directory }}
          BADGE_INSERT: ${{ inputs.badge_insert }}
          COVERAGE: ${{ needs['node-db'].result == 'success' && needs['node-db'].outputs.coverage || needs.node.outputs.coverage }}
        run: |
          # A warning, not an error: badges default to on, so this runs against
          # repos that never asked for them and must not fail their CI.
          if [ ! -f "$README" ]; then
            echo "::warning::readme_path '${README}' not found at the repository root — skipping badges"
            exit 0
          fi

          # grep exits 1 on zero matches; that is a valid count, not a failure.
          SUPPRESSIONS=$({ grep -rIE --include='*.js' --include='*.jsx' --include='*.ts' \
            --include='*.tsx' --include='*.vue' --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=build --exclude-dir=coverage --exclude-dir=.git \
            -- 'eslint-disable' "${SCAN_DIR:-.}" || true; } | wc -l | tr -d ' ')

          # shields.io: '%' must be percent-encoded, and a literal '-' in a label
          # must be doubled ('--') because '-' separates label/message/colour.
          ramp() {
            awk -v p="${1:-0}" 'BEGIN {
              if (p+0 >= 90)      print "brightgreen";
              else if (p+0 >= 80) print "green";
              else if (p+0 >= 70) print "yellowgreen";
              else if (p+0 >= 60) print "yellow";
              else if (p+0 >= 50) print "orange";
              else                print "red";
            }'
          }

          PENDING=""
          upsert() { # $1 = alt text, $2 = full badge markdown
            if grep -qF "![$1](" "$README"; then
              # Anchored on the alt text so a pre-existing (incl. legacy zopsmart)
              # badge is replaced in place rather than duplicated.
              sed -i "s|!\\[$1\\]([^)]*)|$2|" "$README"
            else
              PENDING="${PENDING:+$PENDING }$2"
            fi
          }

          if [ -n "${COVERAGE}" ]; then
            upsert "Coverage" \
              "![Coverage](https://img.shields.io/badge/Coverage-${COVERAGE}%25-$(ramp "${COVERAGE}"))"
          else
            echo "::notice::no coverage value available — skipping the coverage badge"
          fi

          if [ "${SUPPRESSIONS}" -gt 0 ]; then LINT_COLOUR=orange; else LINT_COLOUR=brightgreen; fi
          upsert "eslint-disable count" \
            "![eslint-disable count](https://img.shields.io/badge/eslint--disable_count-${SUPPRESSIONS}-${LINT_COLOUR})"

          if [ -n "${PENDING}" ] && [ "${BADGE_INSERT}" != "true" ]; then
            # Refresh-only: the caller has opted out of being given badges they
            # never asked for. Existing badges (upserted above) are still updated.
            echo "::notice::badge_insert is false and '${README}' has no badges yet — none were added"
          elif [ -n "${PENDING}" ]; then
            if grep -q '^# ' "$README"; then
              awk -v ins="${PENDING}" '
                { print }
                !done && /^# / { print ""; print ins; done = 1 }
              ' "$README" > "$README.badges.tmp"
            else
              { printf '%s\n\n' "${PENDING}"; cat "$README"; } > "$README.badges.tmp"
            fi
            mv "$README.badges.tmp" "$README"
          fi

      - name: Commit + push
        env:
          README: ${{ inputs.readme_path }}
          BRANCH: ${{ inputs.badge_branch != '' && inputs.badge_branch || github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- "$README"; then
            echo "::notice::README badges already up to date — nothing to commit"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$README"
          git commit -m 'chore(ci): update README badges'
          # No [skip ci] needed: pushes authenticated with GITHUB_TOKEN do not
          # trigger further workflow runs.
          ERR="${RUNNER_TEMP:-/tmp}/badge-push.err"
          push() { git push origin "HEAD:${BRANCH}" 2>"$ERR"; }

          # Badges are on by default, so this job also runs for callers that never
          # granted write. That is not an error — say so and move on, rather than
          # failing a CI run over a cosmetic README update.
          readonly_token() {
            grep -qiE '403|permission|denied|not authorized|read-only|protected branch' "$ERR"
          }

          if push; then exit 0; fi
          if readonly_token; then
            echo "::warning::README badges were generated but not pushed — the workflow token cannot write to '${BRANCH}'. Grant 'permissions: contents: write' on the job that calls this workflow, or set 'update_badges: false'."
            exit 0
          fi

          echo "::notice::push rejected — rebasing once and retrying"
          # Guarded: an unguarded `git pull --rebase` failing would abort this step
          # under `set -e` and fail the caller's CI, which is the same unfairness the
          # readonly_token branch below exists to avoid.
          if ! git pull --rebase origin "${BRANCH}" 2>"$ERR"; then
            echo "::warning::README badges were generated but not pushed — could not rebase onto '${BRANCH}'."
            cat "$ERR" >&2
            exit 0
          fi
          if push; then exit 0; fi

          # No push failure may fail the run. Badges are cosmetic AND on by default,
          # so this job executes for callers that never asked for them; failing their
          # CI over a README commit is not a trade they agreed to. The reason is still
          # surfaced — as a warning and on stderr — it just does not gate the build.
          echo "::warning::README badges were generated but not pushed. See the error below; set 'update_badges: false' to stop trying."
          cat "$ERR" >&2
          exit 0
