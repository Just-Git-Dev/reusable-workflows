          repository: Just-Git-Dev/reusable-workflows
          ref: ${{ env.WORKFLOW_VERSION }}
          path: .release-flow-src
          persist-credentials: false

      - name: Pin the CLI by content and put it on PATH
        run: |
          set -euo pipefail
