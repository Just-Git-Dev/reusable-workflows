# repos-secrets.yml — F8 of repos-as-code: one secret per service, one writer for its policy.
#
# Per `deploys:` entry of the register (`repos.yaml`) with `env_secret: true`: create the Secret
# Manager secret `<deployable>-env` once (empty, no version) if it is missing, adopt it if it exists,
# and make its WHOLE IAM policy exactly: `<deployable>-run` -> secretAccessor; `<deployable>-deployer`
# -> secretAccessor + secretVersionManager + viewer (what sync-bundle-key needs). Extra lines are
# reported, and removed only in enforce with `prune: true`. A thin shell over
# scripts/repos_secrets_plan.py: fetch live state -> plan -> report or apply.
#
# Never: delete a secret, add / read / enable / disable / destroy a secret VERSION (this identity
# holds no `secretmanager.versions.*` use), touch a secret that is not `<deployable>-env` for a
# registered deployable, bind another role, or grant at project level.
# Contract and action list: docs/repos-register.md. Page: docs/repos-secrets.md.
#
# Caller example (pin the tag; the planner is fetched at the version stamped in WORKFLOW_VERSION):
#   jobs:
#     secrets:
#       uses: Just-Git-Dev/reusable-workflows/.github/workflows/repos-secrets.yml@vX.Y.Z
#       with:
#         workload_identity_provider: projects/123/locations/global/workloadIdentityPools/p/providers/github
#         service_account: repo-admin@example-proj.iam.gserviceaccount.com
#         project_id: example-proj
name: repos-secrets

on:
  workflow_call:
    inputs:
      workload_identity_provider:
        description: 'WIF provider resource name used to authenticate as the repo-admin SA.'
        required: true
        type: string
      service_account:
        description: 'The repo-admin service account email (acted as through WIF).'
        required: true
        type: string
      project_id:
        description: 'GCP project that hosts the secrets and the service accounts.'
        required: true
        type: string
      register_path:
        description: 'Path of the register file in the caller repository.'
        required: false
        type: string
        default: 'repos.yaml'
      prune:
        description: 'Enforce only: remove policy lines F8 would not write. Default false = report them as drift.'
        required: false
        type: boolean
        default: false
      replication:
        description: "Replication of a newly created secret: 'automatic', or one region (user-managed), e.g. europe-west1."
        required: false
        type: string
        default: 'automatic'
      environment:
        description: 'GitHub environment the job runs in (holds the approval gate for the repo-admin identity).'
        required: false
        type: string
        default: 'repo-admin'

permissions:
  contents: read

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v5.0.0

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGISTER: ${{ inputs.register_path }}
      PRUNE: ${{ inputs.prune }}
      REPLICATION: ${{ inputs.replication }}
    steps:
      - name: Refuse unless repo-admin on the main branch
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ github.ref }}
          REGISTER_PATH: ${{ inputs.register_path }}
        run: |
          set -euo pipefail
          [ "$ENVIRONMENT" = "repo-admin" ] || { echo "::error::environment is '$ENVIRONMENT', this workflow runs only in repo-admin"; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::ref is '$REF'; repos-as-code runs only on refs/heads/main"; exit 1; }
          [[ "$REGISTER_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$REGISTER_PATH" != *..* && "$REGISTER_PATH" != /* ]] || { echo "::error::register_path '$REGISTER_PATH' is not a plain relative path"; exit 1; }

      - name: Checkout the caller (the register)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the planner at this workflow's version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Just-Git-Dev/reusable-workflows
          ref: ${{ env.WORKFLOW_VERSION }}
          path: .repos-src
          persist-credentials: false

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install the pinned planner dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --disable-pip-version-check -r .repos-src/requirements-ci.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Fetch live state
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          import yaml

          project = os.environ["PROJECT_ID"]
          reg = yaml.safe_load(open(os.environ["REGISTER"]))

          def gcloud(*args, missing_ok=False):
              p = subprocess.run(["gcloud", *args, "--project", project, "--format=json"],
                                 capture_output=True, text=True)
              if p.returncode == 0:
                  return json.loads(p.stdout or "null")
              if missing_ok and ("NOT_FOUND" in p.stderr or "not found" in p.stderr.lower()):
                  return None
              sys.exit("error: register: gcloud %s failed: %s" % (" ".join(args[:4]), p.stderr.strip()[:300]))

          # Read-only calls only: `secrets describe` / `get-iam-policy` (no version is listed or
          # accessed) and `iam service-accounts describe`. No project-level IAM is read.
          state = {"project_id": project, "service_accounts": {}, "secrets": {}}
          for repo in reg.get("repos") or []:
              for d in repo.get("deploys") or []:
                  if "cloud_run" not in d or d.get("env_secret") is not True:
                      continue
                  base = d["cloud_run"]
                  for sa in (base + "-deployer", base + "-run"):
                      email = "%s@%s.iam.gserviceaccount.com" % (sa, project)
                      if gcloud("iam", "service-accounts", "describe", email, missing_ok=True) is not None:
                          state["service_accounts"][sa] = {}
                  secret = base + "-env"
                  if gcloud("secrets", "describe", secret, missing_ok=True) is not None:
                      pol = gcloud("secrets", "get-iam-policy", secret)
                      # a conditional binding is dropped below and gcloud is called without
                      # --condition, so F8 could neither see nor fix it: refuse (TODO.md has the redesign)
                      if any(b.get("condition") for b in (pol or {}).get("bindings", [])):
                          sys.exit("error: %s: the policy carries an IAM condition; repos-secrets cannot "
                                   "manage conditional bindings, nothing was changed" % secret)
                      state["secrets"][secret] = {"iam": [
                          {"role": b["role"], "members": b.get("members", [])}
                          for b in (pol or {}).get("bindings", [])]}
          json.dump(state, open("state.json", "w"), indent=2)
          print("live state written: %d service account(s), %d secret(s)" % (
              len(state["service_accounts"]), len(state["secrets"])))
          PY

      - name: Plan
        run: |
          prune_flag=()
          [ "$PRUNE" != "true" ] || prune_flag=(--prune)
          python3 .repos-src/scripts/repos_secrets_plan.py --feature secrets \
            --register "$REGISTER" --state state.json "${prune_flag[@]}" > plan.json
          echo "actions: $(jq length plan.json)"

      - name: Report
        run: |
          examined=$(jq '[.[].repo] | unique | length' plan.json)
          {
            echo "## repos-secrets"
            echo
            echo "Examined **${examined}** repo(s); **$(jq length plan.json)** plan entr(ies). Prune: ${PRUNE}."
            echo
            echo "| repo | action | details |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.repo) | \(.action) | `\(.details | tostring)` |"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | select(.action=="needs-jgd") | "::warning::\(.repo): needs an access-provisioning change: \(.details.needs)"' plan.json
          jq -r '.[] | select(.action=="drift" and .details.would=="remove-secret-binding") | "::warning::\(.repo): \(.details.secret): extra line \(.details.role) for \(.details.member) (removed only in enforce with prune)"' plan.json
          [ "$examined" != "0" ] || echo "::warning::no deploys entry has env_secret: true; nothing was examined"

      - name: Apply (secrets and their policy lines only, in order)
        run: |
          writes=$(jq '[.[] | select(.action=="create-secret" or .action=="add-secret-binding" or .action=="remove-secret-binding")] | length' plan.json)
          echo "write actions to apply: $writes"
          # Re-check the WHOLE plan before the first write: an unknown verb (there is no verb to delete
          # a secret or touch a version), a secret that is not a derived `<d>-env`, a role/member pair
          # outside the two-principal policy, or a removal without prune fails with nothing applied.
          [[ "$REPLICATION" = "automatic" || "$REPLICATION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || { echo "::error::replication '$REPLICATION' is neither 'automatic' nor a region; nothing applied"; exit 1; }
          bad=$(jq '[.[] | select(.action as $a | ["in-sync","drift","adopt","needs-jgd","create-secret","add-secret-binding","remove-secret-binding"] | index($a) | not)] | length' plan.json)
          [ "$bad" = "0" ] || { echo "::error::plan holds $bad action(s) outside the allow-list; nothing applied"; exit 1; }
          rx='\A[a-z]([-a-z0-9]*[a-z0-9])?-env\z'
          badsecret=$(jq --arg rx "$rx" '[.[] | select(.action=="create-secret" or .action=="add-secret-binding" or .action=="remove-secret-binding")
              | select((.details.secret | type=="string") and (.details.secret | test($rx)) and (.details.secret | length <= 60) | not)] | length' plan.json)
          [ "$badsecret" = "0" ] || { echo "::error::refusing $badsecret action(s) on a secret that is not a derived <deployable>-env; nothing applied"; exit 1; }
          badcreate=$(jq '[.[] | select(.action=="create-secret") | select(
              (.details.labels["managed-by"]=="repos-secrets") and (.details.labels.deployable + "-env" == .details.secret) | not)] | length' plan.json)
          [ "$badcreate" = "0" ] || { echo "::error::refusing $badcreate create-secret action(s) whose labels do not match the secret name; nothing applied"; exit 1; }
          badadd=$(jq --arg p "$PROJECT_ID" '[.[] | select(.action=="add-secret-binding") | (.details.secret | sub("-env\\z"; "")) as $d
              | select(
                  ((.details.member == "serviceAccount:\($d)-run@\($p).iam.gserviceaccount.com") and (.details.role == "roles/secretmanager.secretAccessor"))
                  or ((.details.member == "serviceAccount:\($d)-deployer@\($p).iam.gserviceaccount.com")
                      and (.details.role as $r | ["roles/secretmanager.secretAccessor","roles/secretmanager.secretVersionManager","roles/secretmanager.viewer"] | index($r)))
                  | not)] | length' plan.json)
          [ "$badadd" = "0" ] || { echo "::error::refusing $badadd binding(s) outside the two-principal policy; nothing applied"; exit 1; }
          nrm=$(jq '[.[] | select(.action=="remove-secret-binding")] | length' plan.json)
          [ "$nrm" = "0" ] || [ "$PRUNE" = "true" ] || { echo "::error::plan holds $nrm remove-secret-binding action(s) but prune is not true; nothing applied"; exit 1; }
          badrm=$(jq '[.[] | select(.action=="remove-secret-binding") | select(
              (.details.role | test("\\A(roles/|projects/[a-z0-9-]+/roles/|organizations/[0-9]+/roles/)[A-Za-z0-9._]+\\z"))
              and (.details.member | test("\\A(serviceAccount|user|group|domain|principal|principalSet):[A-Za-z0-9._@:/+-]+\\z")) | not)] | length' plan.json)
          [ "$badrm" = "0" ] || { echo "::error::refusing $badrm remove-secret-binding action(s) with a malformed role or member; nothing applied"; exit 1; }
          # a removal never takes a WANTED line (the runtime accessor, the deployer's sync roles)
          wantedrm=$(jq --arg p "$PROJECT_ID" '[.[] | select(.action=="remove-secret-binding") | (.details.secret | sub("-env\\z"; "")) as $d
              | select(
                  ((.details.member == "serviceAccount:\($d)-run@\($p).iam.gserviceaccount.com") and (.details.role == "roles/secretmanager.secretAccessor"))
                  or ((.details.member == "serviceAccount:\($d)-deployer@\($p).iam.gserviceaccount.com")
                      and (.details.role as $r | ["roles/secretmanager.secretAccessor","roles/secretmanager.secretVersionManager","roles/secretmanager.viewer"] | index($r))))] | length' plan.json)
          [ "$wantedrm" = "0" ] || { echo "::error::refusing $wantedrm removal(s) of a line the policy is meant to hold; nothing applied"; exit 1; }
          [ "$writes" -gt 0 ] || exit 0
          # fd 3, not a pipe: gcloud would otherwise eat the loop's stdin, and a pipe would run the
          # loop in a subshell.
          while read -r a <&3; do
            act=$(jq -r .action <<<"$a")
            d=$(jq -c .details <<<"$a")
            secret=$(jq -r .secret <<<"$d")
            case "$act" in
              create-secret)
                dep=$(jq -r .labels.deployable <<<"$d")
                echo "create-secret $secret"
                if [ "$REPLICATION" = "automatic" ]; then
                  repl=(--replication-policy=automatic)
                else
                  repl=(--replication-policy=user-managed "--locations=$REPLICATION")
                fi
                gcloud secrets create "$secret" "${repl[@]}" \
                  "--labels=managed-by=repos-secrets,deployable=${dep}" --project="$PROJECT_ID" --quiet
                ;;
              add-secret-binding|remove-secret-binding)
                role=$(jq -r .role <<<"$d"); mem=$(jq -r .member <<<"$d")
                sub=add-iam-policy-binding
                [ "$act" = "add-secret-binding" ] || sub=remove-iam-policy-binding
                echo "$sub $role on $secret"
                gcloud secrets "$sub" "$secret" --member="$mem" --role="$role" --project="$PROJECT_ID" --quiet
                ;;
            esac
          done 3< <(jq -c '.[] | select(.action=="create-secret" or .action=="add-secret-binding" or .action=="remove-secret-binding")' plan.json)
