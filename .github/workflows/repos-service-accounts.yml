# repos-service-accounts.yml — F6 of repos-as-code: the project's own service accounts.
#
# Creates each SA listed in the register's top-level `service_accounts:` that does not exist, with
# its required description; updates the description / display name of one that differs.
# A thin shell over scripts/repos_sa_plan.py: fetch live SAs -> plan -> report or apply.
#
# Never: deletes an SA, creates a key, or grants any role (project-level or otherwise). An SA that
# exists live but is not in the register is left alone.
# Contract and action list: docs/repos-register.md. Page: docs/repos-service-accounts.md.
#
# Caller example (pin the tag; the planner is fetched at the version stamped in WORKFLOW_VERSION):
#   jobs:
#     service-accounts:
#       uses: Just-Git-Dev/reusable-workflows/.github/workflows/repos-service-accounts.yml@vX.Y.Z
#       with:
#         workload_identity_provider: projects/123/locations/global/workloadIdentityPools/p/providers/github
#         service_account: repo-admin@example-proj.iam.gserviceaccount.com
#         project_id: example-proj
name: repos-service-accounts

on:
  workflow_call:
    inputs:
      workload_identity_provider:
        description: 'WIF provider resource name used to authenticate as the repo-admin SA.'
        required: true
        type: string
      service_account:
        description: 'The repo-admin service account email (acted as through WIF).'
        required: true
        type: string
      project_id:
        description: 'GCP project id the service accounts are created in.'
        required: true
        type: string
      register_path:
        description: 'Path of the register file in the caller repository.'
        required: false
        type: string
        default: 'repos.yaml'
      environment:
        description: 'GitHub environment the job runs in (holds the approval gate for the repo-admin identity).'
        required: false
        type: string
        default: 'repo-admin'

permissions:
  contents: read

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v5.2.0

defaults:
  run:
    shell: bash

jobs:
  service-accounts:
    name: service-accounts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGISTER: ${{ inputs.register_path }}
    steps:
      - name: Refuse unless repo-admin on the main branch
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ github.ref }}
          REGISTER_PATH: ${{ inputs.register_path }}
        run: |
          set -euo pipefail
          [ "$ENVIRONMENT" = "repo-admin" ] || { echo "::error::environment is '$ENVIRONMENT', this workflow runs only in repo-admin"; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::ref is '$REF'; repos-as-code runs only on refs/heads/main"; exit 1; }
          [[ "$REGISTER_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$REGISTER_PATH" != *..* && "$REGISTER_PATH" != /* ]] || { echo "::error::register_path '$REGISTER_PATH' is not a plain relative path"; exit 1; }

      - name: Checkout the caller (the register)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the planner at this workflow's version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Just-Git-Dev/reusable-workflows
          ref: ${{ env.WORKFLOW_VERSION }}
          path: .repos-src
          persist-credentials: false

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install the pinned planner dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --disable-pip-version-check -r .repos-src/requirements-ci.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Fetch live state
        run: |
          gcloud iam service-accounts list --project="$PROJECT_ID" --format=json > live-sas.json
          jq '{service_accounts: [.[] | {name: (.email | split("@")[0]),
                description: (.description // ""), display_name: (.displayName // "")}]}' \
            live-sas.json > state.json
          echo "live state written: $(jq '.service_accounts | length' state.json) service account(s)"

      - name: Plan
        run: |
          python3 .repos-src/scripts/repos_sa_plan.py --feature service-accounts \
            --register "$REGISTER" --state state.json > plan.json
          echo "actions: $(jq length plan.json)"

      - name: Report
        run: |
          examined=$(python3 -c "import yaml,sys; print(len(yaml.safe_load(open(sys.argv[1])).get('service_accounts') or []))" "$REGISTER")
          {
            echo "## repos-service-accounts"
            echo
            echo "Examined **${examined}** service account(s); **$(jq length plan.json)** plan entr(ies)."
            echo
            echo "| action | details |"
            echo "|---|---|"
            jq -r '.[] | "| \(.action) | `\(.details | tostring)` |"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$examined" != "0" ] || echo "::warning::the register lists no service_accounts; nothing was examined"

      - name: Apply (create/update service accounts only, in order)
        run: |
          writes=$(jq '[.[] | select(.action=="create-service-account" or .action=="update-service-account")] | length' plan.json)
          echo "write actions to apply: $writes"
          # ruling 21: F6 creates and updates only the project's own `<d>-deployer` accounts. Re-checked
          # on the whole plan before the first write (\z, not $: `$` would accept a trailing newline).
          baddep=$(jq '[.[] | select(.action=="create-service-account" or .action=="update-service-account") | select((.details.name | type == "string" and test("\\A[a-z][a-z0-9-]*-deployer\\z")) | not)] | length' plan.json)
          [ "$baddep" = "0" ] || { echo "::error::refusing $baddep write(s) on a service account that is not a <deployable>-deployer; nothing applied"; exit 1; }
          [ "$writes" -gt 0 ] || exit 0
          # fd 3, not a pipe: gcloud would otherwise eat the loop's stdin.
          while read -r a <&3; do
            act=$(jq -r .action <<<"$a")
            name=$(jq -r .details.name <<<"$a")
            email="${name}@${PROJECT_ID}.iam.gserviceaccount.com"
            case "$act" in
              create-service-account)
                echo "create-service-account $name"
                gcloud iam service-accounts create "$name" --project="$PROJECT_ID" \
                  --display-name="$(jq -r .details.display_name <<<"$a")" \
                  --description="$(jq -r .details.description <<<"$a")" --quiet
                ;;
              update-service-account)
                field=$(jq -r .details.field <<<"$a")
                to=$(jq -r .details.to <<<"$a")
                echo "update-service-account $name ($field)"
                case "$field" in
                  description) gcloud iam service-accounts update "$email" --project="$PROJECT_ID" --description="$to" --quiet ;;
                  display_name) gcloud iam service-accounts update "$email" --project="$PROJECT_ID" --display-name="$to" --quiet ;;
                  *) echo "::error::refusing to update field $field"; exit 1 ;;
                esac
                ;;
            esac
          done 3< <(jq -c '.[] | select(.action=="create-service-account" or .action=="update-service-account")' plan.json)
