name: Deploy to Cloudflare Pages (reusable)

# Builds a static site and deploys it to a Cloudflare Pages project via
# cloudflare/wrangler-action. Everything project-specific — Pages project name,
# account id, build command, output dir, node version — is an input.
#
# `cloudflare_api_token` must be a token with the "Cloudflare Pages: Edit"
# permission, minted in the Cloudflare dashboard by a human (CI holding
# "User -> API Tokens -> Edit" would be privilege escalation). See
# rotate-cloudflare-token.yml for the rotation runbook.
#
# Callers own the trigger — typically a `v*.*.*` tag push plus workflow_dispatch.

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Cloudflare Pages project to deploy to.'
        type: string
        required: true
      account_id:
        description: 'Cloudflare account id. Not a credential; pass it from a repo/org variable.'
        type: string
        required: true
      working_directory:
        description: 'Directory to build and deploy from.'
        type: string
        required: false
        default: '.'
      build_command:
        description: 'Shell command that produces the static output, run in working_directory.'
        type: string
        required: false
        default: 'npm ci && npm run build'
      output_dir:
        description: 'Built static-assets directory to deploy, relative to working_directory.'
        type: string
        required: false
        default: 'dist'
      node_version:
        description: >-
          Node.js version for the build (any setup-node spec: 24, 22, lts/*).
          Defaults to the active LTS. Node 20 reached end-of-life on 2026-04-30 and
          receives no security patches — pin it explicitly only if you must.
        type: string
        required: false
        default: '24'
      node_cache:
        description: 'setup-node cache backend (npm | yarn | pnpm). Empty string disables caching.'
        type: string
        required: false
        default: 'npm'
      cache_dependency_path:
        description: 'Lockfile setup-node keys its cache on. Defaults to package-lock.json in working_directory.'
        type: string
        required: false
        default: ''
      npm_registry_url:
        description: >
          Private npm registry the build authenticates against, e.g. https://npm.pkg.github.com.
          Empty (the default) leaves registry auth untouched — setup-node writes no .npmrc
          at all, so callers that do not need it are unaffected.
        type: string
        required: false
        default: ''
      npm_registry_scope:
        description: >
          Package scope routed to npm_registry_url, e.g. "@acme". Optional: for
          npm.pkg.github.com setup-node falls back to the repository owner. Ignored
          unless npm_registry_url is set.
        type: string
        required: false
        default: ''
      branch:
        description: 'Pages deployment branch. The project production branch is usually "main".'
        type: string
        required: false
        default: 'main'
      ref:
        description: 'Git ref to check out and deploy (branch, tag, or SHA). Empty ⇒ the ref that triggered the run. Set this to re-deploy a specific tag from a workflow_dispatch run.'
        type: string
        required: false
        default: ''
      build_env:
        description: 'Extra environment for the build, as newline-separated KEY=VALUE pairs (values may contain spaces). Scoped to the build step only — never written to $GITHUB_ENV.'
        type: string
        required: false
        default: ''
      smoke_path:
        description: >-
          Path to fetch after deploying, e.g. "/" or "/device". Empty (the default)
          skips the check entirely. A deploy that succeeded is not the same as a
          working site; this is the difference.
        type: string
        required: false
        default: ''
      smoke_url_base:
        description: >-
          Origin to run smoke_path against. Empty ⇒ the deployment URL produced by
          THIS run, which is what you want: it tests the bundle just uploaded. Point
          it at a custom domain only for production-branch deploys — a preview deploy
          does not update the custom domain, so checking it would test the previous
          release and pass regardless.
        type: string
        required: false
        default: ''
      smoke_expect:
        description: >-
          Newline-separated substrings that must ALL appear in the response body.
          Use stable markers such as a root element id or the <title>; never hashed
          asset filenames, which change every build. Empty ⇒ status code only.
        type: string
        required: false
        default: ''
      smoke_status:
        description: 'HTTP status the smoke request must return.'
        type: string
        required: false
        default: '200'
      smoke_attempts:
        description: >-
          How many times to try before failing. Cloudflare Pages deploys are
          eventually consistent, so a single request would false-fail on slow
          propagation.
        type: number
        required: false
        default: 8
      smoke_interval_seconds:
        description: 'Seconds between smoke attempts.'
        type: number
        required: false
        default: 5
    secrets:
      cloudflare_api_token:
        description: 'Cloudflare API token with "Cloudflare Pages: Edit".'
        required: true
      npm_auth_token:
        description: >
          Token for npm_registry_url, exposed to the build step as NODE_AUTH_TOKEN.
          A secret rather than an input because workflow_call inputs are not masked in
          logs. For GitHub Packages this needs read:packages, and must be a PAT when the
          package lives in a different repo than the caller — GITHUB_TOKEN only reaches
          packages owned by, or explicitly shared with, the caller repo.
        required: false
    outputs:
      deployment_url:
        description: 'URL of the deployment produced by this run.'
        value: ${{ jobs.deploy.outputs.deployment_url }}

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ inputs.project_name }}-${{ inputs.branch }}
  cancel-in-progress: true

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v1.24.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip bot-authored pushes (dependabot/renovate) — they can't hold deploy creds.
    if: |
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.actor, 'renovate')
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty ⇒ checkout's default (the triggering ref); set to re-deploy a tag.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.node_cache }}
          cache-dependency-path: ${{ inputs.cache_dependency_path || format('{0}/package-lock.json', inputs.working_directory) }}
          # Empty ⇒ setup-node skips auth entirely (no .npmrc, no NPM_CONFIG_USERCONFIG),
          # so callers without a private registry keep exactly today's behaviour.
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.npm_registry_scope }}

      - name: Build
        env:
          # The default build_command installs, so the token belongs on this step.
          # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` into $RUNNER_TEMP/.npmrc;
          # npm expands it here. Empty when no registry is configured.
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token }}
          # Passed through the environment, never spliced into the script body:
          # a caller-supplied string interpolated into `run:` is a script-injection seam.
          BUILD_COMMAND: ${{ inputs.build_command }}
          BUILD_ENV: ${{ inputs.build_env }}
        run: |
          # Export caller-supplied build vars (KEY=VALUE per line) into THIS step's
          # shell only. Not $GITHUB_ENV — so they don't leak to later steps and a
          # value can't inject an env entry via a smuggled newline.
          while IFS= read -r kv; do
            [ -z "$kv" ] && continue
            # shellcheck disable=SC2163  # KEY=VALUE form is intentional
            export "$kv"
          done <<< "$BUILD_ENV"
          eval "$BUILD_COMMAND"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.cloudflare_api_token }}
          accountId: ${{ inputs.account_id }}
          workingDirectory: ${{ inputs.working_directory }}
          command: >-
            pages deploy ${{ inputs.output_dir }}
            --project-name=${{ inputs.project_name }}
            --branch=${{ inputs.branch }}
            --commit-hash=${{ github.sha }}

      # A green deploy only proves the upload succeeded. Realm-ID/ui added this after
      # the 2026-06-29 outage: a stale bundle went live with a broken client-routed
      # path and nothing noticed. Opt-in via smoke_path, and blocking when set — a
      # check that reports but does not fail would not have caught that either.
      - name: Smoke check
        if: inputs.smoke_path != ''
        env:
          BASE:      ${{ inputs.smoke_url_base != '' && inputs.smoke_url_base || steps.deploy.outputs.deployment-url }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
          EXPECT:    ${{ inputs.smoke_expect }}
          WANT:      ${{ inputs.smoke_status }}
          ATTEMPTS:  ${{ inputs.smoke_attempts }}
          INTERVAL:  ${{ inputs.smoke_interval_seconds }}
        run: |
          if [ -z "${BASE}" ]; then
            echo "::error::smoke_path is set but there is no URL to test: this run produced no deployment URL and smoke_url_base is empty."
            exit 1
          fi
          URL="${BASE%/}/${SMOKE_PATH#/}"
          BODY="${RUNNER_TEMP:-/tmp}/smoke-body"

          for attempt in $(seq 1 "${ATTEMPTS}"); do
            status=$(curl -sS -o "$BODY" -w '%{http_code}' "$URL" 2>/dev/null || echo "000")
            missing=""
            if [ "$status" = "${WANT}" ]; then
              while IFS= read -r marker; do
                [ -z "$marker" ] && continue
                grep -qF -- "$marker" "$BODY" || missing="${missing:+$missing, }${marker}"
              done <<< "${EXPECT}"
              if [ -z "$missing" ]; then
                echo "::notice::smoke check passed on attempt ${attempt}: ${URL} returned ${status}"
                {
                  echo ""
                  echo "- Smoke check: \`${URL}\` → ${status} ✅"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "attempt ${attempt}/${ATTEMPTS}: ${status} but missing marker(s): ${missing}" >&2
            else
              echo "attempt ${attempt}/${ATTEMPTS}: got ${status}, want ${WANT}" >&2
            fi
            [ "$attempt" -lt "${ATTEMPTS}" ] && sleep "${INTERVAL}"
          done

          {
            echo "::error::smoke check FAILED: ${URL} never returned ${WANT}${EXPECT:+ with the expected marker(s)} after ${ATTEMPTS} attempt(s)."
            echo "::error::last status=${status}${missing:+; missing: ${missing}}"
          } >&2
          echo "----- last response body (first 40 lines) -----" >&2
          head -n 40 "$BODY" >&2 || true
          exit 1

      - name: Summary
        if: always()
        env:
          PROJECT_NAME:   ${{ inputs.project_name }}
          BRANCH:         ${{ inputs.branch }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Cloudflare Pages — ${PROJECT_NAME}"
            echo ""
            echo "- Branch: \`${BRANCH}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-<not produced>}"
          } >> "$GITHUB_STEP_SUMMARY"
