name: Cleanup Secret Manager versions (reusable)

# Sweeps Secret Manager versions on a QUARANTINE policy: ENABLED -> DISABLED ->
# DESTROYED, with a mandatory dwell time in DISABLED between the two.
#
# Four reusables here add secret versions and none has ever removed one
# (manage-config-secrets, rotate-signing-keypair, rotate-worker-signing-secret,
# sync-bundle-key). Versions accumulate for the life of the secret, every one of
# them still holding retrievable plaintext, so exposure grows monotonically with
# rotation frequency — the opposite of what rotating is for. This is the sweep.
#
# THE SAFETY MODEL, and it is the whole point:
#
#   DESTROYED is irreversible. Google's own words: "After a version is destroyed,
#   you can't access the secret data or restore the version to another state."
#   Unlike a container image, it cannot be rebuilt. So destruction is never a
#   first action — a version must first sit DISABLED for `quarantine_days`,
#   during which re-enabling it is a single command and costs nothing but
#   $0.06/month.
#
#   `latest` is resolved SERVER-SIDE, at read time, to the highest-numbered
#   ENABLED version. Two consequences drive the keep-set:
#
#     1. Disabling the newest ENABLED version silently REPOINTS `latest` at an
#        older payload — a live config rollback, with no deploy and no signal.
#        So this workflow NEVER touches the version `latest` resolves to. That
#        is hard-coded, not an input, and asserted in the plan.
#
#     2. A Cloud Run VOLUME mount re-reads Secret Manager on every read, at
#        runtime — not at deploy time. Google: "When reading a volume, Cloud Run
#        always fetches the secret value from the Secret Manager." So there is no
#        "safe until the next deploy" window: a wrong destroy breaks a RUNNING
#        service on its next read. (Env-var refs differ — those resolve at
#        instance startup — but the volume case is the strict one and sets the
#        policy.) See DECISIONS.md 2026-08-16, which corrects the deploy-time
#        premise this workflow was originally specced against.
#
# Because "mounts :latest" tells you nothing about WHICH version is live, the
# sweep resolves consumers rather than trusting the revision spec: every Cloud
# Run Service and Job in-region is scanned for references to the target secrets,
# and any version pinned BY NUMBER is kept regardless of age or policy.
#
# The keep-set, per secret:
#   - the version `latest` currently resolves to               (never touchable)
#   - the newest `keep_enabled_count` ENABLED versions          (rollback window)
#   - every version pinned by number by a live Service or Job
#   - every version explicitly listed in `keep_versions`
#   - everything younger than `min_age_days`
#
# Everything else is DISABLED. A DISABLED version is DESTROYED only once it has
# been disabled for more than `quarantine_days` — and only when the caller has
# opted in with `enable_destroy: true`, which defaults to FALSE. Out of the box
# this workflow is fully reversible.
#
# Secret Manager stores no disabled-at timestamp (a version carries createTime,
# state and etag, nothing more), so the quarantine clock is read from Admin
# Activity audit logs, which retain DisableSecretVersion for 400 days and cannot
# be turned off. A version whose disable event cannot be found is HELD, never
# destroyed: absence of evidence is not evidence of an old-enough disable.
#
# THE FAIL-SAFE: if a target secret has no live consumer at all, the run ABORTS
# rather than sweeping it — the same reasoning as cleanup-gar-images' "no live
# digests resolved". Zero consumers means the scan is broken or the region is
# wrong far more often than it means the secret is genuinely unused. A secret
# consumed outside Cloud Run (GKE, external) needs `require_consumers: false`,
# which is an explicit statement that the caller has checked.
#
# The caller owns the schedule, the secret names and the dry_run decision. This
# workflow performs exactly what dry_run says. Run with dry_run: true first and
# read the plan.
#
# Required IAM on service_account:
#   roles/secretmanager.secretVersionManager  (disable/destroy + list versions)
#   roles/run.viewer                          (enumerate live Services + Jobs)
#   roles/logging.viewer                      (read the quarantine clock)
#
# secretmanager.secretAccessor is deliberately NOT required: the sweep reads
# metadata and never reads a payload, so it cannot leak one.

on:
  workflow_call:
    inputs:
      gcp_project:
        description: 'GCP project id owning the secrets.'
        type: string
        required: true
      gcp_region:
        description: 'Region of the Cloud Run Services/Jobs that consume the secrets.'
        type: string
        required: false
        default: 'asia-southeast1'
      wif_provider:
        description: 'Workload Identity Federation provider resource name.'
        type: string
        required: true
      service_account:
        description: 'Service account email to impersonate via WIF.'
        type: string
        required: true
      secrets_list:
        description: >-
          Comma-separated secret names to sweep (e.g. app-secrets,api-env). Empty
          means every secret in the project — convenient, but prefer naming them:
          an explicit list cannot silently grow to cover a secret nobody vetted.
        type: string
        required: false
        default: ''
      keep_enabled_count:
        description: >-
          Per secret, keep this many of the most recent ENABLED versions. Minimum
          1, and 1 means "keep only what `latest` resolves to" — no rollback
          version survives, so 2 is the lowest value that can express a rollback.
        type: string
        required: false
        default: '3'
      min_age_days:
        description: >-
          Never touch a version created within this many days, whatever the keep
          count says. This is the window in which a rotation is still being
          validated and a rollback is most likely.
        type: string
        required: false
        default: '7'
      quarantine_days:
        description: >-
          A DISABLED version must have been disabled for MORE than this many days
          before it can be destroyed. The clock starts at the DisableSecretVersion
          audit event, so a version this run disables can never be destroyed by
          the same run. 0 is rejected: it collapses the quarantine that makes
          destruction safe.
        type: string
        required: false
        default: '30'
      enable_destroy:
        description: >-
          false (DEFAULT) = quarantine only. Versions are disabled and the destroy
          plan is printed but nothing is destroyed, so every action the run takes
          is reversible. Set true only once you have read a plan you agree with.
        type: boolean
        required: false
        default: false
      require_consumers:
        description: >-
          true (DEFAULT) = abort if a target secret has no live Cloud Run consumer.
          Set false ONLY for a secret consumed outside Cloud Run, where the scan
          genuinely cannot see the consumer and you have verified it by hand.
        type: string
        required: false
        default: 'true'
      keep_versions:
        description: >-
          Comma-separated `secret:version` pins that are never disabled or
          destroyed (e.g. app-secrets:5,api-env:6). An escape hatch for a version
          held by something the consumer scan cannot see.
        type: string
        required: false
        default: ''
      dry_run:
        description: 'true = print the plan only, change nothing.'
        type: boolean
        required: false
        default: true
    outputs:
      to_disable:
        description: 'Number of versions the plan selected to disable.'
        value: ${{ jobs.cleanup.outputs.to_disable }}
      to_destroy:
        description: 'Number of versions the plan selected to destroy.'
        value: ${{ jobs.cleanup.outputs.to_destroy }}
      disabled:
        description: 'Number of versions actually disabled (0 on a dry run).'
        value: ${{ jobs.cleanup.outputs.disabled }}
      destroyed:
        description: 'Number of versions actually destroyed (0 on a dry run, or when enable_destroy is false).'
        value: ${{ jobs.cleanup.outputs.destroyed }}
      held:
        description: 'Versions eligible by policy but withheld — quarantine not yet served, or disable time unknown.'
        value: ${{ jobs.cleanup.outputs.held }}

permissions:
  contents: read
  id-token: write

concurrency:
  # A sweep mutates version state from a plan computed before it started; never
  # let two runs of the same project race, and never let one race a rotation.
  group: cleanup-secret-versions-${{ inputs.gcp_project }}
  cancel-in-progress: false

env:
  # Stamped by scripts/stamp_version.py at release time; CI asserts it matches
  # the tag. A called workflow cannot discover its own ref at runtime.
  WORKFLOW_VERSION: v2.2.0

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GCP_PROJECT:        ${{ inputs.gcp_project }}
      GCP_REGION:         ${{ inputs.gcp_region }}
      SECRETS_LIST:       ${{ inputs.secrets_list }}
      KEEP_ENABLED_COUNT: ${{ inputs.keep_enabled_count }}
      MIN_AGE_DAYS:       ${{ inputs.min_age_days }}
      QUARANTINE_DAYS:    ${{ inputs.quarantine_days }}
      ENABLE_DESTROY:     ${{ inputs.enable_destroy }}
      REQUIRE_CONSUMERS:  ${{ inputs.require_consumers }}
      KEEP_VERSIONS:      ${{ inputs.keep_versions }}
      DRY_RUN:            ${{ inputs.dry_run }}
    outputs:
      to_disable: ${{ steps.plan.outputs.to_disable }}
      to_destroy: ${{ steps.plan.outputs.to_destroy }}
      held:       ${{ steps.plan.outputs.held }}
      disabled:   ${{ steps.exec.outputs.disabled }}
      destroyed:  ${{ steps.exec.outputs.destroyed }}

    steps:
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account:            ${{ inputs.service_account }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Collect target secrets
        run: |
          set -euo pipefail
          gcloud secrets list --project="$GCP_PROJECT" --format='value(name)' | sort -u > /tmp/all-secrets.txt
          if [ -n "${SECRETS_LIST// /}" ]; then
            echo "$SECRETS_LIST" | tr ',' '\n' | tr -d '[:space:]' | grep -v '^$' | sort -u > /tmp/targets.txt
            # A named secret that does not exist is a typo, and a typo that
            # silently sweeps nothing is the worst outcome: it reads as success.
            missing=$(comm -23 /tmp/targets.txt /tmp/all-secrets.txt)
            if [ -n "$missing" ]; then
              echo "::error::secrets_list names secrets that do not exist in ${GCP_PROJECT}: $(echo "$missing" | tr '\n' ' ')"
              exit 1
            fi
          else
            echo "::warning::secrets_list is empty — sweeping EVERY secret in ${GCP_PROJECT}."
            cp /tmp/all-secrets.txt /tmp/targets.txt
          fi
          count=$(wc -l < /tmp/targets.txt | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::No target secrets resolved in ${GCP_PROJECT}. Aborting for safety."
            exit 1
          fi
          echo "Sweeping ${count} secret(s):"
          sed 's/^/  - /' /tmp/targets.txt

      - name: Collect live secret consumers (all Services + Jobs)
        run: |
          set -euo pipefail
          # A revision that mounts `<secret>:latest` tells us nothing about which
          # version is live — `latest` is resolved server-side at read time. So we
          # record two different facts per secret: versions pinned BY NUMBER
          # (which must be kept outright) and whether anything reads via `latest`
          # (which is why the latest-resolving version is untouchable).
          : > /tmp/refs.ndjson

          collect() {
            local kind="$1"; shift
            local -a cmd=("$@")
            local name
            while read -r name; do
              [ -z "$name" ] && continue
              if ! gcloud "${cmd[@]}" describe "$name" \
                    --project="$GCP_PROJECT" --region="$GCP_REGION" \
                    --format=json > /tmp/res.json 2>/dev/null; then
                echo "::error::Could not describe ${kind}/${name}. Aborting rather than sweeping on a partial consumer map."
                exit 1
              fi
              python3 - "$kind" "$name" >> /tmp/refs.ndjson <<'PY'
          import json, sys
          kind, name = sys.argv[1], sys.argv[2]
          res = json.load(open("/tmp/res.json"))

          def emit(secret, key):
              print(json.dumps({"kind": kind, "resource": name,
                                "secret": secret, "key": str(key)}))

          def walk(spec):
              # Volume mounts: spec.template.spec.volumes[].secret{secretName,items[].key}
              for vol in (spec.get("volumes") or []):
                  sec = vol.get("secret") or {}
                  sec_name = sec.get("secretName") or sec.get("secret")
                  if not sec_name:
                      continue
                  items = sec.get("items") or []
                  if items:
                      for it in items:
                          emit(sec_name, it.get("version") or it.get("key") or "latest")
                  else:
                      emit(sec_name, "latest")
              # Env vars: containers[].env[].valueFrom.secretKeyRef{name,key}
              for c in (spec.get("containers") or []):
                  for e in (c.get("env") or []):
                      ref = ((e.get("valueFrom") or {}).get("secretKeyRef") or {})
                      if ref.get("name"):
                          emit(ref["name"], ref.get("key") or "latest")

          spec = (((res.get("spec") or {}).get("template") or {}).get("spec") or {})
          walk(spec)
          # Cloud Run Jobs nest one level deeper: spec.template.spec.template.spec
          walk(((spec.get("template") or {}).get("spec") or {}))
          PY
            done < <(gcloud "${cmd[@]}" list --project="$GCP_PROJECT" \
                       --region="$GCP_REGION" --format='value(metadata.name)')
          }

          collect service run services
          collect job run jobs

          python3 <<'PY'
          import json, pathlib
          refs = [json.loads(l) for l in pathlib.Path("/tmp/refs.ndjson").read_text().splitlines() if l.strip()]
          json.dump(refs, open("/tmp/consumer-refs.json", "w"), indent=2)
          print(f"Resolved {len(refs)} secret reference(s) across live Services and Jobs.")
          for r in refs:
              print(f"  {r['kind']}/{r['resource']} -> {r['secret']}:{r['key']}")
          PY

      - name: Collect secret versions and quarantine clock
        run: |
          set -euo pipefail
          : > /tmp/versions.ndjson
          : > /tmp/disabled-at.ndjson

          while read -r secret; do
            [ -z "$secret" ] && continue
            # `latest` is resolved by the SERVER, not derived by us — the whole
            # keep-set hangs off this value, so it must come from the same
            # resolution the consumers will perform.
            latest=$(gcloud secrets versions describe latest --secret="$secret" \
                       --project="$GCP_PROJECT" --format='value(name)' 2>/dev/null \
                       | awk -F/ '{print $NF}' || true)
            if [ -z "$latest" ]; then
              echo "::error::${secret} has no version that 'latest' resolves to (no ENABLED version). Aborting — this secret is already broken and a sweep is not the fix."
              exit 1
            fi
            # Via a file, not a pipe: the heredoc below already claims stdin, so a
            # pipe into it would be silently overridden (shellcheck SC2259).
            gcloud secrets versions list "$secret" --project="$GCP_PROJECT" \
              --format="json(name,state,createTime,etag)" > /tmp/version-list.json
            python3 - "$secret" "$latest" >> /tmp/versions.ndjson <<'PY'
          import json, sys
          secret, latest = sys.argv[1], sys.argv[2]
          for v in json.load(open("/tmp/version-list.json")):
              print(json.dumps({
                  "secret":     secret,
                  "version":    int(v["name"].rsplit("/", 1)[-1]),
                  "state":      v.get("state", ""),
                  "createTime": v.get("createTime", ""),
                  "etag":       (v.get("etag") or "").strip('"'),
                  "latest":     int(latest),
              }))
          PY
          done < /tmp/targets.txt

          # Secret Manager records no disabled-at timestamp, so the quarantine
          # clock comes from Admin Activity audit logs (400-day retention, cannot
          # be disabled). A version with no disable event found is HELD by the
          # plan — never destroyed on an unknown clock.
          gcloud logging read \
            'protoPayload.methodName="google.cloud.secretmanager.v1.SecretManagerService.DisableSecretVersion"' \
            --project="$GCP_PROJECT" --freshness=400d --limit=10000 \
            --format='json(timestamp,protoPayload.resourceName)' > /tmp/disable-events.json
          python3 - >> /tmp/disabled-at.ndjson <<'PY'
          import json
          seen = {}
          for e in json.load(open("/tmp/disable-events.json")):
              rn = (e.get("protoPayload") or {}).get("resourceName") or ""
              parts = rn.split("/")
              if len(parts) < 6 or parts[-2] != "versions":
                  continue
              key = (parts[-3], int(parts[-1]))
              ts = e.get("timestamp", "")
              # Keep the MOST RECENT disable: a version disabled, re-enabled, then
              # disabled again has only served quarantine since the last one.
              if key not in seen or ts > seen[key]:
                  seen[key] = ts
          for (secret, version), ts in seen.items():
              print(json.dumps({"secret": secret, "version": version, "disabledAt": ts}))
          PY
          echo "Collected $(wc -l < /tmp/versions.ndjson | tr -d ' ') version(s), $(wc -l < /tmp/disabled-at.ndjson | tr -d ' ') disable event(s)."

      - name: Compute plan
        id: plan
        run: |
          set -euo pipefail
          python3 <<'PY' | tee /tmp/secret-plan.json
          import json, os, sys
          from datetime import datetime, timezone

          def die(msg):
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          def parse_ts(s):
              if not s:
                  return None
              return datetime.fromisoformat(s.replace("Z", "+00:00"))

          # PLAN_FIXTURE is the CI self-test seam: read the whole collected state
          # from a file instead of the runner's /tmp, so tests exercise THIS source
          # rather than a re-implementation of it.
          fixture = os.environ.get("PLAN_FIXTURE", "")
          if fixture:
              state = json.load(open(fixture))
              versions = state["versions"]
              refs = state["consumers"]
              disabled_at = {(d["secret"], d["version"]): d["disabledAt"] for d in state.get("disabledAt", [])}
              now = parse_ts(state["now"])
          else:
              def ndjson(path):
                  with open(path) as fh:
                      return [json.loads(l) for l in fh if l.strip()]
              versions = ndjson("/tmp/versions.ndjson")
              refs = json.load(open("/tmp/consumer-refs.json"))
              disabled_at = {(d["secret"], d["version"]): d["disabledAt"] for d in ndjson("/tmp/disabled-at.ndjson")}
              now = datetime.now(timezone.utc)

          KEEP_ENABLED_COUNT = int(os.environ.get("KEEP_ENABLED_COUNT", "3"))
          MIN_AGE_DAYS = float(os.environ.get("MIN_AGE_DAYS", "7"))
          QUARANTINE_DAYS = float(os.environ.get("QUARANTINE_DAYS", "30"))
          REQUIRE_CONSUMERS = os.environ.get("REQUIRE_CONSUMERS", "true").lower() == "true"

          if KEEP_ENABLED_COUNT < 1:
              die("keep_enabled_count must be at least 1 — 0 would select the version 'latest' resolves to.")
          if QUARANTINE_DAYS <= 0:
              die("quarantine_days must be greater than 0 — a zero quarantine collapses the dwell time that makes an irreversible destroy safe.")
          if MIN_AGE_DAYS < 0:
              die("min_age_days cannot be negative.")

          # Explicit pins: `secret:version`, never touched.
          pinned_by_input = set()
          for tok in (os.environ.get("KEEP_VERSIONS", "") or "").split(","):
              tok = tok.strip()
              if not tok:
                  continue
              if ":" not in tok:
                  die(f"keep_versions entry {tok!r} is not in `secret:version` form.")
              name, _, num = tok.rpartition(":")
              if not num.isdigit():
                  die(f"keep_versions entry {tok!r} has a non-numeric version.")
              pinned_by_input.add((name, int(num)))

          by_secret = {}
          for v in versions:
              by_secret.setdefault(v["secret"], []).append(v)

          plan = {"disable": [], "destroy": [], "held": [], "secrets": {}}

          for secret in sorted(by_secret):
              vers = sorted(by_secret[secret], key=lambda v: v["version"], reverse=True)
              latest = vers[0]["latest"]

              sec_refs = [r for r in refs if r["secret"] == secret]
              if not sec_refs and REQUIRE_CONSUMERS:
                  die(f"No live Cloud Run consumer references {secret}. Aborting for safety — "
                      f"a broken scan or a wrong region looks exactly like this. Set "
                      f"require_consumers: false if this secret is genuinely consumed elsewhere.")

              # Versions a consumer pins BY NUMBER are kept outright: no age, count
              # or quarantine policy may select one.
              pinned = {int(r["key"]) for r in sec_refs if str(r["key"]).isdigit()}
              uses_latest = any(not str(r["key"]).isdigit() for r in sec_refs)

              enabled = [v for v in vers if v["state"] == "ENABLED"]
              disabled = [v for v in vers if v["state"] == "DISABLED"]

              # THE INVARIANT: the version `latest` resolves to is never actionable.
              # Disabling it repoints `latest` at an older payload — a live rollback
              # with no deploy behind it. Normally `latest` IS enabled[0], so this
              # term looks redundant; it stops being redundant the moment a rotation
              # lands between the two collection calls, which is exactly when an
              # irreversible mistake would otherwise be made.
              keep = {latest}
              keep |= {v["version"] for v in enabled[:KEEP_ENABLED_COUNT]}
              keep |= pinned
              keep |= {n for (s, n) in pinned_by_input if s == secret}
              for v in vers:
                  created = parse_ts(v["createTime"])
                  if created is not None and (now - created).total_seconds() < MIN_AGE_DAYS * 86400:
                      keep.add(v["version"])

              to_disable, to_destroy, held = [], [], []

              for v in enabled:
                  if v["version"] in keep:
                      continue
                  to_disable.append(v)

              for v in disabled:
                  if v["version"] in keep:
                      continue
                  ts = parse_ts(disabled_at.get((secret, v["version"])))
                  if ts is None:
                      held.append({**v, "reason": "disable time unknown — no DisableSecretVersion audit event found"})
                      continue
                  days = (now - ts).total_seconds() / 86400
                  if days <= QUARANTINE_DAYS:
                      held.append({**v, "reason": f"quarantine not served ({days:.1f}d of {QUARANTINE_DAYS:g}d)"})
                      continue
                  to_destroy.append({**v, "quarantineDays": round(days, 1)})

              # Defence in depth: these are bugs, not policy outcomes, and must never
              # be reachable. Failing loudly is cheaper than an irreversible destroy.
              for v in to_disable + to_destroy:
                  if v["version"] == latest:
                      die(f"BUG: plan selected {secret}:{latest}, the version 'latest' resolves to.")
              if len(enabled) - len(to_disable) < 1:
                  die(f"BUG: plan would leave {secret} with no ENABLED version.")

              plan["disable"].extend(to_disable)
              plan["destroy"].extend(to_destroy)
              plan["held"].extend(held)
              plan["secrets"][secret] = {
                  "latest": latest, "enabled": len(enabled), "disabled": len(disabled),
                  "consumers": len(sec_refs), "pinned": sorted(pinned), "usesLatest": uses_latest,
                  "toDisable": [v["version"] for v in to_disable],
                  "toDestroy": [v["version"] for v in to_destroy],
                  "heldCount": len(held),
              }

          print(json.dumps(plan, indent=2))

          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a") as fh:
                  fh.write(f"to_disable={len(plan['disable'])}\n")
                  fh.write(f"to_destroy={len(plan['destroy'])}\n")
                  fh.write(f"held={len(plan['held'])}\n")
          PY

      - name: Print plan
        run: |
          set -euo pipefail
          python3 <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          plan = json.load(open("/tmp/secret-plan.json"))
          dry = os.environ.get("DRY_RUN", "true").lower() == "true"
          destroy_on = os.environ.get("ENABLE_DESTROY", "false").lower() == "true"

          print("## Secret Manager version sweep")
          print()
          print(f"- mode: **{'DRY RUN — nothing will change' if dry else 'APPLY'}**")
          print(f"- destroy: **{'enabled' if destroy_on else 'DISABLED (quarantine only)'}**")
          print()
          print("| secret | latest | enabled | disabled | consumers | to disable | to destroy | held |")
          print("|---|---:|---:|---:|---:|---|---|---:|")
          for name, s in sorted(plan["secrets"].items()):
              print(f"| `{name}` | {s['latest']} | {s['enabled']} | {s['disabled']} | {s['consumers']} "
                    f"| {', '.join(map(str, s['toDisable'])) or '—'} "
                    f"| {', '.join(map(str, s['toDestroy'])) or '—'} | {s['heldCount']} |")
          print()
          if plan["held"]:
              print("### Held back")
              for v in plan["held"]:
                  print(f"- `{v['secret']}:{v['version']}` — {v['reason']}")
              print()
          if plan["destroy"] and not destroy_on:
              print("> These versions have served quarantine and are eligible for destruction.")
              print("> Nothing will be destroyed while `enable_destroy` is false.")
          PY

      - name: Execute
        id: exec
        run: |
          set -euo pipefail
          disabled=0
          destroyed=0

          if [ "${DRY_RUN,,}" = "true" ]; then
            echo "::notice::Dry run — no version state was changed."
          else
            # Disable first. Every mutation carries the etag read at plan time, so a
            # rotation that landed in between fails the call instead of acting on a
            # stale plan.
            while read -r secret version etag; do
              [ -z "$secret" ] && continue
              if gcloud secrets versions disable "$version" --secret="$secret" \
                   --project="$GCP_PROJECT" --etag="$etag"; then
                disabled=$((disabled + 1))
                echo "disabled ${secret}:${version}"
              else
                echo "::warning::Could not disable ${secret}:${version} — etag moved (a rotation landed mid-run) or permission denied. Left as found."
              fi
            done < <(python3 -c 'import json;[print(v["secret"],v["version"],v["etag"]) for v in json.load(open("/tmp/secret-plan.json"))["disable"]]')

            if [ "${ENABLE_DESTROY,,}" = "true" ]; then
              # Re-resolve `latest` immediately before destroying. The plan is
              # minutes old by now and destruction cannot be undone; if anything
              # moved, this is the last place to notice.
              while read -r secret version etag; do
                [ -z "$secret" ] && continue
                live_latest=$(gcloud secrets versions describe latest --secret="$secret" \
                                --project="$GCP_PROJECT" --format='value(name)' \
                                | awk -F/ '{print $NF}')
                if [ "$live_latest" = "$version" ]; then
                  echo "::error::REFUSING to destroy ${secret}:${version} — it is what 'latest' resolves to right now. State moved since the plan was computed."
                  exit 1
                fi
                if gcloud secrets versions destroy "$version" --secret="$secret" \
                     --project="$GCP_PROJECT" --etag="$etag" --quiet; then
                  destroyed=$((destroyed + 1))
                  echo "destroyed ${secret}:${version}"
                else
                  echo "::warning::Could not destroy ${secret}:${version} — etag moved or permission denied. Left as found."
                fi
              done < <(python3 -c 'import json;[print(v["secret"],v["version"],v["etag"]) for v in json.load(open("/tmp/secret-plan.json"))["destroy"]]')
            else
              eligible=$(python3 -c 'import json;print(len(json.load(open("/tmp/secret-plan.json"))["destroy"]))')
              echo "::notice::enable_destroy is false — ${eligible} eligible version(s) left disabled."
            fi
          fi

          {
            echo "disabled=$disabled"
            echo "destroyed=$destroyed"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::disabled=${disabled} destroyed=${destroyed}"
